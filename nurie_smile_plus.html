<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffeff7">
<title>ぬりえスマイル 🌈</title>
<style>
:root{--pink:#ff78ad;--purple:#9a7be8;--ink:#594b69;--cream:#fffaf0}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(160deg,#fff0f7,#eef8ff 55%,#f4f0ff);min-height:100vh}
button{font:inherit;cursor:pointer}main{max-width:760px;margin:auto;padding:14px 14px 38px}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}.brand{font-weight:900;color:#e65f9a;font-size:17px}.pill{border:0;border-radius:30px;padding:9px 13px;background:#fff;box-shadow:0 3px 10px #9e7da522;color:var(--ink)}
.hero{position:relative;overflow:hidden;border:4px solid white;border-radius:32px;padding:22px 16px 24px;text-align:center;background:linear-gradient(135deg,#ffe0ef,#fff3c9 55%,#e5f5ff);box-shadow:0 9px 25px #c9a8ce44}
.hero:before,.hero:after{content:"✦";position:absolute;color:#fff;font-size:35px;opacity:.9}.hero:before{top:13px;left:18px}.hero:after{right:22px;bottom:20px}
h1{font-size:clamp(29px,7vw,43px);line-height:1.2;margin:4px 0 8px;color:#e85d9c;text-shadow:2px 3px 0 white;font-weight:1000;letter-spacing:1px}
.sub{font-weight:700;margin:5px 0 12px}.friends{display:flex;justify-content:center;align-items:end;gap:8px;margin:7px auto 14px}
.friend{width:clamp(76px,22vw,112px);height:clamp(76px,22vw,112px);display:grid;place-items:center;border:4px solid white;border-radius:34px;background:#fff9;box-shadow:0 5px 0 #e8c5d9;font-size:clamp(43px,12vw,66px);transform:rotate(-4deg)}
.friend:nth-child(2){transform:translateY(-8px) rotate(3deg);background:#fff5d8}.friend:nth-child(3){transform:rotate(5deg);background:#e9f8ff}
.start{border:0;border-radius:999px;padding:15px 27px;background:linear-gradient(90deg,#ff70a9,#ff9c83);color:white;font-size:20px;font-weight:900;box-shadow:0 6px 0 #dc5e91,0 10px 18px #d66b9844}
.start:active{transform:translateY(4px);box-shadow:0 2px 0 #dc5e91}
.features{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:17px}.feature{background:#fff;border-radius:20px;padding:7px 11px;font-size:12px;font-weight:800}
.section{margin:20px 2px 10px;font-size:20px;font-weight:900}.section span{color:#ef79a8}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.stat{background:#fff;border-radius:18px;padding:11px 4px;font-weight:900;font-size:13px;box-shadow:0 3px 10px #9e7da51c}.stat b{display:block;color:#e86a9e;font-size:21px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.cat{border:3px solid white;border-radius:22px;padding:14px 9px;text-align:left;background:#fff;box-shadow:0 4px 12px #9e7da522;color:var(--ink);font-weight:900;min-height:88px}.cat .emoji{font-size:29px;display:block;margin-bottom:5px}.cat small{font-size:11px;color:#998ba1}
.pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.page{background:white;border:2px solid white;border-radius:19px;padding:12px;text-align:left;color:var(--ink);box-shadow:0 3px 10px #9e7da522}.page .thumb{height:85px;border-radius:13px;background:linear-gradient(135deg,#fff0f7,#eef8ff);display:grid;place-items:center;font-size:43px}.page b{display:block;margin-top:7px}.page small{color:#9b8da2}
.panel{background:white;border:3px solid white;border-radius:25px;padding:13px;box-shadow:0 5px 15px #9e7da522}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.back{border:0;border-radius:20px;padding:9px 13px;background:#f8edf7;color:#725d7c;font-weight:800}
#drawing{display:block;width:100%;max-width:520px;height:auto;margin:auto;background:white;border:2px dashed #f4b8d1;border-radius:17px;touch-action:manipulation}
.palette{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin:14px 0 8px}.swatch{aspect-ratio:1;border:2px solid white;border-radius:50%;box-shadow:0 0 0 1px #ddd}.swatch.selected{outline:3px solid #66547a;outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.action{border:0;border-radius:20px;padding:11px 14px;background:#f3edff;color:#66547a;font-weight:900}.action.primary{background:#ff8ab8;color:white}
.hidden{display:none!important}.hint{text-align:center;color:#96879e;font-size:12px;line-height:1.6}.saved-list{display:flex;gap:9px;overflow:auto}.saved-item{min-width:100px;background:white;border-radius:14px;padding:8px;font-size:12px}
@media(min-width:560px){.grid,.pages{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{padding:30px}}
</style>
</head>
<body><main>
<div class="top"><div class="brand">🌈 ぬりえスマイル</div><button class="pill" onclick="showSaved()">💖 作品アルバム</button></div>
<section id="home">
<div class="hero">
<div style="font-size:13px;font-weight:900;color:#a36e9c">✨ たのしい ぬりえのじかん ✨</div>
<h1>ぬりえスマイル</h1>
<div class="sub">すきな色で、きみだけの作品をつくろう！</div>
<div class="friends"><div class="friend">🐱</div><div class="friend">🐻</div><div class="friend">🐰</div></div>
<button class="start" onclick="showCategories()">🎨 ぬりえを はじめる！</button>
<div class="features"><span class="feature">🌟 たっぷり1000作品</span><span class="feature">🖍️ 96色</span><span class="feature">💗 広告なし</span></div>
</div>
<div class="stats"><div class="stat"><b>1,000</b>ぬりえ</div><div class="stat"><b>96</b>カラー</div><div class="stat"><b>0</b>広告・懸賞</div></div>
<h2 class="section">💝 きょうのおすすめ</h2>
<div class="grid">
<button class="cat" onclick="openPage(0,0)"><span class="emoji">🐱</span>にこにこ にゃんこ<small>　かんたん・たのしい</small></button>
<button class="cat" onclick="openPage(4,1)"><span class="emoji">🌼</span>おはなの はなかんむり<small>　かわいく ぬろう</small></button>
</div>
</section>
<section id="categories" class="hidden">
<div class="toolbar"><button class="back" onclick="showHome()">← ホーム</button><span>💖 カテゴリーをえらんでね</span></div>
<h2 class="section">どれをぬってみる？</h2><div id="catgrid" class="grid"></div>
</section>
<section id="pages" class="hidden">
<div class="toolbar"><button class="back" onclick="showCategories()">← カテゴリー</button><b id="categoryTitle"></b></div>
<p class="hint">すきな絵をタップしてね。各カテゴリーに100作品あるよ！</p><div id="pagegrid" class="pages"></div>
</section>
<section id="editor" class="hidden">
<div class="toolbar"><button class="back" onclick="showPages()">← もどる</button><b id="pageTitle">ぬりえ</b><button class="back" onclick="resetPage()">↻ もとにもどす</button></div>
<div class="panel"><svg id="drawing" viewBox="0 0 400 400" role="img" aria-label="ぬりえ"></svg>
<p class="hint">① 下の色をえらぶ　② 絵の中をタップして色をぬろう</p>
<div id="palette" class="palette"></div>
<div class="actions"><button class="action primary" onclick="saveArtwork()">💾 作品を保存</button><button class="action" onclick="downloadArtwork()">📥 画像をダウンロード</button></div>
</div>
</section>
<section id="saved" class="hidden">
<div class="toolbar"><button class="back" onclick="showHome()">← ホーム</button><b>💖 作品アルバム</b></div>
<p class="hint">この端末に保存した作品だよ。</p><div id="savedList" class="saved-list"></div>
</section>
<p class="hint" style="margin-top:22px">ぬりえスマイル 🌈 たのしく、じゆうに、ぬってみよう！</p>
</main>
<script>
const categories=[["どうぶつ","🐶"],["のりもの","🚗"],["きょうりゅう","🦕"],["うちゅう","🚀"],["おはな","🌸"],["おかし","🍰"],["おひめさま","👑"],["うみ","🐠"],["きせつ","🍁"],["ぼうけん","🧭"]];
const $=id=>document.getElementById(id);let currentCat=0,currentPage=0,chosen="#ff5f9e";
function hideAll(){["home","categories","pages","editor","saved"].forEach(x=>$(x).classList.add("hidden"))}
function showHome(){hideAll();$("home").classList.remove("hidden")}
function showCategories(){hideAll();$("categories").classList.remove("hidden")}
function showPages(){hideAll();$("pages").classList.remove("hidden")}
function showSaved(){hideAll();$("saved").classList.remove("hidden");renderSaved()}
$("catgrid").innerHTML=categories.map((c,i)=>`<button class="cat" onclick="selectCategory(${i})"><span class="emoji">${c[1]}</span>${c[0]}<small>　100作品</small></button>`).join("");
function selectCategory(i){currentCat=i;$("categoryTitle").textContent=categories[i][1]+" "+categories[i][0];$("pagegrid").innerHTML=Array.from({length:100},(_,n)=>`<button class="page" onclick="openPage(${i},${n})"><div class="thumb">${categories[i][1]}</div><b>${categories[i][0]} ${String(n+1).padStart(3,"0")}</b><small>タップしてぬる</small></button>`).join("");hideAll();$("pages").classList.remove("hidden")}
function showPages(){selectCategory(currentCat)}
const colors=[];for(let h=0;h<360;h+=15){for(let l of [42,58,72])colors.push(`hsl(${h} 82% ${l}%)`)}colors.push("#222222","#555555","#888888","#bbbbbb","#eeeeee","#ffffff","#8b5a2b","#d9a066","#ffd9b8","#f6e6d2","#ffb6c1","#a8d8ff"); 
$("palette").innerHTML=colors.map((c,i)=>`<button class="swatch ${i===0?"selected":""}" style="background:${c}" aria-label="色${i+1}" onclick="chooseColor(this,'${c}')"></button>`).join("");
function chooseColor(el,c){chosen=c;document.querySelectorAll(".swatch").forEach(x=>x.classList.remove("selected"));el.classList.add("selected")}
function shapeSVG(cat,n){let e=[];const fill='fill="#fff" stroke="#333" stroke-width="5" stroke-linejoin="round"'; 
// 10 category-inspired original, simple shapes; every page varies its arrangement.
if(cat===0||cat===2){e.push(`<ellipse cx="200" cy="230" rx="${90+n%18}" ry="105" ${fill}/><path d="M125 155 L105 55 L180 115 M275 155 L295 55 L220 115" ${fill}/><circle cx="165" cy="215" r="10" ${fill}/><circle cx="235" cy="215" r="10" ${fill}/><path d="M180 265 Q200 285 220 265" ${fill}/>`);for(let k=0;k<3;k++)e.push(`<circle cx="${125+k*75}" cy="${310+(k%2)*18}" r="22" ${fill}/>`)}
else if(cat===4||cat===6){e.push(`<circle cx="200" cy="205" r="92" ${fill}/>`);for(let k=0;k<8;k++){let a=k*Math.PI/4,x=200+Math.cos(a)*115,y=205+Math.sin(a)*115;e.push(`<ellipse cx="${x}" cy="${y}" rx="28" ry="48" transform="rotate(${k*45} ${x} ${y})" ${fill}/>`)}e.push(`<circle cx="200" cy="205" r="30" ${fill}/>`)}
else if(cat===1){e.push(`<path d="M65 250 L95 175 L260 175 L315 230 L340 250 L340 300 L60 300 Z" ${fill}/><circle cx="125" cy="300" r="32" ${fill}/><circle cx="280" cy="300" r="32" ${fill}/><rect x="125" y="195" width="70" height="50" rx="8" ${fill}/><rect x="205" y="195" width="55" height="50" rx="8" ${fill}/>`)}
else if(cat===3){e.push(`<path d="M200 55 L270 280 L200 250 L130 280 Z" ${fill}/><path d="M130 210 L65 275 L140 265 M270 210 L335 275 L260 265" ${fill}/><circle cx="200" cy="185" r="30" ${fill}/><path d="M165 285 L145 340 L200 315 L255 340 L235 285" ${fill}/>`)}
else if(cat===5){e.push(`<path d="M90 270 Q80 180 200 180 Q320 180 310 270 Z" ${fill}/><path d="M80 270 Q200 315 320 270 L300 330 L100 330 Z" ${fill}/>`);for(let k=0;k<5;k++)e.push(`<circle cx="${125+k*38}" cy="${180+(k%2)*18}" r="23" ${fill}/>`)}
else if(cat===7){e.push(`<path d="M65 205 Q200 70 335 205 Q200 340 65 205 Z" ${fill}/><circle cx="200" cy="205" r="48" ${fill}/><path d="M245 205 L330 145 L330 265 Z" ${fill}/><circle cx="185" cy="195" r="8" fill="#333"/>`)}
else if(cat===8){e.push(`<path d="M200 320 Q80 230 125 135 Q220 125 200 320 Z" ${fill}/><path d="M200 320 Q320 230 275 135 Q180 125 200 320 Z" ${fill}/><path d="M200 320 L200 95" fill="none" stroke="#333" stroke-width="6"/>`)}
else {e.push(`<path d="M200 60 L230 165 L340 165 L250 230 L285 340 L200 275 L115 340 L150 230 L60 165 L170 165 Z" ${fill}/><circle cx="200" cy="205" r="38" ${fill}/>`)}
for(let k=0;k<4;k++){let x=75+(k*83+n*13)%250,y=70+(k*59+n*17)%260;e.push(`<circle cx="${x}" cy="${y}" r="13" ${fill}/>`)}
return e.join("")}
function openPage(c,n){currentCat=c;currentPage=n;hideAll();$("editor").classList.remove("hidden");$("pageTitle").textContent=categories[c][1]+" "+categories[c][0]+" "+(n+1);$("drawing").innerHTML=shapeSVG(c,n);$("drawing").querySelectorAll("path,ellipse,circle,rect").forEach(el=>{el.addEventListener("click",()=>el.setAttribute("fill",chosen));el.style.cursor="pointer"})}
function resetPage(){openPage(currentCat,currentPage)}
function svgData(){let s=$("drawing").cloneNode(true);s.setAttribute("xmlns","http://www.w3.org/2000/svg");return new XMLSerializer().serializeToString(s)}
function downloadArtwork(){let blob=new Blob([svgData()],{type:"image/svg+xml"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`nurie-${currentCat+1}-${currentPage+1}.svg`;a.click();URL.revokeObjectURL(url)}
function saveArtwork(){try{let arr=JSON.parse(localStorage.getItem("nurieSmileSaved")||"[]");arr.unshift({title:$("pageTitle").textContent,svg:svgData(),date:new Date().toLocaleDateString("ja-JP")});localStorage.setItem("nurieSmileSaved",JSON.stringify(arr.slice(0,30)));alert("作品アルバムに保存したよ！💖")}catch(e){alert("保存できなかったよ。画像ダウンロードを使ってね。")}}
function renderSaved(){let arr=JSON.parse(localStorage.getItem("nurieSmileSaved")||"[]");$("savedList").innerHTML=arr.length?arr.map(x=>`<div class="saved-item">${x.title}<br><small>${x.date}</small></div>`).join(""):"まだ作品がないよ。ぬりえを完成させて保存してね！"}
</script></body></html>
