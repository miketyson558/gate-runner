<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f3efe6"><title>みんなのジグソーパズル</title>
<style>
:root{--navy:#082f57;--blue:#1265a7;--gold:#f6b92f;--cream:#fff6e6;--ink:#17324d}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(145deg,#073b68,#1684b4 52%,#f0c77b);min-height:100vh}.app{max-width:960px;margin:auto;padding:12px}.hero{position:relative;overflow:hidden;border:3px solid #f6d28a;border-radius:24px;padding:22px 18px;color:#fff;text-shadow:0 2px 4px #123;background:linear-gradient(110deg,rgba(4,38,72,.86),rgba(7,93,145,.48)),url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=85") center/cover;box-shadow:0 8px 20px #062c4b88;margin-bottom:12px}.hero:after{content:"🧩";position:absolute;right:16px;top:12px;font-size:54px;filter:drop-shadow(0 3px 3px #123)}.hero .muted{color:#fff;font-weight:700}.hero h1{font-size:clamp(23px,5vw,34px);margin:5px 55px 5px 0;letter-spacing:.03em}.hero .tagline{font-weight:700;font-size:13px}.panel{background:linear-gradient(145deg,#fffdf7,#f4e5c9);border:2px solid #e7c27b;border-radius:20px;padding:13px;margin-bottom:12px;box-shadow:0 6px 16px #062c4b55}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field label{display:block;font-size:12px;font-weight:800;margin:0 0 5px;color:#17446a}.field select,.field button,button{font:inherit;border:1px solid #b8c9d8;border-radius:12px;padding:11px;background:#fff;color:#143b5c;min-height:42px}select{width:100%;font-weight:700}.field input[type=file]{font-size:11px;max-width:100%}.gallery{display:flex;gap:9px;overflow-x:auto;padding:9px 0}.photo{flex:0 0 112px;border:2px solid transparent;padding:4px;border-radius:13px;background:#e5edf2}.photo.active{border-color:#f2a900;box-shadow:0 0 0 2px #fff}.photo img{width:100%;height:70px;object-fit:cover;border-radius:9px;display:block}.photo span{font-size:11px;display:block;padding:4px;font-weight:700}.buttons{display:flex;gap:8px;margin-top:10px}.buttons button{flex:1;font-size:12px;font-weight:800}.primary{background:linear-gradient(#73df52,#24a92d)!important;color:#fff!important;border:2px solid #eaffc9!important;box-shadow:0 4px 0 #16742b,0 5px 12px #286a3c55}#preview{background:linear-gradient(#fff,#dcecf7);font-weight:800}.boardwrap{background:linear-gradient(135deg,#a96c39,#70401f);border:5px solid #e8bd77;border-radius:19px;padding:8px;margin-top:10px;box-shadow:inset 0 2px 5px #fff7,0 5px 12px #4b2c1888}canvas{display:block;width:100%;height:auto;touch-action:none;border-radius:9px;background:#e9e1d1}.legend{font-size:12px;line-height:1.8;margin-top:9px;color:#31516b}.stats{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-top:8px;font-weight:800}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#082f57;color:white;padding:11px 16px;border:1px solid #f6c65d;border-radius:30px;font-size:12px;display:none;z-index:5}.toast.show{display:block}@media(min-width:700px){.controls{grid-template-columns:repeat(4,1fr)}.app{padding:18px}}
</style></head><body><main class="app"><section class="hero"><div class="muted">広告・懸賞なし　｜　写真で楽しむ本格パズル</div><h1>みんなのジグソーパズル</h1><div class="tagline">ピースをつなげて、あなただけの景色を完成させよう！</div></section>
<section class="panel"><div class="controls"><div class="field"><label>ピース数</label><select id="count"><option>9</option><option>10</option><option>16</option><option>20</option><option>25</option><option>30</option><option>40</option><option>50</option><option>100</option><option>144</option><option>196</option><option>256</option></select></div><div class="field"><label>回転の難易度</label><select id="rotate"><option value="off">回転なし（かんたん）</option><option value="on">回転あり（むずかしい）</option></select></div><div class="field"><label>ピース操作</label><button id="mix" class="primary">🔀 ピースを並べ直す</button></div><div class="field"><label>写真</label><label style="display:block"><input id="upload" type="file" accept="image/*" style="width:100%;font-size:11px"></label></div></div>
<div class="muted" style="margin-top:12px">写真・イラストを選ぶ（横にスライド）</div><div class="gallery" id="gallery"></div><div class="buttons"><button id="preview">👀 完成図を見る</button><button id="restart" class="primary">↻ 最初から</button></div></section>
<section class="panel"><div class="stats"><b id="progress">0 / 9 ピース</b><span id="status">ピースをドラッグしてね</span></div><div class="boardwrap"><canvas id="game" width="720" height="900"></canvas></div><div class="legend">📱 <b>遊び方：</b>ピースを指でドラッグして、正しい場所に置こう。回転ありの場合は、ピースをタップすると90度回転するよ。正しい場所に置くとピタッとはまるよ。</div></section></main><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
const photos=[
['山と湖','https://images.unsplash.com/photo-1559310589-2673bfe16970?auto=format&fit=crop&w=1200&q=85'],
['青い湖','https://images.unsplash.com/photo-1503614472-8c93d56e92ce?auto=format&fit=crop&w=1200&q=85'],
['朝日の山','https://images.unsplash.com/photo-1526943604017-955071a1fb3e?auto=format&fit=crop&w=1200&q=85'],
['海と山','https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1200&q=85'],
['花畑','https://images.unsplash.com/photo-1490740141103-6cac27aaab94?auto=format&fit=crop&w=1200&q=85']];
let img=new Image(),photoIndex=0,customURL='',pieces=[],cols=3,rows=3,unit=100,boardX=30,boardY=30,boardW=660,boardH=660,trayY=720,drag=null,completed=0,moveCount=0,rotating=false;
img.crossOrigin='anonymous';img.onload=()=>draw();function loadPhoto(url){img=new Image();img.crossOrigin='anonymous';img.onload=draw;img.onerror=()=>toast('写真を読み込めませんでした。別の写真を選んでね');img.src=url}
function gallery(){let g=$('gallery');g.innerHTML='';photos.forEach((p,i)=>{let b=document.createElement('button');b.className='photo'+(i===photoIndex&&!customURL?' active':'');b.innerHTML=`<img src="${p[1]}" alt=""><span>${p[0]}</span>`;b.onclick=()=>{photoIndex=i;customURL='';gallery();loadPhoto(p[1])};g.append(b)})}gallery();loadPhoto(photos[0][1]);
function edge(type,r,c){if(type==='top')return r===0?0:edgesV[r-1][c]*-1;if(type==='bottom')return r===rows-1?0:edgesV[r][c];if(type==='left')return c===0?0:edgesH[r][c-1]*-1;return c===cols-1?0:edgesH[r][c]}
let edgesH=[],edgesV=[];
function makeEdge(){return {sign:Math.random()<.5?1:-1,at:.43+Math.random()*.14,neck:.075+Math.random()*.035,bulge:.16+Math.random()*.055,wide:.105+Math.random()*.035,lean:(Math.random()-.5)*.045}}
function init(){let n=+$('count').value;let map={9:[3,3],10:[5,2],16:[4,4],20:[5,4],25:[5,5],30:[6,5],40:[8,5],50:[10,5],100:[10,10],144:[12,12],196:[14,14],256:[16,16]};[cols,rows]=map[n];unit=Math.floor(660/Math.max(cols,rows));boardW=cols*unit;boardH=rows*unit;boardX=(720-boardW)/2;boardY=20;trayY=boardY+boardH+35;edgesH=Array.from({length:rows},()=>Array.from({length:cols-1},makeEdge));edgesV=Array.from({length:rows-1},()=>Array.from({length:cols},makeEdge));pieces=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)pieces.push({id:r*cols+c,r,c,x:0,y:0,rot:$('rotate').value==='on'?Math.floor(Math.random()*4):0,placed:false});shuffle();completed=0;moveCount=0;resizeCanvas();draw()}
function edge(type,r,c){if(type==='top')return r===0?null:{...edgesV[r-1][c],sign:-edgesV[r-1][c].sign};if(type==='bottom')return r===rows-1?null:edgesV[r][c];if(type==='left')return c===0?null:{...edgesH[r][c-1],sign:-edgesH[r][c-1].sign};return c===cols-1?null:edgesH[r][c]}
function resizeCanvas(){canvas.height=Math.max(900,trayY+Math.ceil(pieces.length/Math.max(3,Math.floor(660/Math.max(44,unit*.72))))*Math.max(48,unit*.72)+30)}
function shuffle(){let colsTray=Math.max(3,Math.floor(660/Math.max(44,unit*.72))),w=660/colsTray,h=Math.max(48,unit*.72);pieces.filter(p=>!p.placed).forEach((p,i)=>{p.x=30+(i%colsTray)*w+w/2;p.y=trayY+Math.floor(i/colsTray)*h+h/2})}
function sidePath(x,y,s,e,horizontal){let sign=e.sign,at=e.at,bulge=e.bulge,wide=e.wide,lean=e.lean,u=s*at,half=s*wide/2,depth=s*bulge;if(horizontal){ctx.lineTo(x+u-half,y);ctx.bezierCurveTo(x+u-half*.85,y+sign*depth*.28,x+u-half*.72+lean*s,y+sign*depth*.82,x+u,y+sign*depth*.82);ctx.bezierCurveTo(x+u+half*.72+lean*s,y+sign*depth*.82,x+u+half*.85,y+sign*depth*.28,x+u+half,y);ctx.lineTo(x+s,y)}else{ctx.lineTo(x,y+u-half);ctx.bezierCurveTo(x+sign*depth*.28,y+u-half*.85,x+sign*depth*.82,y+u-half*.72+lean*s,x+sign*depth*.82,y+u);ctx.bezierCurveTo(x+sign*depth*.82,y+u+half*.72+lean*s,x+sign*depth*.28,y+u+half*.85,x,y+u+half);ctx.lineTo(x,y+s)}}
function pathPiece(p,x,y,s){ctx.beginPath();ctx.moveTo(x,y);let t=edge('top',p.r,p.c);if(t)sidePath(x,y,s,t,true);else ctx.lineTo(x+s,y);let r=edge('right',p.r,p.c);if(r)sidePath(x+s,y,s,r,false);else ctx.lineTo(x+s,y+s);let b=edge('bottom',p.r,p.c);if(b){let rev={...b,at:1-b.at,sign:-b.sign};ctx.lineTo(x+s,y+s);ctx.lineTo(x+s*(1-rev.at+rev.wide/2),y+s);ctx.bezierCurveTo(x+s*(1-rev.at+rev.wide*.42),y+s-rev.sign*s*rev.bulge*.28,x+s*(1-rev.at+rev.wide*.36)-rev.lean*s,y+s-rev.sign*s*rev.bulge*.82,x+s*(1-rev.at),y+s-rev.sign*s*rev.bulge*.82);ctx.bezierCurveTo(x+s*(1-rev.at-rev.wide*.36)-rev.lean*s,y+s-rev.sign*s*rev.bulge*.82,x+s*(1-rev.at-rev.wide*.42),y+s-rev.sign*s*rev.bulge*.28,x+s*(1-rev.at-rev.wide/2),y+s);ctx.lineTo(x,y+s)}else ctx.lineTo(x,y+s);let l=edge('left',p.r,p.c);if(l){let rev={...l,at:1-l.at,sign:-l.sign};ctx.lineTo(x,y+s*(1-rev.at+rev.wide/2));ctx.bezierCurveTo(x-rev.sign*s*rev.bulge*.28,y+s*(1-rev.at+rev.wide*.42),x-rev.sign*s*rev.bulge*.82,y+s*(1-rev.at+rev.wide*.36)-rev.lean*s,x-rev.sign*s*rev.bulge*.82,y+s*(1-rev.at));ctx.bezierCurveTo(x-rev.sign*s*rev.bulge*.82,y+s*(1-rev.at-rev.wide*.36)-rev.lean*s,x-rev.sign*s*rev.bulge*.28,y+s*(1-rev.at-rev.wide*.42),x,y+s*(1-rev.at-rev.wide/2));ctx.lineTo(x,y)}else ctx.lineTo(x,y);ctx.closePath()}
function drawPiece(p,cx,cy,s){ctx.save();ctx.translate(cx,cy);ctx.rotate(p.rot*Math.PI/2);ctx.translate(-s/2,-s/2);let sx=boardX+p.c*unit,sy=boardY+p.r*unit;pathPiece(p,0,0,s);ctx.save();ctx.clip();if(img.complete&&img.naturalWidth){let scale=Math.max(boardW/img.naturalWidth,boardH/img.naturalHeight),dw=img.naturalWidth*scale,dh=img.naturalHeight*scale,ox=boardX+(boardW-dw)/2,oy=boardY+(boardH-dh)/2;ctx.drawImage(img,ox-sx,oy-sy,dw,dh)}else{ctx.fillStyle='#a9c7ae';ctx.fill()}ctx.restore();ctx.strokeStyle='#fffdf5';ctx.lineWidth=2;ctx.stroke();ctx.restore()}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#e7e1d5';ctx.fillRect(boardX-7,boardY-7,boardW+14,boardH+14);ctx.fillStyle='#fffdf8';ctx.fillRect(boardX,boardY,boardW,boardH);ctx.save();ctx.globalAlpha=.18;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ctx.fillStyle='#748c7b';ctx.fillRect(boardX+c*unit+1,boardY+r*unit+1,unit-2,unit-2)}ctx.restore();pieces.filter(p=>p.placed).forEach(p=>drawPiece(p,boardX+(p.c+.5)*unit,boardY+(p.r+.5)*unit,unit));ctx.fillStyle='#71817a';ctx.font='bold 16px sans-serif';ctx.fillText('ピース置き場',22,trayY-12);let active=pieces.filter(p=>!p.placed);active.forEach(p=>{let s=Math.min(unit*.72,82);drawPiece(p,p.x,p.y,s)});if(drag){let p=pieces.find(q=>q.id===drag.id);if(p)drawPiece(p,drag.x,drag.y,Math.min(unit*.82,92))}$('progress').textContent=`${completed} / ${pieces.length} ピース`;$('status').textContent=completed===pieces.length?'🎉 完成！おめでとう！':'あと '+(pieces.length-completed)+' ピース'}
function point(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
let downAt=0;canvas.addEventListener('pointerdown',e=>{let q=point(e),s=Math.min(unit*.72,82);let found=pieces.filter(p=>!p.placed).reverse().find(p=>Math.abs(q.x-p.x)<s*.65&&Math.abs(q.y-p.y)<s*.65);if(!found)return;downAt=Date.now();drag={id:found.id,x:q.x,y:q.y,ox:q.x,oy:q.y,moved:false};canvas.setPointerCapture(e.pointerId);draw()});canvas.addEventListener('pointermove',e=>{if(!drag)return;let q=point(e);if(Math.hypot(q.x-drag.ox,q.y-drag.oy)>5)drag.moved=true;drag.x=q.x;drag.y=q.y;draw()});canvas.addEventListener('pointerup',e=>{if(!drag)return;let p=pieces.find(q=>q.id===drag.id),q=point(e),wasMoved=drag.moved;drag=null;if(!wasMoved){if($('rotate').value==='on'){p.rot=(p.rot+1)%4;toast('ピースを90度回転したよ')}else toast('ピースをドラッグしてね');draw();return}let tx=boardX+(p.c+.5)*unit,ty=boardY+(p.r+.5)*unit;if(Math.hypot(q.x-tx,q.y-ty)<unit*.38&&p.rot===0){p.placed=true;p.x=tx;p.y=ty;completed++;moveCount++;if(completed===pieces.length)toast('🎉 パズル完成！')}else{p.x=q.x;p.y=q.y;moveCount++;}draw()});canvas.addEventListener('pointercancel',()=>{drag=null;draw()});
$('count').onchange=init;$('rotate').onchange=()=>{pieces.forEach(p=>{if(!p.placed)p.rot=$('rotate').value==='on'?Math.floor(Math.random()*4):0});shuffle();draw();toast('回転設定を変更したよ')};$('mix').onclick=()=>{shuffle();draw();toast('ピースを並べ直したよ')};$('restart').onclick=init;$('preview').onclick=()=>{let w=window.open('','_blank');if(w)w.document.write(`<img src="${img.src}" style="width:100%;height:auto">`);else toast('ポップアップを許可してね')};$('upload').onchange=e=>{let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f);customURL=u;loadPhoto(u);document.querySelectorAll('.photo').forEach(b=>b.classList.remove('active'))};function toast(t){let el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
init();
</script></body></html>
