<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffeff7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ぬりえスマイル">
<title>ぬりえスマイル 🌈</title>
<style>
:root{--pink:#ff78ad;--purple:#9a7be8;--ink:#594b69;--cream:#fffaf0}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;background:linear-gradient(180deg,#fff0f8 0%,#f7f3ff 48%,#eefaff 100%);color:#23253a;min-height:100vh}
button{font:inherit;cursor:pointer}main{max-width:760px;margin:auto;padding:14px 14px 38px}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}.brand{font-weight:900;color:#23253a;font-size:17px}.pill{border:0;border-radius:12px;padding:9px 13px;background:#fff;box-shadow:0 3px 10px #9e7da522;color:var(--ink)}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 16px 24px;text-align:center;background:linear-gradient(135deg,#ff77b7 0%,#9a7be8 48%,#55c9e8 100%);box-shadow:0 14px 36px #8e5aa855}
.hero:before,.hero:after{content:"✦";position:absolute;color:#ffd76a;font-size:35px;opacity:.9}.hero:before{top:13px;left:18px}.hero:after{right:22px;bottom:20px}
h1{font-size:clamp(29px,7vw,43px);line-height:1.2;margin:4px 0 8px;color:#fff;font-weight:1000;letter-spacing:4px}
.sub{font-weight:700;margin:5px 0 12px;color:#e9e3ff}
.cast{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:10px 0 16px}
.cast>div{aspect-ratio:1;border-radius:18px;display:grid;place-items:center;background:#2d2f4a!important;cursor:pointer}
.cast svg{width:92%;height:92%}
.start{border:0;border-radius:14px;padding:15px 27px;background:linear-gradient(90deg,#ff4f9a,#ff8a5b,#ffd34f);color:white;font-size:20px;font-weight:900;box-shadow:0 5px 0 #b83a33}
.start:active{transform:translateY(4px);box-shadow:0 2px 0 #b83a33}
.features{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:17px}.feature{background:#ffffff1f;color:#fff;border-radius:8px;padding:7px 11px;font-size:12px;font-weight:800}
.section{margin:20px 2px 10px;font-size:20px;font-weight:900}.section span{color:#ef79a8}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.stat{background:#fff;border-radius:16px;padding:11px 8px;font-weight:900;font-size:13px;border:1px solid #e3dccd;box-shadow:0 2px 0 #e3dccd;text-align:center}.stat b{display:block;color:#ff5a4f;font-size:21px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.cat{border:1px solid #e3dccd;border-radius:16px;padding:14px 9px;text-align:center;background:#fff;box-shadow:0 2px 0 #e3dccd;color:var(--ink);font-weight:900;min-height:88px}
.cat .icon{display:block;width:76px;height:76px;border-radius:50%;margin:0 auto 6px;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.09)}
.cat svg{width:100%;height:100%;display:block}
.cat small{font-size:11px;color:#998ba1;display:block;margin-top:4px}
.pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.page{background:white;border:1px solid #e3dccd;border-radius:16px;padding:12px;text-align:left;color:var(--ink);box-shadow:0 2px 0 #e3dccd}.page .thumb{height:85px;border-radius:13px;background:#2d2f4a;display:grid;place-items:center}
.page svg{height:80px;width:auto;display:block}
.page b{display:block;margin-top:7px}.page small{color:#9b8da2}
.panel{background:white;border:1px solid #e3dccd;border-radius:16px;padding:13px;box-shadow:0 2px 0 #e3dccd}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.back{border:0;border-radius:12px;padding:9px 13px;background:#f8edf7;color:#725d7c;font-weight:800}
#stage{position:relative;width:100%;max-width:520px;aspect-ratio:1;margin:auto;background:#fff;border:2px solid #23253a;border-radius:10px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#stage canvas,#stage #lines,#stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}#lines{pointer-events:none}
.tools{margin-top:12px}.tl{padding:9px 11px;font-size:13px;border-radius:12px}.tl.sel{background:#ff5a4f;color:#fff}
.palette{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin:14px 0 8px}.swatch{aspect-ratio:1;border:2px solid white;border-radius:50%;box-shadow:0 0 0 1px #ddd}.swatch.selected{outline:3px solid #66547a;outline-offset:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.action{border:0;border-radius:12px;padding:11px 14px;background:#f3edff;color:#66547a;font-weight:900}.action.primary{background:#ff5a4f;color:white}
.hidden{display:none!important}.hint{text-align:center;color:#6b6e85;font-size:12px;line-height:1.6}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#23253a;color:#fff;font-weight:800;padding:12px 22px;border-radius:14px;box-shadow:0 8px 24px #00000033;z-index:200;opacity:0;transition:.25s;pointer-events:none;max-width:86vw;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.saved-list{display:flex;gap:9px;overflow:auto}.saved-item{min-width:100px;background:white;border-radius:14px;padding:8px;font-size:12px}
.spark{position:fixed;z-index:99;pointer-events:none;font-size:22px;animation:sp .8s ease-out forwards}
@keyframes sp{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% - 46px)) scale(1.3) rotate(40deg);opacity:0}}
.parade{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 14px;-webkit-overflow-scrolling:touch}
.parade button{flex:0 0 96px;aspect-ratio:1;border:0;border-radius:18px;display:grid;place-items:center;padding:3px;background:#2d2f4a!important}
.parade svg{width:100%;height:100%;display:block}
.pill.off{opacity:.55}
.cast>div{animation:bob 3s ease-in-out infinite}
.cast>div:nth-child(2n){animation-delay:.45s}.cast>div:nth-child(3n){animation-delay:.9s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
#logo{display:inline-block;animation:pop 2.4s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
@media(min-width:560px){.grid,.pages{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{padding:30px}}
</style>
</head>
<body><main>
<div class="top"><div class="brand"><span id="logo" style="display:inline-block;width:30px;height:30px;vertical-align:middle"></span> ぬりえスマイル</div><span><button class="pill" id="musicBtn" onclick="toggleMusic()">🎵 BGM ON</button><button class="pill" onclick="testSound()">🔔 音を試す</button> <button class="pill" onclick="showSaved()">💖 アルバム</button></span></div>
<section id="home">
<div class="hero">
<div style="font-size:13px;font-weight:900;color:#ffd76a;letter-spacing:3px">✨ COLORING STUDIO ✨</div>
<h1 id="ttl">ぬりえスマイル</h1>
<div class="sub">好きな色で、自分だけの一枚を仕上げよう</div>
<div class="cast" id="cast"></div>
<button class="start" onclick="showCategories()">🎨 ぬりえを始める</button><br><div class="features"><span class="feature">🌟 1800作品</span><span class="feature">🖍️ 96色</span><span class="feature">🎵 BGM</span><span class="feature">🔔 効果音</span></div>
</div>
<div class="stats"><div class="stat"><b id="total">0</b>ぬりえ</div><div class="stat"><b>96</b>カラー</div><div class="stat"><b>0</b>広告・懸賞</div></div>
<h2 class="section">🎪 キャラクター</h2><div class="parade" id="parade"></div>
<h2 class="section">💝 おすすめ</h2>
<div class="grid">
<button class="cat" id="reco1" onclick="openPage(1,0)"></button>
<button class="cat" id="reco2" onclick="openPage(16,0)"></button>
</div>
</section>
<section id="categories" class="hidden">
<div class="toolbar"><button class="back" onclick="showHome()">← ホーム</button><span>テーマ選択</span></div>
<h2 class="section">テーマを選ぶ</h2><div id="catgrid" class="grid"></div>
</section>
<section id="pages" class="hidden">
<div class="toolbar"><button class="back" onclick="showCategories()">← カテゴリー</button><b id="categoryTitle"></b></div>
<p class="hint">好きな絵を選んでください。</p><div id="pagegrid" class="pages"></div>
</section>
<section id="editor" class="hidden">
<div class="toolbar"><button class="back" onclick="showPages()">← もどる</button><b id="pageTitle">ぬりえ</b><button class="back" onclick="resetPage()">↻ リセット</button></div>
<div class="panel"><div id="stage"><canvas id="paint" width="800" height="800"></canvas><div id="lines"><svg id="drawing" viewBox="0 0 400 400"></svg></div></div>
<p class="hint">色を選んで、なぞって塗るか 🪣 でタッチしてひとぬり</p>
<div class="actions tools"><button class="action tl" id="sz10" onclick="setSize(10)">細</button><button class="action tl sel" id="sz22" onclick="setSize(22)">中</button><button class="action tl" id="sz46" onclick="setSize(46)">太</button><button class="action tl" id="bkt" onclick="toggleBucket()">🪣 ぬる</button><button class="action tl" id="ers" onclick="toggleErase()">🧽 消す</button><button class="action tl sel" id="ins" onclick="toggleInside()">🔒 はみ出し防止</button></div><div id="palette" class="palette"></div>
<div class="actions"><button class="action" onclick="undo()">↶ 一つ戻す</button><button class="action" onclick="clearAll()">🗑 全部消す</button><button class="action primary" onclick="saveArtwork()">💾 作品を保存</button><button class="action" onclick="downloadArtwork()">📥 画像をダウンロード</button></div>
</div>
</section>
<section id="saved" class="hidden">
<div class="toolbar"><button class="back" onclick="showHome()">← ホーム</button><b>💖 作品アルバム</b></div>
<p class="hint">この端末に保存した作品だよ。</p><div id="savedList" class="saved-list"></div>
</section>
<p class="hint" style="margin-top:22px">ぬりえスマイル 🌈 たのしく、じゆうに、ぬってみよう！</p>
</main>
<script>
const categories=[["乗り物", "🚗"],["電車・飛行機・船", "✈️"],["昆虫", "🦋"],["鳥", "🐦"],["魚・海の生き物", "🐟"],["爬虫類・両生類", "🦎"],["建物", "🏠"],["山・自然", "⛰️"],["森・花", "🌳"],["街・風景", "🌸"],["動物", "🐼"],["ペット", "🐶"],["恐竜", "🦖"],["ドラゴン", "🐉"],["モンスター", "👾"],["ロボット", "🤖"],["食べ物", "🍙"],["スイーツ", "🧁"],["空・天気", "☀️"],["花", "🌼"],["キャラクター", "🐻"],["女の子", "🎀"],["アイドル", "🎤"],["おしゃれ", "👗"],["カフェ", "☕"],["お祭り", "🎆"],["冬", "⛄"],["音楽", "🎸"],["ねこ", "🐱"],["プリンセス", "👸"],["人魚", "🧜‍♀️"],["妖精・魔法", "🧚"],["ユニコーン", "🦄"],["ヒーロー", "🦸"],["子ども", "🧒"],["宇宙", "🪐"]];
const $=id=>document.getElementById(id);let currentCat=0,currentPage=0,chosen="#ff5f9e";
function hideAll(){["home","categories","pages","editor","saved"].forEach(x=>$(x).classList.add("hidden"))}
function showHome(){hideAll();$("home").classList.remove("hidden")}
function showCategories(){ac();sfx("start");hideAll();$("categories").classList.remove("hidden")}
function showSaved(){hideAll();$("saved").classList.remove("hidden");renderSaved()}
function selectCategory(i){currentCat=i;$("categoryTitle").textContent=categories[i][1]+" "+categories[i][0];$("pagegrid").innerHTML=DES[i].map((d,n)=>`<button class="page" onclick="openPage(${i},${n})"><div class="thumb"><svg viewBox="0 0 400 400">${colorize(shapeSVG(i,n),n+i)}</svg></div><b>${d[0]}</b><small>塗る</small></button>`).join("");hideAll();$("pages").classList.remove("hidden")}
function showPages(){selectCategory(currentCat)}
const colors=[];for(let h=0;h<360;h+=15){for(let l of [42,58,72])colors.push(`hsl(${h},82%,${l}%)`)}colors.push("#222222","#555555","#888888","#bbbbbb","#eeeeee","#ffffff","#8b5a2b","#d9a066","#ffd9b8","#f6e6d2","#ffb6c1","#a8d8ff","#4a2545","#7b5aa6","#33619e","#1f7a62","#7a9a2e","#a8642a","#c94f82","#6b4a35","#3a3a5c","#f2c94c","#e08a3c","#cfeaff"); 
$("palette").innerHTML=colors.map((c,i)=>`<button class="swatch ${i===0?"selected":""}" style="background:${c}" aria-label="色${i+1}" onclick="chooseColor(this,'${c}')"></button>`).join("");
function chooseColor(el,c){chosen=c;erase=false;updTools();sfx("pick");document.querySelectorAll(".swatch").forEach(x=>x.classList.remove("selected"));el.classList.add("selected")}
const PAL=["#ff8fb8","#ffd45e","#7fd8ff","#a8e87a","#c9a7ff","#ffab6e","#ff7b7b","#6fe0c0"];
const F='fill="#fff" stroke="#333" stroke-width="7" stroke-linejoin="round"';
const sh=(x,y,a,b)=>{if(a<28||b<28)return"";const q=(t,k)=>`${(x+a*k*Math.cos(t)).toFixed(1)} ${(y+b*k*Math.sin(t)).toFixed(1)}`;return `<path d="M${x-a*.62} ${y-b*.1}Q${x-a*.6} ${y-b*.55} ${x-a*.2} ${y-b*.7}" fill="none" stroke="#FFF" stroke-width="6" stroke-linecap="round" opacity=".85" style="pointer-events:none"/><path d="M${q(.25,.8)}A${a*.8} ${b*.8} 0 0 1 ${q(1.6,.8)}" fill="none" stroke="#000" stroke-width="9" stroke-linecap="round" opacity=".12" style="pointer-events:none"/><path d="M${q(.3,.68)}A${a*.68} ${b*.68} 0 0 1 ${q(1.5,.68)}M${q(.5,.55)}A${a*.55} ${b*.55} 0 0 1 ${q(1.3,.55)}" fill="none" stroke="#333" stroke-width="3.5" stroke-dasharray="0.1 8" stroke-linecap="round" opacity=".4" style="pointer-events:none"/>`};
const E=(x,y,a,b,r=0)=>`<g transform="rotate(${r} ${x} ${y})"><ellipse cx="${x}" cy="${y}" rx="${a}" ry="${b}" ${F}/>${sh(x,y,a,b)}</g>`,C=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" ${F}/>${sh(x,y,r,r)}`,P=d=>`<path d="${d}" ${F}/>`,RT=(x,y,w,h,r=8)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" ${F}/>`;
const L=d=>`<path d="${d}" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round" style="pointer-events:none"/>`,D=(x,y,r=8)=>r>=8?`<ellipse cx="${x}" cy="${y}" rx="${r*1.05}" ry="${r*1.4}" fill="#333" style="pointer-events:none"/><circle cx="${x-r*.35}" cy="${y-r*.55}" r="${r*.42}" fill="#FFF" style="pointer-events:none"/><circle cx="${x+r*.3}" cy="${y+r*.55}" r="${r*.2}" fill="#FFF" style="pointer-events:none"/>`:`<circle cx="${x}" cy="${y}" r="${r}" fill="#333" style="pointer-events:none"/>`;
const ck=(x,y)=>`<ellipse cx="${x}" cy="${y}" rx="13" ry="8" fill="#ff9fb8" opacity=".55" style="pointer-events:none"/>`;
const g=(x,y,s=32)=>ck(x-s*1.55,y+16)+ck(x+s*1.55,y+16)+D(x-s,y)+D(x+s,y)+L(`M${x-14} ${y+26}Q${x} ${y+42} ${x+14} ${y+26}`);
const S=(x,y,r)=>{let p=[];for(let k=0;k<10;k++){const t=-Math.PI/2+k*Math.PI/5,q=k%2?r*.45:r;p.push((x+Math.cos(t)*q).toFixed(0)+" "+(y+Math.sin(t)*q).toFixed(0))}return P("M"+p.join("L")+"Z")};
const PET=(n,x,y,d,a,b)=>Array.from({length:n},(_,k)=>{const t=k*2*Math.PI/n;return E(Math.round(x+Math.cos(t)*d),Math.round(y+Math.sin(t)*d),a,b,k*360/n)}).join("");
const stem=(x,y)=>RT(x-8,y,16,395-y,6);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const NP=["もふもふ","ぴかぴか","くるくる","ふわふわ","もこもこ","きらきら","まるまる","ぷにぷに","もっちり","さくら","ほしぞら","みるく","あめいろ","なつぞら","こがね","そらいろ","うみいろ","ゆきいろ","はるかぜ","あきいろ","めろん","いちご","あおぞら","みどり","つきよ","ひかり","かぜ","ゆめ","にじいろ","スーパー"];
const NS=["ちゃん","たん","まる","りん","ぴょん","もん","み","か","な","ぽ","ルン","ミン","パン","やん","け","ず","のん","ごん","じん","のすけ"];
const N2=["☆","♪","♥","✿","☀","☘","❀","♕","⚡","☁"];
// ===================== キャラ生成エンジン(構図別アーキタイプ) =====================
function THAIR(x,y,r,R){
 const n=3+((R()*4)|0),a0=Math.PI*1.06,a1=Math.PI*1.94;let p="";
 for(let k=0;k<=n;k++){const t=a0+(a1-a0)*k/n;
  p+=(k?"L":"M")+(x+Math.cos(t)*r*1.14).toFixed(0)+" "+(y+Math.sin(t)*r*1.14).toFixed(0);
  if(k<n){const tm=t+(a1-a0)/(n*2),ln=r*(1.5+R()*.55),an=tm+(R()-.5)*.3;
   p+="L"+(x+Math.cos(an)*ln).toFixed(0)+" "+(y+Math.sin(an)*ln).toFixed(0);}}
 return P(p+"Z")}
function FCE(x,y,r,o,R){
 let g="",h=o.h,e=o.e,fx=o.fx||[];
 const ex=R()<.2?1:(R()<.45?2:0);
 if(h==="long")g+=P(`M${x-r*1.05} ${y-r*.2}Q${x-r*1.3} ${y+r*.9} ${x-r*.75} ${y+r*1.25}L${x-r*.5} ${y-r*.1}Z`)+P(`M${x+r*1.05} ${y-r*.2}Q${x+r*1.3} ${y+r*.9} ${x+r*.75} ${y+r*1.25}L${x+r*.5} ${y-r*.1}Z`);
 if(h==="pony")g+=P(`M${x+r*.5} ${y-r*.7}Q${x+r*1.7} ${y-r*.9} ${x+r*1.9} ${y-r*.1}Q${x+r*1.2} ${y-r*.35} ${x+r*.6} ${y-r*.35}Z`);
 if(h==="twin")g+=P(`M${x-r*.95} ${y-r*.3}Q${x-r*1.75} ${y-r*.5} ${x-r*1.7} ${y+r*.3}Q${x-r*1.15} ${y+r*.1} ${x-r*.8} ${y-r*.05}Z`)+P(`M${x+r*.95} ${y-r*.3}Q${x+r*1.75} ${y-r*.5} ${x+r*1.7} ${y+r*.3}Q${x+r*1.15} ${y+r*.1} ${x+r*.8} ${y-r*.05}Z`);
 if(e==="cat")g+=P(`M${x-r*.92} ${y-r*.6}L${x-r*.72} ${y-r*1.42}L${x-r*.22} ${y-r*.82}Z`)+P(`M${x+r*.92} ${y-r*.6}L${x+r*.72} ${y-r*1.42}L${x+r*.22} ${y-r*.82}Z`);
 if(e==="bunny")g+=E(x-r*.44,y-r*1.12,r*.19,r*.6,-8)+E(x+r*.44,y-r*1.12,r*.19,r*.6,8);
 if(e==="bear")g+=C(x-r*.66,y-r*.82,r*.25)+C(x+r*.66,y-r*.82,r*.25);
 if(e==="round")g+=C(x-r*.84,y-r*.58,r*.16)+C(x+r*.84,y-r*.58,r*.16);
 if(e==="elf")g+=P(`M${x-r*.98} ${y-r*.02}L${x-r*1.52} ${y-r*.42}L${x-r*.7} ${y-r*.6}Z`)+P(`M${x+r*.98} ${y-r*.02}L${x+r*1.52} ${y-r*.42}L${x+r*.7} ${y-r*.6}Z`);
 if(e==="horn")g+=P(`M${x-r*.3} ${y-r*.92}L${x-r*.12} ${y-r*1.72}L${x+r*.14} ${y-r*.9}Z`);
 if(fx.includes("horns"))g+=`<path d="M${x-r*.42} ${y-r*.9}Q${x-r*1} ${y-r*1.28} ${x-r*.72} ${y-r*1.62}" fill="none" stroke="#333" stroke-width="9" stroke-linecap="round"/><path d="M${x+r*.42} ${y-r*.9}Q${x+r*1} ${y-r*1.28} ${x+r*.72} ${y-r*1.62}" fill="none" stroke="#333" stroke-width="9" stroke-linecap="round"/>`;

function loadSaved(){try{const s=window["local"+"Storage"],v=s?s.getItem("nurieSmileSaved"):null;return v?JSON.parse(v):(memSaved||[])}catch(e){return memSaved||[]}}
function persistSaved(a){memSaved=a;try{window["local"+"Storage"].setItem("nurieSmileSaved",JSON.stringify(a))}catch(e){}}
function saveArtwork(){compose(o=>{const t=document.createElement("canvas");t.width=t.height=260;t.getContext("2d").drawImage(o,0,0,260,260);try{let arr=loadSaved();arr.unshift({title:$("pageTitle").textContent,img:t.toDataURL("image/jpeg",.8),date:new Date().toLocaleDateString("ja-JP")});persistSaved(arr.slice(0,30));sfx("ok");toast("作品アルバムに保存したよ！💖")}catch(e){toast("保存できなかったよ…📥画像ダウンロードを使ってね")}})}
function renderSaved(){const arr=loadSaved();$("savedList").innerHTML=arr.length?arr.map(x=>`<div class="saved-item">${x.img?`<img src="${x.img}" style="width:100%;border-radius:8px">`:""}${x.title}<br><small>${x.date}</small></div>`).join(""):"まだ作品がないよ。ぬりえを完成させて保存してね！"}
</script></body></html>
