<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f172a">
<title>World Heritage Quiz / 世界遺産検定 対策</title>
<style>:root {
  --bg: #0a0e17;
  --card: #121826;
  --card2: #1a2235;
  --line: #2a3548;
  --tx: #e8eef8;
  --sub: #8b9bb8;
  --acc: #22d3ee;
  --acc2: #6366f1;
  --ok: #34d399;
  --ng: #f43f5e;
  --warn: #eab308;
  --gold: #f0c14b;
  --violet: #a78bfa;
  --cyan: #22d3ee;
  --blue: #3b82f6;
  --grade4: #22d3ee;
  --grade3: #60a5fa;
  --grade2: #a78bfa;
  --gradep1: #c084fc;
  --grade1: #f0c14b;
  --radius: 14px;
  --shadow: 0 8px 32px rgba(0,0,0,.5);
  --glow: 0 0 20px rgba(34,211,238,.15);
  color-scheme: dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"Noto Sans JP","Hiragino Sans",system-ui,-apple-system,sans-serif}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--tx);display:flex;justify-content:center;line-height:1.65;-webkit-text-size-adjust:100%}
#app{width:100%;max-width:640px;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
button,select,input{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}

/* Header */
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:linear-gradient(180deg,#121826 0%,#0a0e17 100%);border-bottom:1px solid var(--line);z-index:10}
.hd select{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:13px;max-width:110px}
.hd .tt{font-weight:800;font-size:16px;letter-spacing:.03em;background:linear-gradient(90deg,#22d3ee,#818cf8,#a78bfa,#f0c14b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ic{background:var(--card);border:1px solid var(--line);border-radius:12px;width:40px;height:38px;font-size:17px;display:flex;align-items:center;justify-content:center;transition:.2s}
.ic:active,.ic.on{transform:scale(.95);border-color:var(--acc);color:var(--acc)}
.lang-sel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12px;font-weight:700;color:var(--acc);max-width:64px;appearance:none;-webkit-appearance:none;text-align:center}
.lang-sel:focus{outline:2px solid var(--acc);outline-offset:1px}
.lang-btn{font-size:12px;font-weight:700;padding:0 6px}

/* Main */
main{flex:1;overflow-y:auto;padding:14px 16px 28px;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.accent{border-color:rgba(34,211,238,.4);box-shadow:var(--glow)}

/* Home stats */
.sum{display:flex;gap:12px;margin-bottom:12px}
.sum>div{flex:1;text-align:center}
.sum small{display:block;color:var(--sub);font-size:12px;margin-bottom:2px}
.sum b{font-size:28px;font-weight:800}
.sum i{font-style:normal;font-size:13px;color:var(--sub)}
.pb{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:8px 0}
.pb i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#6366f1,#a78bfa);border-radius:99px;transition:width .4s}
.pl{font-size:12px;color:var(--sub)}

/* Modes */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 12px}
.md{background:var(--card2);border:2px solid transparent;border-radius:14px;padding:12px 8px;font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.2s}
.md small{font-weight:500;color:var(--sub);font-size:11px}
.md.on{border-color:var(--acc);background:rgba(34,211,238,.1);box-shadow:0 0 0 1px rgba(34,211,238,.5),var(--glow)}
.fld{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin-bottom:12px;flex-wrap:wrap}
.fld b{color:var(--tx)}
.lk{background:none;border:1px solid var(--line);border-radius:10px;color:var(--acc);padding:4px 10px;font-size:12px}
.go{width:100%;border:0;border-radius:16px;background:linear-gradient(135deg,#0891b2,#22d3ee,#6366f1);color:#0f172a;font-size:17px;font-weight:800;padding:15px;box-shadow:0 6px 20px color-mix(in srgb,var(--acc) 40%,transparent);transition:.2s}
.go:active{transform:scale(.98)}
.res{display:block;text-align:center;margin-top:10px;background:none;border:0;color:var(--acc);font-size:14px;width:100%}

/* Menu */
.menu{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:14px 16px;transition:.15s}
.mi:first-child{border-top:0}.mi:active{background:var(--card2)}
.mi .e{font-size:22px;width:30px;text-align:center}
.mi b{display:block;font-size:15px}.mi small{color:var(--sub);font-size:12px}
.mi .ar{margin-left:auto;color:var(--sub)}

/* Quiz */
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:8px;padding:2px 8px;margin-right:6px}
.tag.g4{background:rgba(34,211,238,.12);color:#22d3ee;border:1px solid rgba(34,211,238,.35)}
.tag.g3{background:rgba(96,165,250,.12);color:#60a5fa;border:1px solid rgba(96,165,250,.35)}
.tag.g2{background:rgba(167,139,250,.12);color:#a78bfa;border:1px solid rgba(167,139,250,.35)}
.tag.gp1{background:rgba(192,132,252,.12);color:#c084fc;border:1px solid rgba(192,132,252,.35)}
.tag.g1{background:rgba(240,193,75,.12);color:#f0c14b;border:1px solid rgba(240,193,75,.4)}
.tag.trap{background:color-mix(in srgb,var(--warn) 25%,transparent);color:var(--warn);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.qq{font-size:17px;line-height:1.75;margin:12px 0 18px;white-space:pre-wrap;font-weight:500}
.ch{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:9px;font-size:15px;line-height:1.55;transition:.2s;position:relative}
.ch b{color:var(--acc);margin-right:8px;font-weight:800}
.ch:active{transform:scale(.99)}
.ch.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card));box-shadow:0 0 0 1px var(--ok)}
.ch.wrong{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 15%,var(--card))}
.ch.disabled{pointer-events:none}
.verdict{font-size:22px;font-weight:800;margin:14px 0 10px;display:flex;align-items:center;gap:8px}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--ng)}
.panel{background:linear-gradient(180deg,var(--card) 0%,color-mix(in srgb,var(--card2) 60%,var(--card)) 100%);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:8px}
.panel h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.panel h3::before{content:"";width:4px;height:18px;background:var(--acc);border-radius:2px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 12px;font-size:13px}
dt{color:var(--sub);font-weight:600}dd{margin:0}
.pt{border-top:1px solid var(--line);padding-top:12px;margin-top:10px;font-size:14px;line-height:1.85}
.dh{font-weight:800;font-size:14px;color:var(--acc);margin:10px 0 4px}
.tip{background:color-mix(in srgb,var(--warn) 12%,var(--card));border-left:3px solid var(--warn);padding:10px 12px;border-radius:0 10px 10px 0;margin-top:10px;font-size:13px}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:700;transition:.2s}
.btn.primary{background:linear-gradient(135deg,#0891b2,#22d3ee,#6366f1);color:#0f172a}
.btn.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.share{background:linear-gradient(135deg,#6366f1,#a78bfa);color:#fff}
.btn:active{transform:scale(.97)}

/* Result / Report */
.bigscore{font-size:48px;font-weight:900;text-align:center;margin:10px 0;background:linear-gradient(90deg,#22d3ee,#818cf8,#a78bfa,#f0c14b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.pbar{margin:10px 0}
.pbar .lab{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.pbar .bar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden}
.pbar .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--ok))}

/* Flash / Browse */
.fc{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:28px 20px;min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:.3s}
.fc.flip{background:linear-gradient(145deg,var(--card2),var(--card))}
.fc .name{font-size:22px;font-weight:800;margin-bottom:8px}
.fc .meta{color:var(--sub);font-size:14px}
.sw{display:flex;justify-content:space-between;margin-top:16px;gap:10px}

/* Modal / Sheet */
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;z-index:20;animation:fadeIn .2s}
.sheet>div{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto;animation:slideUp .25s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(40px)}to{transform:translateY(0)}}
.sheet h4{margin:0 0 14px;font-size:17px;font-weight:800}
.opt{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line);font-size:14px;gap:10px}
.opt:first-of-type{border-top:0}
.tg{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:6px 12px;font-size:13px}
.tg.on{color:var(--acc);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,var(--card2))}

/* Toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:24px;font-size:13px;font-weight:600;z-index:30;max-width:90%;box-shadow:var(--shadow);animation:toastIn .3s}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* Misc */
.sb{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);gap:8px;background:var(--card)}
.sb button{background:none;border:0;color:var(--sub);font-size:14px;padding:4px 6px}
.sb .st{font-weight:700;font-size:15px;text-align:center;flex:1}
.gdl{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.badge.trap{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.li{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.li b{display:block;font-size:14px}.li small{color:var(--sub);font-size:12px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hd select:focus-visible,.ic:focus-visible{outline-offset:1px}

/* Voice note & speech recognition status */
.voice-note{font-size:12px;color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:10px;padding:8px 12px;margin:8px 0;line-height:1.4}
.listen-bar{font-size:13px;border-radius:12px;padding:10px 14px;margin:8px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;animation:pulseMic 1.4s ease-in-out infinite}
.listen-bar.listening{background:color-mix(in srgb,#22c55e 18%,var(--card2));color:#16a34a;border:1px solid color-mix(in srgb,#22c55e 40%,transparent)}
.listen-bar.processing{background:color-mix(in srgb,var(--acc) 15%,var(--card2));color:var(--acc);animation:none}
.listen-bar.error{background:color-mix(in srgb,var(--warn) 15%,var(--card2));color:var(--warn);animation:none}
.listen-bar .lt{opacity:.85;font-weight:600}
@keyframes pulseMic{0%,100%{opacity:1}50%{opacity:.72}}
.sb button.on{color:var(--acc)}
</style>
</head>

function cnmJ(ja){
  if(curLang==="ja") return ja;

    try{
      const parts=ja==="ザンビア・ジンバブエ"?["ZM","ZW"]:(ISO[ja]?[ISO[ja]]:null);
      if(parts){ const dn=new Intl.DisplayNames([curLang],{type:"region"}); return parts.map(c=>dn.of(c)).join(" · "); }
    }catch(e){}
  }
  return CEN[ja]||ja;
}

function choicesOf(q){
  const L=curLang;
  if(L!=="ja"&&L!=="en"){
    if(q.category==="種別") return ["文化遺産","自然遺産","複合遺産"].map(x=>t("typeNames."+x));
    if(q.cc) return q.cc.map(cnmJ);
  }
  return tt(q.choices)||[];
}

let curLang = "ja";
function t(key){
  const L = LANGS[curLang] || LANGS.en;
  const keys = key.split(".");
  let v = L;
  for(const k of keys){ v = v?.[k]; if(v===undefined) break; }
  if(v===undefined){
    // fallback en → ja
    v = LANGS.en; for(const k of keys){ v = v?.[k]; if(v===undefined) break; }
    if(v===undefined){ v = LANGS.ja; for(const k of keys){ v = v?.[k]; } }
  }
  return v !== undefined ? v : key;
}
function tt(obj){ // pick multilingual field — never return empty if any lang exists
  if(obj == null) return "";
  if(typeof obj === "string") return obj;
  if(typeof obj !== "object") return String(obj);
  return obj[curLang] || obj.en || obj.ja || obj.fr || obj.pt || Object.values(obj).find(v => typeof v === "string" && v) || "";
}

const Q = [];

function hash36(str){ let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))>>>0; } return h.toString(36); }
function addQ(obj){ Q.push(obj); }
function pickN(arr,n){ const b=arr.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b.slice(0,n); }

const REGION_OF = {};
[["日本",["日本"]],
 ["アジア",["中国","インド","カンボジア","インドネシア","ベトナム","ラオス","タイ","ミャンマー"]],
 ["中東",["ヨルダン","トルコ","イラン"]],

 ["アフリカ",["ジンバブエ","タンザニア","エジプト","南アフリカ","セネガル","ザンビア・ジンバブエ","マリ"]],
 ["南北アメリカ",["アメリカ合衆国","ペルー","エクアドル","チリ","アルゼンチン","メキシコ","ブラジル","グアテマラ","ホンジュラス"]],
 ["オセアニア",["オーストラリア"]]
].forEach(([r,cs])=>cs.forEach(c=>REGION_OF[c]=r));
function regionOf(c){ return REGION_OF[c]||"その他"; }

// De-duplicate heritages by Japanese name (keep the richest entry)
const HUNIQ = (()=>{
  const m = new Map();
  HERITAGES.forEach(h=>{
    const o = m.get(h.ja);
    if(!o){ m.set(h.ja, Object.assign({}, h)); return; }
    const keep = (h.ej||"").length > (o.ej||"").length ? Object.assign({}, h) : o;
    keep.trap = !!(h.trap || o.trap);
    m.set(h.ja, keep);
  });
  const m2 = new Map();
  [...m.values()].forEach(h=>{
    const k=h.en.toLowerCase(), o=m2.get(k);
    if(!o){ m2.set(k,h); return; }
    const keep=(h.ej||"").length>(o.ej||"").length?h:o; keep.trap=!!(h.trap||o.trap); m2.set(k,keep);
  });
  return [...m2.values()];
})();

// Pools for distractors
const COUNTRY_POOL = (()=>{ const m=new Map(); HUNIQ.forEach(h=>{ if(!m.has(h.cja)) m.set(h.cja,h.cen); }); return [...m].map(([ja,en])=>({ja,en})); })();

    question: {

    },

  }));

  // 3. Type (文化/自然/複合) — fixed option order
  const typeOptsJa = ["文化遺産","自然遺産","複合遺産"];
  const typeOptsEn = ["Cultural","Natural","Mixed"];
  if(typeOptsJa.indexOf(h.type)>=0){

function distract(h,fn){
  const pool=HUNIQ.filter(o=>o.ja!==h.ja && fn(o));
  const same=pickN(pool.filter(o=>o.g===h.g),3);
  return same.concat(pickN(pool.filter(o=>!same.includes(o)),3-same.length)).slice(0,3);
}

/* Shuffle choices per attempt (same permutation for every language) */
function prepQ(q){
  if(q.fixedOrder) return q;
  if(!q._c0){ q._c0={ja:(q.choices.ja||[]).slice(), en:(q.choices.en||[]).slice()}; q._a0=q.answer; }
  const n=q._c0.ja.length;
  const perm=shuffle([...Array(n).keys()]);
  if(q.cc){ if(!q._cc0) q._cc0=q.cc.slice(); q.cc=perm.map(i=>q._cc0[i]); }
  q.choices={ja:perm.map(i=>q._c0.ja[i]), en:perm.map(i=>(q._c0.en[i]!==undefined?q._c0.en[i]:q._c0.ja[i]))};
  q.answer=perm.indexOf(q._a0);
  return q;
}
function prepList(list){ list.forEach(prepQ); return list; }

    const r={g:normGrade(f[0]),cat:f[1],q:f[2],c,a,e:f[8]||""};
    if(DB.custom.some(x=>x.q===r.q)){ ng++; return; }
    DB.custom.push(r); addCustom(r); ok++;
  });
  save(); return {ok,ng};
}

function ac(){
  if(!AC){

    if(!C) return null;
    AC = new C();
    master = AC.createGain();
    master.gain.value = DB.set.vol;
    master.connect(AC.destination);
  }

}
function tone(freq, dur, type="sine", vol=0.15, when=0, bg=false){
  const ctx=ac(); if(!ctx||(!bg && !DB.set.se)) return;
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(vol, ctx.currentTime+when);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+when+dur);
  o.connect(g); g.connect(master);
  o.start(ctx.currentTime+when); o.stop(ctx.currentTime+when+dur+0.05);
}

/* ---------- Voice (Web Speech API) — TTS + Speech Recognition ---------- */
const VOICE_LANG_MAP = {
  ja:"ja-JP", en:"en-US", fr:"fr-FR", pt:"pt-BR", es:"es-ES",
  zh:"zh-CN", ko:"ko-KR", de:"de-DE", it:"it-IT",
  ar:"ar-SA", hi:"hi-IN", ru:"ru-RU", th:"th-TH", id:"id-ID", tr:"tr-TR"
};
let _speaking = false;
let _voices = [];
let _voiceNote = "";          // transient UI note about voice availability
let _listenState = "idle";    // idle | listening | processing | error
let _listenText = "";         // last recognized text
let _rec = null;              // SpeechRecognition instance
let _recognitionBusy = false;
let _lastVoiceFinal = "";

function loadVoices(){
  try{
    if(window.speechSynthesis) _voices = speechSynthesis.getVoices() || [];
  }catch(e){ _voices = []; }
}
if(typeof window !== "undefined" && window.speechSynthesis){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function preferredBCP47(){
  return VOICE_LANG_MAP[curLang] || "en-US";
}

/** Find best matching voice: exact lang → language prefix → null */
function findBestVoice(langCode){
  if(!_voices.length) loadVoices();
  if(!_voices.length) return null;
  const norm = s => String(s||"").toLowerCase().replace("_","-");
  const target = norm(langCode);
  const prefix = target.split("-")[0];
  // 1) exact match
  let v = _voices.find(x => norm(x.lang) === target);
  if(v) return v;
  // 2) same language family (pt-BR / pt-PT, zh-CN / zh-TW, etc.)
  v = _voices.find(x => norm(x.lang).startsWith(prefix + "-") || norm(x.lang) === prefix);
  if(v) return v;
  // 3) any voice whose lang starts with the prefix
  v = _voices.find(x => norm(x.lang).startsWith(prefix));
  return v || null;
}

function voiceLang(){
  return preferredBCP47();
}

function stopSpeak(){
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  _speaking = false;
}

function speakText(text, opts){
  if(!DB.set.voice || !text || !window.speechSynthesis) return;
  stopSpeak();
  const langCode = preferredBCP47();
  const voice = findBestVoice(langCode);
  const u = new SpeechSynthesisUtterance(String(text));
  u.lang = langCode;
  if(voice){
    u.voice = voice;
    _voiceNote = "";
  }else{
    // No matching voice installed — keep the requested lang so the engine may still try,
    // and surface a clear notice instead of silently forcing English.
    _voiceNote = (curLang==="ja")
      ? `この端末に「${curLang}」用の音声がありません。端末の設定で音声を追加するか、別の言語を選んでください。`
      : `No speech voice for “${curLang}” is installed on this device. The system may fall back to another voice.`;
  }
  u.rate = (opts && opts.rate) || 0.95;
  u.pitch = 1;
  u.volume = Math.max(0.2, Math.min(1, DB.set.vol || 0.8));
  u.onend = u.onerror = ()=>{ _speaking = false; };
  _speaking = true;
  setTimeout(()=>{
    try{ speechSynthesis.speak(u); }catch(e){ _speaking = false; }
  }, 40);
  // brief note in UI
  if(_voiceNote) setTimeout(()=>{ try{ render(); }catch(e){} }, 50);
}

function speakQuestion(q){
  if(!q || !DB.set.voice) return;
  const qtext = tt(q.question);
  const choices = choicesOf(q);
  let body = qtext;
  if(choices.length){
    body += ". " + choices.map((c,i)=> String.fromCharCode(65+i) + ". " + c).join(". ");
  }
  speakText(body);
}

function speakExplanation(q){
  if(!q || !DB.set.voice) return;
  const parts = [
    tt(q.heritageName),
    tt(q.country),
    (q.year ? String(q.year) : ""),
    tt(q.explanation)
  ].filter(Boolean);
  speakText(parts.join(". "));
}

/* ----- Speech Recognition (talk to answer / commands) ----- */
function hasSpeechRecognition(){
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}

function ensureRecognition(){
  if(_rec) return _rec;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return null;
  _rec = new SR();
  _rec.continuous = false;
  _rec.interimResults = true;
  _rec.maxAlternatives = 5;
  _rec.onstart = ()=>{ _recognitionBusy = true; _lastVoiceFinal = ""; _listenState = "listening"; _listenText = ""; try{render();}catch(e){} };
  _rec.onresult = (ev)=>{
    let interim = "", final = "";
    for(let i = 0; i < ev.results.length; i++){
      const result = ev.results[i];
      const transcript = result && result[0] ? result[0].transcript : "";
      if(result.isFinal) final += transcript + " ";
      else interim += transcript + " ";
    }
    const heard = (final || interim).trim();
    if(heard) _listenText = heard;
    if(final.trim()){
      _lastVoiceFinal = final.trim();
      _listenState = "processing";
      try{render();}catch(e){}
      handleVoiceInput(_lastVoiceFinal);
      _lastVoiceFinal = "";
    }else{
      try{render();}catch(e){}
    }
  };
  _rec.onerror = (ev)=>{
    _recognitionBusy = false;
    _listenState = "error";
    const code = (ev && ev.error) || "";
    const messages = {
      "not-allowed":"マイクの使用が許可されていません。SafariのWebサイト設定でマイクを許可してください。",
      "service-not-allowed":"音声認識サービスが利用できません。Safariで開き直してください。",
      "no-speech":"声を検出できませんでした。マイクに近づいて、もう一度お話しください。",
      "audio-capture":"マイクが見つかりません。マイクの接続・設定を確認してください。",
      "network":"音声認識の通信に失敗しました。通信状態を確認してください。",
      "aborted":"音声認識を停止しました。"
    };
    _listenText = curLang==="ja" ? (messages[code] || "音声認識エラー: " + code) : ("Speech recognition error: " + code);
    try{render();}catch(e){}
    setTimeout(()=>{ if(_listenState === "error"){_listenState = "idle";try{render();}catch(e){}} }, 4000);
  };
  _rec.onend = ()=>{
    _recognitionBusy = false;
    // Some mobile browsers end with only an interim result. Use it as a fallback.
    if(_listenState === "listening" && _listenText.trim()){
      const heard = _listenText.trim();
      _listenState = "processing";
      try{handleVoiceInput(heard);}catch(e){}
    }
    if(_listenState === "listening") _listenState = "idle";
    try{render();}catch(e){}
  };
  return _rec;
}

function startListening(){
  if(!hasSpeechRecognition()){
    _listenState = "error";
    _listenText = curLang==="ja"
      ? "このSafariでは音声認識が利用できません。iOSを更新し、SafariでこのHTTPSページを開いてください。"
      : "Speech recognition is unavailable in this browser. Update iOS and open this HTTPS page in Safari.";
    try{render();}catch(e){}
    return;
  }
  stopSpeak();
  const r = ensureRecognition();
  if(!r) return;
  if(_listenState === "listening" || _recognitionBusy){
    try{r.stop();}catch(e){}
    _recognitionBusy = false;
    _listenState = "idle";
    try{render();}catch(e){}
    return;
  }
  _listenText = "";
  _listenState = "listening";
  try{
    r.lang = preferredBCP47();
    r.start();
  }catch(e){
    _recognitionBusy = false;
    _listenState = "error";
    _listenText = curLang==="ja"
      ? "マイクを開始できませんでした。もう一度マイクを押してください。"
      : "Could not start the microphone. Tap the microphone and try again.";
    try{render();}catch(e){}
  }
}

function stopListening(){
  try{ if(_rec) _rec.stop(); }catch(e){}
  _listenState = "idle";
}

/** Normalize spoken numbers / choice labels across languages */
function parseChoiceIndex(raw){
  let s = String(raw||"").toLowerCase().normalize("NFKC").trim();
  s = s.replace(/[。．.、,，\s]/g, "");
  // Accept common spoken phrases such as 「答えは2番」「Bです」「1つ目」.
  s = s.replace(/^(答えは|答え|正解は|選ぶのは|私は|それは)/, "");
  s = s.replace(/(です|だと思います|を選びます|番目|番|つ目|つ|です)$/g, "");
  if(/^[1-4]$/.test(s)) return parseInt(s,10)-1;
  if(/^[a-d]$/.test(s)) return s.charCodeAt(0)-97;
  const jaMap = {"いち":0,"一":0,"ひとつ":0,"ひとつめ":0,"い":0,"に":1,"二":1,"ふたつ":1,"ふたつめ":1,"さん":2,"三":2,"みっつ":2,"みっつめ":2,"よん":3,"し":3,"四":3,"よっつ":3,"よっつめ":3};
  if(jaMap[s] !== undefined) return jaMap[s];
  const words = {"one":0,"first":0,"1st":0,"two":1,"second":1,"2nd":1,"three":2,"third":2,"3rd":2,"four":3,"fourth":3,"4th":3,"un":0,"uno":0,"um":0,"eins":0,"하나":0,"일":0,"deux":1,"dos":1,"dois":1,"zwei":1,"둘":1,"이":1,"trois":2,"tres":2,"três":2,"drei":2,"셋":2,"삼":2,"quatre":3,"cuatro":3,"quatro":3,"vier":3,"넷":3,"사":3};
  if(words[s] !== undefined) return words[s];
  // Embedded spoken digit/letter, e.g. 「2番です」 or 「option C」.
  const m = s.match(/(?:^|[^a-z0-9])([1-4a-d])(?:$|[^a-z0-9])/i);
  if(m) return /[1-4]/.test(m[1]) ? Number(m[1])-1 : m[1].toLowerCase().charCodeAt(0)-97;
  return -1;
}

function handleVoiceInput(transcript){
  const raw = String(transcript||"").trim();
  if(!raw){ _listenState = "idle"; return; }
  const low = raw.toLowerCase();
  const Z = st.quiz;

  // Global / navigation commands (work even outside answer phase)
  const nextCmds = ["次","次へ","次の問題","つぎ","next","siguiente","suivant","proximo","próximo","weiter","avanti","다음","下一题","下一題"];
  const explainCmds = ["解説","詳しい解説","せつめい","explanation","explain","explicación","explication","explicação","erklärung","spiegazione","해설","解说"];
  const againCmds = ["もう一度","もういちど","再度","again","repeat","もう一回","다시","再来一次"];
  const skipCmds = ["スキップ","とばす","skip","saltar","passer"];
  const bmCmds = ["ブックマーク","お気に入り","bookmark","favorito","favori","즐겨찾기","收藏"];
  const homeCmds = ["ホーム","home","トップ","top"];

  const matchCmd = (list) => list.some(c => low.includes(c.toLowerCase()) || raw.includes(c));

  if(matchCmd(homeCmds)){ stopListening(); go("home"); return; }
  if(matchCmd(againCmds) && Z){ stopListening(); speakQuestion(curQ()); _listenState="idle"; return; }
  if(matchCmd(explainCmds) && Z && Z.picked !== null){ stopListening(); speakExplanation(curQ()); _listenState="idle"; return; }
  if(matchCmd(bmCmds) && Z){ stopListening(); toggleBm(Z.list[Z.i].id); _listenState="idle"; try{render();}catch(e){} return; }
  if(matchCmd(nextCmds) && Z){
    stopListening();
    if(Z.picked === null){ /* force skip? treat as no-op or advance after answer */ }
    else advance();
    _listenState = "idle";
    return;
  }
  if(matchCmd(skipCmds) && Z && Z.picked === null){
    // soft skip: pick nothing, just advance without scoring? keep simple — ignore
  }

  // Answer phase only
  if(!Z || Z.picked !== null){
    _listenState = "idle";
    _listenText = raw;
    try{render();}catch(e){}
    setTimeout(()=>{ _listenState="idle"; try{render();}catch(e){} }, 1800);
    return;
  }

  // 1) explicit number / letter
  let idx = parseChoiceIndex(raw);
  if(idx < 0){
    // try first token
    const first = raw.split(/[\s、。,．]+/)[0];
    idx = parseChoiceIndex(first);
  }

  // 2) match against choice text (partial, case-insensitive)
  if(idx < 0){
    const choices = choicesOf(Z.list[Z.i]);
    const norm = s => String(s||"").toLowerCase().replace(/\s+/g,"");
    const tnorm = norm(raw);
    for(let i=0;i<choices.length;i++){
      const c = norm(choices[i]);
      if(!c) continue;
      if(tnorm === c || (tnorm.length>=3 && (tnorm.includes(c) || c.includes(tnorm)))){
        idx = i; break;
      }
      // also try heritage name fragments
      const words = c.split(/[\s・]/);
      if(words.some(w => w.length>=2 && tnorm.includes(norm(w)))){
        idx = i; break;
      }
    }
  }

  if(idx >= 0 && idx <= 3){
    _listenText = raw + " → " + String.fromCharCode(65+idx);
    stopListening();
    pick(idx);
    _listenState = "idle";
  }else{
    _listenText = (curLang==="ja" ? "聞き取れませんでした: " : "Could not match: ") + raw;
    _listenState = "error";
    try{render();}catch(e){}
    setTimeout(()=>{ _listenState="idle"; try{render();}catch(e){} }, 2200);
  }
}

/* ---------- Helpers ---------- */
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function gradeClass(g){return g==="4"?"g4":g==="3"?"g3":g==="2"?"g2":g==="p1"?"gp1":"g1";}

function fieldOK(q){
  const f=DB.set.field;
  if(f==="all"||q.general) return true;
  const c = tt(q.country);
  if(f==="jp") return c==="日本"||c==="Japan";
  if(f==="world") return !(c==="日本"||c==="Japan");
  if(f==="cultural") return q.type==="文化遺産";
  return q.type==="自然遺産"||q.type==="複合遺産";
}
const GRANK={4:0,3:1,2:2,p1:3,1:4};
function gradeIn(g){ return DB.set.grade==="all"||GRANK[g]<=GRANK[DB.set.grade]; } // cumulative: higher levels include lower ranges
function gradeOK(q){ return gradeIn(q.grade); }
function pool(){
  return Q.filter(q=> gradeOK(q) && fieldOK(q) && (!DB.set.trapOnly || q.isTrap));

function inMode(q,m){

function setMode(m){ DB.set.mode=m; save(); render(); }
function setGrade(g){ DB.set.grade=g; save(); render(); }

function startQuiz(list){
  const src = list || shuffle(modeList(DB.set.mode)).slice(0,10);
  if(!src.length){ toast(t("noData")); return; }
  st.quiz={list:prepList(src), i:0, picked:null, log:[], mock:false};
  st.screen="quiz";
  bgmStart();
  render();
}
function startSmart(){
  const wrongs=modeList("wrong");
  const low=pool().filter(q=>{const p=DB.prog[q.id];return p&&p.a>=2&&p.c/p.a<0.6;});
  const base=shuffle([...wrongs,...low,...modeList("fresh")]).slice(0,10);
  startQuiz(base.length?base:shuffle(pool()).slice(0,10));
}

function curQ(){ return st.quiz? st.quiz.list[st.quiz.i] : null; }
function critMeaning(c){
  const m=String(c||"").match(/\(([ivx]+)\)/g); if(!m) return "";
  const seen=new Set(); let h="";
  m.forEach(x=>{ const k=x.slice(1,-1); if(seen.has(k)||!CRM[k]) return; seen.add(k); h+=`<div style="font-size:13px;margin-top:3px"><b>(${k})</b> ${esc(tt(CRM[k]))}</div>`; });
  return h? `<div class="dh">${t("criteriaLabel")}</div>${h}` : "";
}
function ell(s,n){ s=String(s||""); return s.length>n? s.slice(0,n)+"…" : s; }
function quiz(){
  const Z=st.quiz;
  if(!Z||!Z.list.length) return "<p>"+t("noData")+"</p>";
  const q=Z.list[Z.i];
  const choices=choicesOf(q);
  const gtag=`<span class="tag ${gradeClass(q.grade)}">${t("grades."+q.grade)}</span>`;
  const trap=q.isTrap?`<span class="tag trap">${t("trapBadge")}</span>`:"";
  const micSupported = hasSpeechRecognition();
  const micLabel = _listenState==="listening" ? "⏹" : "🎤";
  const micTitle = _listenState==="listening"
    ? (curLang==="ja"?"認識を停止":"Stop listening")
    : (curLang==="ja"?"話して答える":"Speak to answer");
  let h=`<div class="sb"><button onclick="go('home');stopSpeak();stopListening()">←</button><div class="st">${Z.i+1} / ${Z.list.length}${Z.deadline?` · ⏱ <span id="tmr">${fmtT(Z.deadline-Date.now())}</span>`:""}</div>
  <button onclick="DB.set.voice&&_speaking?stopSpeak():speakQuestion(curQ())" title="${t('speak')}">${_speaking?'⏹':'🔊'}</button>
  ${micSupported?`<button onclick="startListening()" title="${micTitle}" class="${_listenState==="listening"?"on":""}">${micLabel}</button>`:""}
  <button onclick="toggleBm('${q.id}')" class="${DB.bm[q.id]?"on":""}">⭐</button></div>
  <main>
  <div>${gtag}${trap}<span class="tag" style="background:var(--card2);color:var(--sub)">${esc(catName(q.category))}</span>
  <button class="lk" style="margin-left:8px" onclick="speakQuestion(curQ())">🔊 ${t('speak')}</button>
  ${micSupported?`<button class="lk" style="margin-left:6px" onclick="startListening()">${micLabel} ${curLang==="ja"?"話して答える":"Speak"}</button>`:""}
  </div>
  ${_voiceNote?`<div class="voice-note">${esc(_voiceNote)}</div>`:""}
  ${_listenState!=="idle"?`<div class="listen-bar ${_listenState}">${
    _listenState==="listening" ? (curLang==="ja"?"🎙 聞いています… 番号や選択肢を話してください":"🎙 Listening… say a number or choice")
    : _listenState==="processing" ? (curLang==="ja"?"処理中…":"Processing…")
    : esc(_listenText|| (curLang==="ja"?"認識エラー":"Error"))
  }${_listenText && _listenState!=="listening"?` <span class="lt">${esc(_listenText)}</span>`:""}</div>`:""}
  <div class="qq">${esc(tt(q.question))}</div>`;
  if(Z.picked===null){
    choices.forEach((c,i)=>{
      h+=`<button class="ch" onclick="pick(${i})"><b>${String.fromCharCode(65+i)}</b>${esc(c)}</button>`;
    });
  }else{
    choices.forEach((c,i)=>{
      let cls="ch disabled";
      if(i===q.answer) cls+=" right";
      else if(i===Z.picked) cls+=" wrong";
      h+=`<div class="${cls}"><b>${String.fromCharCode(65+i)}</b>${esc(c)}</div>`;
    });
    const ok=Z.picked===q.answer;
    h+=`<div class="verdict ${ok?"ok":"ng"}">${ok?"✅ "+t("correct"):"❌ "+t("wrong")}</div>
    <div class="panel">
      <h3>${t("detail")}</h3>
      ${q.general?"":`<dl>
        <dt>${t("heritage")}</dt><dd>${esc(tt(q.heritageName))}</dd>
        <dt>${t("country")}</dt><dd>${esc(cnm(q.country))}</dd>
        <dt>${t("year")}</dt><dd>${q.year}</dd>
        <dt>${t("type")}</dt><dd>${t("typeNames."+q.type)||q.type}</dd>
        <dt>${t("criteria")}</dt><dd>${q.criteria||"—"}</dd>
      </dl>`}
      <div class="pt">
        <div class="dh">${t("history")}</div>
        ${esc(tt(q.explanation))}
        ${q.isTrap?`<div class="tip">⚠️ ${t("trapNote")}: ${esc(tt(q.tip))}</div>`:""}
        ${critMeaning(q.criteria)}
        ${tt(q.ng)?`<div class="dh">${t("ngReason")}</div>${esc(tt(q.ng))}`:""}
        ${tt(q.tip)&&!q.isTrap?`<div class="dh">${t("tip")}</div>${esc(tt(q.tip))}`:""}
      </div>
    </div>
    <div class="row">
      <button class="btn primary" onclick="advance()">${Z.i+1>=Z.list.length?t("finish"):t("next")}</button>
      <button class="btn ghost" onclick="speakExplanation(curQ())">🔊 ${t("detail")}</button>
      <button class="btn share" onclick="shareCurrentQ()">📤 ${t("share")}</button>
      <button class="btn ghost" onclick="toggleBm('${q.id}')">${DB.bm[q.id]?"★":"☆"} ${t("bookmark")}</button>
    </div>`;
  }
  h+=`</main>`;
  // Auto-read unanswered question
  if(Z.picked===null && DB.set.voice && DB.set.voiceAuto && Z.spoken!==Z.i){
    Z.spoken=Z.i;
    setTimeout(()=>{ if(st.screen==="quiz"&&st.quiz===Z&&Z.i===Z.list.indexOf(q)) speakQuestion(q); }, 280);
  }
  return h;
}

function pick(i){
  const Z=st.quiz; if(!Z||Z.picked!==null) return;
  Z.picked=i;
  const q=Z.list[Z.i];
  const ok=i===q.answer;
  if(ok) playOK(); else playNG();
  // progress
  if(!DB.prog[q.id]) DB.prog[q.id]={a:0,c:0,l:0};
  DB.prog[q.id].a++;
  if(ok){ DB.prog[q.id].c++; DB.prog[q.id].l=1; } else DB.prog[q.id].l=0;
  const td=tdy(); td.n++; if(ok) td.c++;
  Z.log.push({q,ok,sel:choicesOf(q)[i],ans:choicesOf(q)[q.answer]});
  save();
  render();
}
function advance(){
  stopSpeak();
  stopListening();
  _voiceNote = "";
  const Z=st.quiz;
  if(Z.i+1>=Z.list.length){
    st.screen="result";
  }else{
    Z.i++; Z.picked=null; const mm=document.querySelector("main"); if(mm) mm.scrollTop=0;
  }
  render();
}
function toggleBm(id){
  if(DB.bm[id]) delete DB.bm[id]; else DB.bm[id]=1;
  save(); render();
}

function result(){
  const Z=st.quiz;
  const ok=Z.log.filter(x=>x.ok).length;
  const total=Z.mock? Z.list.length : Z.log.length;
  const rate=total?Math.round(ok/total*100):0;
  const verdict=Z.mock? `<div class="verdict ${rate>=70?"ok":"ng"}" style="margin-top:10px">${Z.timeUp?"⏱ "+t("timeUp")+" · ":""}${rate>=70?"🎉 "+t("passed"):t("failed")}</div>` : "";
  let h=`<div class="sb"><button onclick="go('home')">← ${t("home")}</button><div class="st">${t("resultTitle")}</div><span></span></div>
  <main>
  <div class="card" style="text-align:center">
    <div class="bigscore">${ok} / ${total}</div>
    <div style="font-size:18px;margin-bottom:8px">${t("rate")}: ${rate}%</div>
    <div class="pb" style="max-width:240px;margin:12px auto"><i style="width:${rate}%"></i></div>${verdict}
  </div>
  <div class="row" style="justify-content:center">
    <button class="btn primary" onclick="${Z.mock?"startMock()":"startQuiz()"}">${t("again")}</button>
    <button class="btn share" onclick="shareProgress()">📤 ${t("share")}</button>
    <button class="btn ghost" onclick="go('home')">${t("home")}</button>
  </div>
  <div class="card" style="margin-top:16px"><b>${t("review")}</b>
  <div style="margin-top:10px">`;
  Z.log.forEach((x,i)=>{
    h+=`<div class="li"><b>${i+1}. ${esc(ell(tt(x.q.question),60))}</b>
    <small style="color:${x.ok? "var(--ok)":"var(--ng)"}">${x.ok?"○":"×"} ${esc(x.sel)}${x.ok?"":" → "+esc(x.ans||"")}</small></div>`;
  });
  if(Z.mock && Z.log.length<Z.list.length) h+=`<div class="li"><small style="color:var(--sub)">${t("unans")}: ${Z.list.length-Z.log.length}</small></div>`;
  h+=`</div></div></main>`;
  return h;
}

/* Flashcards */
function flash(){
  if(!st.fl){
    const list=shuffle(HL.filter(h=>gradeIn(h.grade)));
    st.fl={list, i:0, flip:false};
  }
  const F=st.fl;
  if(!F.list.length) return `<main><p>${t("noData")}</p></main>`;
  const h=F.list[F.i];
  let card;
  if(!F.flip){
    card=`<div class="fc" onclick="st.fl.flip=true;render()">
      <div class="name">${esc(tt(h.name))}</div>
      <div class="meta">${t("flashFlip")}</div>
    </div>`;
  }else{
    card=`<div class="fc flip" onclick="st.fl.flip=false;render()">
      <div class="name">${esc(tt(h.name))}</div>
      <div class="meta">${esc(cnm(h.country))} · ${h.year} · ${t("typeNames."+h.type)||h.type}</div>
      <div class="meta" style="margin-top:8px">${h.criteria||""}</div>
      <div style="margin-top:12px;font-size:13px;color:var(--sub);max-width:90%">${esc(ell(tt(h.explain),120))}</div>
    </div>`;
  }
  return `<div class="sb"><button onclick="go('home')">←</button><div class="st">${F.i+1}/${F.list.length}</div><span></span></div>
  <main>${card}
  <div class="sw">
    <button class="btn ghost" onclick="fcMove(-1)">← ${t("prev")}</button>
    <button class="btn primary" onclick="fcMove(1)">${t("nextCard")} →</button>
  </div></main>`;
}
function fcMove(d){
  const F=st.fl; if(!F) return;
  F.i=(F.i+d+F.list.length)%F.list.length;
  F.flip=false;
  render();
}

/* Browse */
function browseList(){

function updBrowse(){ const el=document.getElementById("bl"); if(el) el.innerHTML=browseList(); }
function browse(){

  <main><input type="search" value="${esc(st.bq||"")}" placeholder="${t("searchPh")}" oninput="st.bq=this.value;updBrowse()" style="width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;cursor:text">

/* Report */
function report(){
  const byG={}, byC={}, byR={}, wrong={};
  Q.forEach(q=>{
    const p=DB.prog[q.id];
    if(!p) return;
    const g=q.grade, c=q.category, r=q.region||"other";
    if(!byG[g]) byG[g]={a:0,c:0}; byG[g].a+=p.a; byG[g].c+=p.c;
    if(!byC[c]) byC[c]={a:0,c:0}; byC[c].a+=p.a; byC[c].c+=p.c;
    if(!byR[r]) byR[r]={a:0,c:0}; byR[r].a+=p.a; byR[r].c+=p.c;
    if(p.l===0 && !q.general){ const n=tt(q.heritageName); wrong[n]=(wrong[n]||0)+1; }
  });
  const wl=Object.entries(wrong).sort((a,b)=>b[1]-a[1]).slice(0,5);
  function pbar(lab,o){
    const r=o&&o.a?Math.round(o.c/o.a*100):0;
    return `<div class="pbar"><div class="lab"><span>${esc(lab)}</span><span>${o&&o.a?r+"% ("+o.c+"/"+o.a+")":t("noData")}</span></div>
    <div class="bar"><i style="width:${r}%"></i></div></div>`;
  }
  let h=`<div class="sb"><button onclick="go('home')">←</button><div class="st">${t("menu.report")}</div><span></span></div>
  <main>
  <div class="card"><b>${t("reportGrade")}</b>${Object.keys(byG).map(k=>pbar(t("grades."+k),byG[k])).join("")||"<p>"+t("noData")+"</p>"}</div>
  <div class="card"><b>${t("reportCat")}</b>${Object.keys(byC).map(k=>pbar(catName(k),byC[k])).join("")||""}</div>
  <div class="card"><b>${t("reportRegion")}</b>${Object.keys(byR).map(k=>pbar(regName(k),byR[k])).join("")||""}</div>
  <div class="card"><b>${t("topWrong")}</b><div style="margin-top:8px">${wl.length?wl.map((x,i)=>(i+1)+". "+esc(x[0])+" ("+x[1]+")").join("<br>"):t("noData")}</div></div>
  <div class="row"><button class="btn primary" onclick="startSmart()">🎯 ${t("smart")}</button>
  <button class="btn share" onclick="shareProgress()">📤 ${t("share")}</button></div>
  </main>`;
  return h;
}

/* Mock */
function mock(){
  return `<div class="sb"><button onclick="go('home')">←</button><div class="st">${t("menu.mock")}</div><span></span></div>
  <main class="card">
  <p style="margin-bottom:14px">${t("mockDesc")}</p>
  <p style="margin-bottom:14px;color:var(--sub);font-size:13px">${t("grade")}: <b style="color:var(--tx)">${DB.set.grade==="all"?t("all"):t("grades."+DB.set.grade)}</b> · ${mockSpec().n}${t("mockInfo")} ${Math.round(mockSpec().sec/60)}${t("min")}</p>
  <button class="go" onclick="startMock()" ${mockSpec().n?"":"disabled"}>📝 ${t("mockStart")}</button>
  </main>`;
}
function mockSpec(){
  const g=DB.set.grade;
  const n = g==="4"?20 : (g==="all"||g==="3")?30 : 40;
  const cnt = Math.min(n, pool().length);
  return {n:cnt, sec:cnt*45};
}
function fmtT(ms){ ms=Math.max(0,ms); const s=Math.ceil(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function startMock(){
  const sp=mockSpec();
  if(!sp.n){ toast(t("noData")); return; }
  const list=prepList(shuffle(pool()).slice(0,sp.n));
  st.quiz={list,i:0,picked:null,log:[],mock:true,deadline:Date.now()+sp.sec*1000};
  st.screen="quiz";
  bgmStart();
  render();
}
setInterval(()=>{
  const Z=st.quiz;
  if(st.screen!=="quiz"||!Z||!Z.deadline) return;
  const left=Z.deadline-Date.now();
  const el=document.getElementById("tmr");
  if(left<=0){ stopSpeak(); Z.timeUp=true; st.screen="result"; render(); }
  else if(el) el.textContent=fmtT(left);
},500);

        <option value="es" ${DB.set.lang==="es"?"selected":""}>🇪🇸 Español</option>
        <option value="zh" ${DB.set.lang==="zh"?"selected":""}>🇨🇳 中文</option>
        <option value="ko" ${DB.set.lang==="ko"?"selected":""}>🇰🇷 한국어</option>
        <option value="de" ${DB.set.lang==="de"?"selected":""}>🇩🇪 Deutsch</option>
        <option value="it" ${DB.set.lang==="it"?"selected":""}>🇮🇹 Italiano</option>
        <option value="ar" ${DB.set.lang==="ar"?"selected":""}>🇸🇦 العربية</option>
        <option value="hi" ${DB.set.lang==="hi"?"selected":""}>🇮🇳 हिन्दी</option>
        <option value="ru" ${DB.set.lang==="ru"?"selected":""}>🇷🇺 Русский</option>
        <option value="th" ${DB.set.lang==="th"?"selected":""}>🇹🇭 ไทย</option>
        <option value="id" ${DB.set.lang==="id"?"selected":""}>🇮🇩 Indonesia</option>
        <option value="tr" ${DB.set.lang==="tr"?"selected":""}>🇹🇷 Türkçe</option>
      </select>
    </div>
    <div class="opt"><span>${t("bgm")}</span><button class="tg ${DB.set.bgm?"on":""}" onclick="DB.set.bgm=!DB.set.bgm;if(DB.set.bgm&&st.screen==="quiz")bgmStart();else bgmStop();save();render()">${DB.set.bgm?"ON":"OFF"}</button></div>
    <div class="opt"><span>${t("se")}</span><button class="tg ${DB.set.se?"on":""}" onclick="DB.set.se=!DB.set.se;save();render()">${DB.set.se?"ON":"OFF"}</button></div>
    <div class="opt"><span>${t("voice")}</span><button class="tg ${DB.set.voice?"on":""}" onclick="DB.set.voice=!DB.set.voice;if(!DB.set.voice)stopSpeak();save();render()">${DB.set.voice?"ON":"OFF"}</button></div>
    <div class="opt"><span>${t("voiceAuto")}</span><button class="tg ${DB.set.voiceAuto?"on":""}" onclick="DB.set.voiceAuto=!DB.set.voiceAuto;save();render()">${DB.set.voiceAuto?"ON":"OFF"}</button></div>
    <div class="opt"><span>${t("volume")}</span><input type="range" min="0" max="1" step="0.05" value="${DB.set.vol}" oninput="DB.set.vol=+this.value;if(master)master.gain.value=DB.set.vol;save()" style="width:120px"></div>
    <div class="opt"><span>${t("goalSet")}</span><input type="number" min="5" max="100" value="${DB.set.goal}" onchange="DB.set.goal=+this.value||20;save();render()" style="width:70px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px;color:var(--tx)"></div>
    <div class="opt"><span>${t("trapMode")}</span><button class="tg ${DB.set.trapOnly?"on":""}" onclick="DB.set.trapOnly=!DB.set.trapOnly;save();render()">${DB.set.trapOnly?"ON":"OFF"}</button></div>
    <button class="btn primary" style="width:100%;margin-top:12px" onclick="modal(null)">${t("close")}</button>`;
  }else if(st.modal==="field"){
    body=`<h4>${t("field")}</h4>`;
    ["all","jp","world","cultural","natural"].forEach(k=>{
      body+=`<button class="li" onclick="DB.set.field='${k}';save();modal(null)">${t("fields."+k)}</button>`;
    });
  }
  return `<div class="sheet" onclick="if(event.target===this)modal(null)"><div>${body}</div></div>`;
}

/* Navigation */
function go(s){
  stopSpeak();
  stopListening();
  _voiceNote = "";
  st.screen=s;
  st.quiz=null; st.fl=null; st.modal=null;
  if(s!=="quiz"&&s!=="flash") bgmStop();
  render();
}

/* Render */
function render(){
  const app=$("#app");
  let html="";
  if(st.screen==="home"){
    html=`<div class="hd">
      <select aria-label="grade" onchange="setGrade(this.value)">
        <option value="all" ${DB.set.grade==="all"?"selected":""}>${t("all")}</option>
        <option value="4" ${DB.set.grade==="4"?"selected":""}>${t("grades.4")}</option>
        <option value="3" ${DB.set.grade==="3"?"selected":""}>${t("grades.3")}</option>
        <option value="2" ${DB.set.grade==="2"?"selected":""}>${t("grades.2")}</option>
        <option value="p1" ${DB.set.grade==="p1"?"selected":""}>${t("grades.p1")}</option>
        <option value="1" ${DB.set.grade==="1"?"selected":""}>${t("grades.1")}</option>
      </select>
      <div class="tt">${t("title")}</div>
      <span style="display:flex;gap:6px">
        <select class="lang-sel" onchange="DB.set.lang=this.value;initLang();save();render()" title="Language" aria-label="Language">
          <option value="ja" ${curLang==="ja"?"selected":""}>JA</option>
          <option value="en" ${curLang==="en"?"selected":""}>EN</option>
          <option value="fr" ${curLang==="fr"?"selected":""}>FR</option>
          <option value="pt" ${curLang==="pt"?"selected":""}>PT</option>
          <option value="es" ${curLang==="es"?"selected":""}>ES</option>
          <option value="zh" ${curLang==="zh"?"selected":""}>ZH</option>
          <option value="ko" ${curLang==="ko"?"selected":""}>KO</option>
          <option value="de" ${curLang==="de"?"selected":""}>DE</option>
          <option value="it" ${curLang==="it"?"selected":""}>IT</option>
          <option value="ar" ${curLang==="ar"?"selected":""}>AR</option>
          <option value="hi" ${curLang==="hi"?"selected":""}>HI</option>
          <option value="ru" ${curLang==="ru"?"selected":""}>RU</option>
          <option value="th" ${curLang==="th"?"selected":""}>TH</option>
          <option value="id" ${curLang==="id"?"selected":""}>ID</option>
          <option value="tr" ${curLang==="tr"?"selected":""}>TR</option>
        </select>
        <button class="ic" onclick="modal('set')" aria-label="Settings">⚙️</button>
      </span>
    </div><main>${home()}</main>`;
  }else if(st.screen==="quiz") html=quiz();
  else if(st.screen==="result") html=result();
  else if(st.screen==="flash") html=flash();
  else if(st.screen==="browse") html=browse();
  else if(st.screen==="report") html=report();
  else if(st.screen==="mock") html=mock();
  else if(st.screen==="guide") html=guide();
  else if(st.screen==="import") html=importScr();

  html+=modalHTML();
  if(st.toast) html+=`<div class="toast">${esc(st.toast)}</div>`;
  app.innerHTML=html;
}

function cycleLang(){
  const order=["ja","en","fr","pt","es","zh","ko","de","it","ar","hi","ru","th","id","tr"];
  const i=order.indexOf(curLang);
  DB.set.lang=order[(i+1)%order.length];
  initLang();
  save();
  render();
}

/* Keyboard */
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT"||e.target.tagName==="TEXTAREA") return;
  if(e.key==="Escape"){ if(st.modal) modal(null); else if(st.screen!=="home") go("home"); return; }
  if(st.modal) return;
  if(st.screen==="quiz"&&st.quiz){
    const Z=st.quiz;
    if(Z.picked===null){
      const i="1234".indexOf(e.key);
      const j="abcd".indexOf(String(e.key).toLowerCase());
      if(i>=0) pick(i); else if(j>=0) pick(j);
    }else if(e.key==="Enter"||e.key===" "||e.key==="ArrowRight"){ e.preventDefault(); advance(); }
    else if(String(e.key).toLowerCase()==="b") toggleBm(Z.list[Z.i].id);
  }else if(st.screen==="flash"&&st.fl){
    if(e.key==="ArrowRight") fcMove(1);
    else if(e.key==="ArrowLeft") fcMove(-1);
    else if(e.key===" "||e.key==="Enter"){ e.preventDefault(); st.fl.flip=!st.fl.flip; render(); }
  }
});

/* Touch swipe for flash / next */
let tx0=0,ty0=0;
document.addEventListener("touchstart",e=>{const t=e.changedTouches[0];tx0=t.clientX;ty0=t.clientY;},{passive:true});
document.addEventListener("touchend",e=>{
  if(st.modal) return;
  const t=e.changedTouches[0], dx=t.clientX-tx0, dy=t.clientY-ty0;
  if(Math.abs(dx)<70||Math.abs(dy)>50) return;
  if(st.screen==="flash"&&st.fl) fcMove(dx<0?1:-1);
  else if(st.screen==="quiz"&&st.quiz&&st.quiz.picked!==null&&dx<0) advance();
},{passive:true});

/* Study time */
setInterval(()=>{
  if(document.hidden) return;
  if(st.screen==="quiz"||st.screen==="flash"){ const t=tdy(); t.s=(t.s||0)+10; save(); }
},10000);

/* First interaction → audio unlock */
document.addEventListener("click",function once(){ ac(); document.removeEventListener("click",once); },{once:true});

render();

</script>
</body>
</html>
