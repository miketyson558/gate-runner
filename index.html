<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アニメトレカ・スタジオ</title>


<style>
:root{
  --bg:#f4f5fb;--panel:rgba(255,255,255,.92);--ink:#171526;--sub:#6d6a7f;
  --line:#e7e2f1;--pink:#ff4d91;--purple:#7558ff;--cyan:#38cfe6;--gold:#d6a62a;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:
 radial-gradient(circle at 10% 0%,rgba(255,169,214,.28),transparent 28%),
 radial-gradient(circle at 90% 10%,rgba(117,88,255,.18),transparent 28%),
 linear-gradient(180deg,#f9f8fd,#eef0f7 65%,#f8f7fb);
 color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
 -webkit-font-smoothing:antialiased;
}
button,input{font:inherit}
button{touch-action:manipulation}
.app{width:min(100%,560px);margin:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(26px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:10px}
.brandmark{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#ff4d91,#7558ff);box-shadow:0 8px 24px rgba(117,88,255,.24);display:grid;place-items:center;color:#fff;font-size:19px}
h1{font-size:18px;line-height:1.05;margin:0;font-weight:900;letter-spacing:.02em}
.subbrand{font-size:10px;color:var(--sub);margin-top:3px}
.ctl{display:flex;align-items:center;gap:6px}
.ic{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;width:36px;height:34px;box-shadow:0 4px 12px rgba(34,24,66,.06);opacity:.55}
.ic.on{opacity:1;border-color:rgba(117,88,255,.35);background:linear-gradient(135deg,#fff,#f0ecff)}
.lang{display:flex;border:1px solid var(--line);background:#fff;border-radius:999px;overflow:hidden;box-shadow:0 4px 12px rgba(34,24,66,.06)}
.lang button{border:0;background:transparent;color:var(--sub);padding:7px 10px;font-size:12px;font-weight:800}
.lang button.sel{background:var(--purple);color:#fff}
.hero-note{display:flex;gap:8px;align-items:center;justify-content:center;background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--sub);font-size:11px;margin:0 auto 10px;max-width:max-content}
.stage{display:flex;justify-content:center;perspective:1100px;padding:4px 0 10px}
.card{position:relative;width:min(100%,390px);aspect-ratio:750/1050;transition:transform .14s ease-out;transform-style:preserve-3d;touch-action:pan-y;filter:drop-shadow(0 22px 30px rgba(28,18,64,.24))}
.card canvas{width:100%;height:100%;display:block;border-radius:6%;background:#fff}
.holo{position:absolute;inset:2%;border-radius:6%;pointer-events:none;mix-blend-mode:screen;opacity:0;transition:opacity .25s;
background:linear-gradient(115deg,transparent 20%,rgba(255,80,160,.45) 35%,rgba(255,220,80,.45) 45%,rgba(80,255,200,.45) 55%,rgba(80,150,255,.45) 65%,transparent 80%);
background-size:250% 250%;background-position:var(--hx,50%) var(--hy,50%)}
.card.on .holo{opacity:.62}
.box{background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.8);border-radius:22px;padding:13px;margin-top:10px;box-shadow:0 12px 34px rgba(39,25,82,.08)}
.section-title{font-size:12px;font-weight:900;letter-spacing:.05em;margin:2px 0 7px}
.row{display:flex;gap:8px}
.btn{flex:1;appearance:none;border:0;border-radius:14px;padding:12px 10px;color:#fff;background:linear-gradient(135deg,#7558ff,#5a4af4);cursor:pointer;box-shadow:0 5px 0 rgba(58,40,124,.16);font-weight:800;font-size:14px;min-height:46px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(58,40,124,.16)}
.btn.pink{background:linear-gradient(135deg,#ff4d91,#ff3d73)}
.btn.x{background:#171717}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 12px rgba(34,24,66,.05)}
.btn.on{background:linear-gradient(135deg,#ff4d91,#7558ff)}
label{display:block;font-size:11px;color:var(--sub);font-weight:800;margin:11px 0 5px}
input[type=text]{width:100%;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);outline:none}
input[type=text]:focus{border-color:#9b8cff;box-shadow:0 0 0 4px rgba(117,88,255,.10)}
input[type=range]{width:100%;accent-color:var(--purple)}
.rar{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.rar button{appearance:none;font-size:13px;font-weight:800;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.rar button.sel{border-color:var(--gold);background:linear-gradient(135deg,rgba(255,210,74,.32),rgba(255,95,162,.18));box-shadow:inset 0 0 0 1px rgba(214,166,42,.18)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;width:82px;appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:13px;padding:5px;font-size:10px;line-height:1.25;font-weight:700;display:flex;flex-direction:column;gap:5px;align-items:center}
.chips button.sel{border-color:var(--purple);box-shadow:0 0 0 2px rgba(117,88,255,.11);background:#faf9ff}
.chips i{display:block;width:100%;height:48px;border-radius:9px}
.hint{font-size:10px;color:var(--sub);text-align:center;margin:9px 2px 0;line-height:1.5}
.status{font-size:11px;line-height:1.45;color:var(--sub);min-height:16px;margin:7px 2px 0}
.inl{display:flex;align-items:center;justify-content:space-between}
input[type=color]{width:54px;height:34px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0}
#ov{position:fixed;inset:0;background:rgba(12,9,24,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;z-index:20}
#ov.show{display:flex}
#ov img{max-height:72vh;max-width:94vw;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);-webkit-touch-callout:default;user-select:auto}
#ov p{color:#fff;margin:0;font-size:12px;text-align:center;line-height:1.5}
.badges{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:4px 0 10px}
.badge{font-size:10px;font-weight:800;color:#5d5870;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 8px}
@media (max-width:430px){
 .app{padding-left:10px;padding-right:10px}
 .card{width:min(100%,365px)}
 .box{border-radius:18px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

</head>

<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <div class="brandmark">✦</div>
      <div><h1><span data-i="title"></span></h1><div class="subbrand" data-i="subtitle"></div></div>
    </div>
    <div class="ctl">
      <button class="ic" id="bBgm" aria-label="BGM">🎵</button>
      <button class="ic on" id="bSe" aria-label="SE">🔔</button>
      <div class="lang"><button data-l="ja">JP</button><button data-l="en">EN</button></div>
    </div>
  </div>

  <div class="hero-note">✨ <span data-i="hero"></span></div>

  <div class="stage">
    <div class="card" id="card">
      <canvas id="cv" width="750" height="1050"></canvas>
      <div class="holo"></div>
    </div>
  </div>

  <div class="badges">
    <span class="badge" data-i="badgeLocal"></span>
    <span class="badge" data-i="badgeFree"></span>
    <span class="badge" data-i="badgeSave"></span>
  </div>

  <div class="box">
    <div class="section-title" data-i="photoTitle"></div>
    <div class="row">
      <button class="btn" id="bCam" data-i="cam"></button>
      <button class="btn ghost" id="bPick" data-i="pick"></button>
    </div>
    <input type="file" id="fCam" accept="image/*" capture="environment" hidden>
    <input type="file" id="fPick" accept="image/*" hidden>

    <div class="row" style="margin-top:8px">
      <button class="btn on" id="bAni" data-i="ani"></button>
      <button class="btn on" id="bPop" data-i="pop"></button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn on" id="bCut" data-i="cut"></button>
    </div>
    <div class="status" id="cutMsg"></div>
    <label for="ct" data-i="cutT"></label>
    <input type="range" id="ct" min="25" max="80" step="1" value="46">
  </div>

  <div class="box">
    <div class="section-title" data-i="cardTitle"></div>
    <label for="nm" data-i="name"></label>
    <input type="text" id="nm" maxlength="16" data-p="nmPh" autocomplete="off">
    <label for="nk" data-i="nick"></label>
    <input type="text" id="nk" maxlength="20" data-p="nkPh" autocomplete="off">
    <label data-i="catT"></label><div class="rar" id="cat" style="grid-template-columns:repeat(2,1fr)"></div>
    <label data-i="rar"></label><div class="rar" id="rar"></div>
  </div>

  <div class="box">
    <div class="section-title" data-i="visualTitle"></div>
    <label data-i="bgT"></label><div class="chips" id="bg"></div>
    <label class="inl"><span data-i="solidT"></span><input type="color" id="sc" value="#7a5cff"></label>
    <label data-i="frmT"></label><div class="chips" id="frm"></div>
    <label for="zm" data-i="zoom"></label>
    <input type="range" id="zm" min="0.6" max="2.5" step="0.05" value="1">
  </div>

  <div class="row" style="margin-top:12px">
    <button class="btn pink" id="bSave" data-i="save"></button>
    <button class="btn x" id="bX" data-i="share"></button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="btn ghost" id="bReset" data-i="reset"></button>
  </div>
  <p class="hint" data-i="hint"></p>
</div>
<div id="ov">
  <img id="oi" alt="card">
  <p id="om" data-i="ovmsg"></p>
  <button class="btn ghost" id="oc" data-i="close" style="flex:none;padding:12px 28px"></button>
</div>
<script>



const W=750,H=1050,cv=document.getElementById('cv'),x=cv.getContext('2d');
const $=id=>document.getElementById(id);
const RAR=[
 {k:'N',star:1,col:'#cfd3d8',stops:[[0,'#8a9099'],[.5,'#eef0f3'],[1,'#7d838c']]},
 {k:'R',star:2,col:'#7cc4ff',stops:[[0,'#2a6fd6'],[.5,'#bfe3ff'],[1,'#2a6fd6']]},
 {k:'SR',star:4,col:'#ffd24a',stops:[[0,'#a8740a'],[.25,'#fff0a0'],[.5,'#e0a823'],[.75,'#fff0a0'],[1,'#a8740a']]},
 {k:'SSR',star:5,col:'#ffd24a',stops:[[0,'#ff4d6d'],[.2,'#ffb700'],[.4,'#4dff9d'],[.6,'#4db8ff'],[.8,'#b04dff'],[1,'#ff4d6d']]}
];
const SKILLS=['ひるねアタック','ごろごろカノン','きらきらビーム','もふもふバリア','ぴょんぴょんラッシュ','ほえほえウェーブ','だっこチャージ','ぷにぷにストライク'];
const FONT='DotGothic16,"Hiragino Kaku Gothic ProN","Yu Gothic",monospace';
let S={img:null,rar:3,zoom:1};

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rr(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function grad(R,x0,y0,x1,y1){const g=x.createLinearGradient(x0,y0,x1,y1);R.stops.forEach(s=>g.addColorStop(s[0],s[1]));return g}
function spark(cx,cy,r,a){x.save();x.globalAlpha=a;x.fillStyle='#fff';x.shadowColor='#fff';x.shadowBlur=12;x.beginPath();
 for(let i=0;i<8;i++){const ang=i*Math.PI/4,rad=i%2?r*.25:r;x.lineTo(cx+Math.cos(ang)*rad,cy+Math.sin(ang)*rad)}x.closePath();x.fill();x.restore()}
function fit(t,px,maxW,wt){let s=px;x.font=`${wt||''} ${s}px ${FONT}`;while(x.measureText(t).width>maxW&&s>14){s-=2;x.font=`${wt||''} ${s}px ${FONT}`}return s}

S.pat=0;S.sty=1;S.ill=null;
const PATS=['ボケ','ハート','星','ホロ線'],STY=['写真のまま','イラスト風'];
const WASH=[['#9fb4c8','#eef3f8','#8aa0b8'],['#2a8fe0','#7fe0ff','#6a7cff'],['#ff9a1f','#ffd24a','#ff5a5a'],['#ff4d8d','#ffd24a','#4dffc3','#4d9dff','#b04dff']];
function heart(g,cx,cy,s){g.beginPath();g.moveTo(cx,cy+s*.35);g.bezierCurveTo(cx-s,cy-s*.2,cx-s*.45,cy-s*.95,cx,cy-s*.4);g.bezierCurveTo(cx+s*.45,cy-s*.95,cx+s,cy-s*.2,cx,cy+s*.35);g.fill()}
function star(g,cx,cy,r,rot){g.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,d=i%2?r*.45:r;g.lineTo(cx+Math.cos(a)*d,cy+Math.sin(a)*d)}g.closePath();g.fill()}
function blur3(s,w,h){const o=new Uint8ClampedArray(s.length);for(let y=0;y<h;y++)for(let X=0;X<w;X++){let r=0,g=0,b=0,n=0;for(let j=-1;j<=1;j++){const yy=y+j;if(yy<0||yy>=h)continue;for(let i=-1;i<=1;i++){const xx=X+i;if(xx<0||xx>=w)continue;const p=(yy*w+xx)*4;r+=s[p];g+=s[p+1];b+=s[p+2];n++}}const q=(y*w+X)*4;o[q]=r/n;o[q+1]=g/n;o[q+2]=b/n;o[q+3]=255}return o}
function sparkOn(g,cx,cy,r,a){g.save();g.globalAlpha=a;g.fillStyle='#fff';g.shadowColor='#fff';g.shadowBlur=10;g.beginPath();for(let i=0;i<8;i++){const an=i*Math.PI/4,d=i%2?r*.25:r;g.lineTo(cx+Math.cos(an)*d,cy+Math.sin(an)*d)}g.closePath();g.fill();g.restore()}
// ===== 写真→アニメ風（ぼかし→セル塗り量子化→彩度/コントラスト強調→太め輪郭線）=====
function makeIll(im){
 const k=Math.min(1,720/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k);
 const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(im,0,0,w,h);
 const id=g.getImageData(0,0,w,h),d=blur3(blur3(blur3(id.data,w,h),w,h),w,h),n=w*h,L=new Float32Array(n),E=new Float32Array(n);
 for(let i=0;i<n;i++)L[i]=.3*d[i*4]+.59*d[i*4+1]+.11*d[i*4+2];
 for(let y=1;y<h-1;y++)for(let X=1;X<w-1;X++){const i=y*w+X;const gx=L[i-w+1]+2*L[i+1]+L[i+w+1]-L[i-w-1]-2*L[i-1]-L[i+w-1],gy=L[i+w-1]+2*L[i+w]+L[i+w+1]-L[i-w-1]-2*L[i-w]-L[i-w+1];E[i]=Math.sqrt(gx*gx+gy*gy)}
 const o=id.data,B=5,ln=[95,55,85];
 for(let y=0;y<h;y++)for(let X=0;X<w;X++){const i=y*w+X,p=i*4,l=L[i];
  const pos=l/255*(B-1),lo=Math.floor(pos),fr=pos-lo,s=Math.min(1,Math.max(0,(fr-.35)/.3)),lq=Math.min(255,(lo+s)/(B-1)*255),ratio=(lq+14)/(l+14);
  let e=E[i];if(y>1&&X>1&&y<h-2&&X<w-2)e=Math.max(e,E[i-1],E[i+1],E[i-w],E[i+w]);
  const a=Math.min(1,Math.max(0,(e-36)/70))*.8;
  for(let q=0;q<3;q++){let v=d[p+q]*ratio;v=lq+(v-lq)*1.55;v=(v-128)*1.04+146;v=v*.86+36;v=Math.max(0,Math.min(255,v));o[p+q]=v*(1-a)+ln[q]*a}
  o[p+3]=255}
 g.putImageData(id,0,0);return c}

function magic(g,cx,cy,rad){
 g.save();g.globalCompositeOperation='screen';g.strokeStyle='rgba(255,255,255,.65)';
 [rad,rad*.9,rad*.62].forEach((r,i)=>{g.lineWidth=i?2:4;g.beginPath();g.arc(cx,cy,r,0,7);g.stroke()});
 g.lineWidth=3;for(let t=0;t<2;t++){g.beginPath();for(let k=0;k<3;k++){const a=-Math.PI/2+t*Math.PI/3+k*2*Math.PI/3;g.lineTo(cx+Math.cos(a)*rad*.9,cy+Math.sin(a)*rad*.9)}g.closePath();g.stroke()}
 g.lineWidth=2;for(let k=0;k<48;k++){const a=k*Math.PI/24;g.beginPath();g.moveTo(cx+Math.cos(a)*rad*.9,cy+Math.sin(a)*rad*.9);g.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);g.stroke()}
 g.restore()}

// ===== 背景10種（オフスクリーンにキャッシュ）=====
const BGC={};
function bgLayer(t,w,h){
 if(BGC[t])return BGC[t];
 const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d'),r=rng(101+t*31),R=()=>r();
 const lin=(x0,y0,x1,y1,a)=>{const q=g.createLinearGradient(x0,y0,x1,y1);a.forEach((s,i)=>q.addColorStop(i/(a.length-1),s));return q};
 const rad=(cx,cy,r0,r1,a)=>{const q=g.createRadialGradient(cx,cy,r0,cx,cy,r1);a.forEach((s,i)=>q.addColorStop(i/(a.length-1),s));return q};
 g.fillStyle='#000';g.fillRect(0,0,w,h);
 if(t===0){g.fillStyle=rad(w/2,h*.4,0,h*.8,['#3a2175','#150a38','#04010d']);g.fillRect(0,0,w,h);g.globalCompositeOperation='screen';
  for(let i=0;i<8;i++){const px=R()*w,py=R()*h,r0=120+R()*200,col=['120,60,255','255,70,180','60,160,255'][i%3],q=g.createRadialGradient(px,py,0,px,py,r0);q.addColorStop(0,`rgba(${col},.45)`);q.addColorStop(1,`rgba(${col},0)`);g.fillStyle=q;g.fillRect(0,0,w,h)}
  g.globalCompositeOperation='source-over';for(let i=0;i<280;i++){g.fillStyle=`rgba(255,255,255,${.3+R()*.7})`;const s=R()*2.3;g.fillRect(R()*w,R()*h,s,s)}for(let i=0;i<10;i++)sparkOn(g,R()*w,R()*h,8+R()*14,.9)}
 else if(t===1){g.fillStyle=lin(0,0,0,h,['#0a0224','#1b0746','#050212']);g.fillRect(0,0,w,h);const cx=w/2,cy=h*.4,hy=h*.58;
  g.fillStyle=lin(0,cy-190,0,cy+190,['#ffe14d','#ff3d9a']);g.beginPath();g.arc(cx,cy,190,0,7);g.fill();g.fillStyle='#14063a';for(let j=0;j<6;j++)g.fillRect(cx-190,cy+20+j*30,380,4+j*3);
  g.fillStyle=lin(0,hy,0,h,['#1a0640','#08011c']);g.fillRect(0,hy,w,h-hy);g.shadowColor='#ff3df0';g.shadowBlur=10;g.strokeStyle='#ff3df0';g.lineWidth=2;
  for(let i=1;i<=14;i++){const y=hy+Math.pow(i/14,2)*(h-hy);g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}
  for(let k=-9;k<=9;k++){g.beginPath();g.moveTo(cx+k*24,hy);g.lineTo(cx+k*190,h);g.stroke()}g.shadowColor='#35f0ff';g.strokeStyle='#35f0ff';g.beginPath();g.moveTo(0,hy);g.lineTo(w,hy);g.stroke();g.shadowBlur=0}

function load(inp){
 const fl=inp.files&&inp.files[0];if(!fl)return;
 const u=URL.createObjectURL(fl),im=new Image();
 im.onload=()=>{
   // 巨大な写真をそのまま処理するとスマホのメモリを圧迫するため、切り抜き用は最大900pxに縮小。
   const k=Math.min(1,900/Math.max(im.naturalWidth||im.width,im.naturalHeight||im.height));
   const pc=document.createElement('canvas');
   pc.width=Math.max(1,Math.round(im.width*k));pc.height=Math.max(1,Math.round(im.height*k));
   const pg2=pc.getContext('2d',{willReadFrequently:true});
   pg2.drawImage(im,0,0,pc.width,pc.height);
   S.pho=pc;
   S.img=pc;
   const preview=new Image();preview.onload=()=>{
     S.ill=makeIll(preview);
     recut();draw();se('spark');URL.revokeObjectURL(u);
   };preview.src=pc.toDataURL('image/jpeg',.92);
 };
 im.onerror=()=>{URL.revokeObjectURL(u)};
 im.src=u;inp.value=''
}

 // iOS Safariは共有シートの「画像を保存」が最も確実。Android/PCはPNGダウンロードを優先。

   try{
     if(navigator.canShare&&navigator.canShare({files:[fl]})){
       await navigator.share({files:[fl],title:'Anime Card Studio'});
