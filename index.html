<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#eef1ff"><title>ぬりえスマイル｜高品質プロトタイプ</title><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><div class="brand">🌈 ぬりえスマイル</div><div><button class="pill" onclick="album()">💖 アルバム</button></div></header><main>
<section id="home"><div class="hero"><div id="floaters" class="home-floaters"></div><div style="position:relative;z-index:4;font-weight:950;letter-spacing:3px">COLORING STUDIO</div><h1>ぬりえスマイル</h1><div class="sub">かわいい×かっこいいオリジナル線画を、指一本で楽しく塗ろう</div><button class="start" onclick="categories()">🎨 ぬりえを始める</button><div class="features"><span class="feature">✨ 20カテゴリー</span><span class="feature">🖼️ 600作品データ</span><span class="feature">🎵 10 BGM</span><span class="feature">📷 写真→線画</span></div><div class="stats"><div class="stat"><b id="total">0</b>作品</div><div class="stat"><b>20</b>テーマ</div><div class="stat"><b>96</b>カラー</div></div></div>
<div class="studio"><b>🎵 サウンドスタジオ</b><div class="row" style="margin-top:8px"><select id="bgm"><option value="0">オルゴール</option><option value="1">楽しいマーチ</option><option value="2">リラックスピアノ</option><option value="3">冒険</option><option value="4">森の環境音風</option><option value="5">夢見る夜</option><option value="6">海のゆらぎ風</option><option value="7">カフェ</option><option value="8">星空</option><option value="9">ハッピー</option></select><label>音量 <input id="vol" type="range" min="0" max="1" step=".01" value=".4"></label><button id="mute" class="pill">🔊 BGM ON</button></div></div>
<div class="studio"><b>📷 写真→塗り絵線画</b><div class="row" style="margin-top:8px"><input id="photo" type="file" accept="image/*" capture="environment"><label>線の強さ <input id="threshold" type="range" min="20" max="150" value="60"></label></div><div class="note">端末内でエッジ検出・二値化します。写真はサーバーへ送信しません。</div></div></section>
<section id="categories" class="hidden"><div class="toolbar"><button class="back" onclick="home()">← ホーム</button><b>20カテゴリー</b></div><div id="catGrid" class="grid"></div></section>
<section id="items" class="hidden"><div class="toolbar"><button class="back" onclick="categories()">← カテゴリー</button><b id="catTitle"></b></div><div id="itemGrid" class="grid"></div></section>
<section id="editor" class="hidden"><div class="toolbar"><button class="back" onclick="items()">← 作品一覧</button><b id="title"></b><button class="back" onclick="reloadArt()">↻</button></div><div class="panel"><div id="stage"><canvas id="paint" width="800" height="800"></canvas><canvas id="line" width="800" height="800"></canvas></div><p class="note">指でドラッグして塗れます。Canvasは高DPIでも座標ズレが起きにくいよう内部800×800座標へ変換しています。マルチタッチは無視します。</p><div class="controls"><button class="action tool sel" data-tool="brush" onclick="tool('brush',this)">🖍️ 塗る</button><button class="action tool" data-tool="bucket" onclick="tool('bucket',this)">🪣 バケツ</button><button class="action tool" data-tool="eraser" onclick="tool('eraser',this)">🧽 消す</button><button class="action" onclick="size(10)">細</button><button class="action" onclick="size(20)">中</button><button class="action" onclick="size(34)">太</button></div><div class="controls"><button class="action" onclick="material='crayon';sfx('crayon')">クレヨン</button><button class="action" onclick="material='spray';sfx('spray')">スプレー</button><button class="action" onclick="material='brush';sfx('brush')">水彩筆</button><button class="action" onclick="material='pencil';sfx('pencil')">鉛筆</button></div><div id="palette" class="palette"></div><div class="controls"><button class="action" onclick="undo()">↶ 戻す</button><button class="action" onclick="clearPaint()">🗑 全消し</button><button class="action primary" onclick="saveArt()">💾 保存</button><button class="action" onclick="downloadArt()">📥 PNG</button></div></div></section>
<section id="album" class="hidden"><div class="toolbar"><button class="back" onclick="home()">← ホーム</button><b>💖 アルバム</b></div><div id="albumGrid" class="grid"></div></section>
</main><div id="toast" class="toast"></div>
<script>window.NURIE_DATA=[];</script>
