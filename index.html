<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff3f8">
<title>ぬりえスマイル＋</title>
<style>
:root{--pink:#ff6fa8;--purple:#8b72dc;--ink:#40364e;--paper:#fff9fc}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--paper);color:var(--ink)}
body{overscroll-behavior:none}.app{max-width:850px;margin:auto;padding:12px 14px 34px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 2px 12px}
.logo{font-weight:1000;font-size:21px}.logo b{color:#f05296}.pill,.btn{border:0;border-radius:15px;padding:10px 14px;font-weight:850;background:white;color:var(--ink);box-shadow:0 4px 14px #6d426b18}
.screen{display:none}.screen.active{display:block}
.hero{position:relative;overflow:hidden;text-align:center;border-radius:32px;padding:28px 18px 30px;min-height:570px;background:linear-gradient(145deg,#ffd3e7,#fff0bd 45%,#c8f3f4 75%,#dfd5ff);box-shadow:0 16px 40px #9b5c8c25}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 20%,#fff9 0 5px,transparent 7px),radial-gradient(circle at 88% 15%,#fff9 0 7px,transparent 9px),radial-gradient(circle at 80% 80%,#fff9 0 5px,transparent 7px);background-size:90px 90px}
.mascot{position:relative;width:210px;height:220px;margin:8px auto 12px;animation:bob 3s ease-in-out infinite}
.mascot svg{width:100%;height:100%;filter:drop-shadow(0 10px 8px #6e4b6730)}
.hero h1{position:relative;font-size:clamp(31px,8vw,44px);line-height:1.15;margin:4px 0 10px;font-weight:1000;letter-spacing:.03em}
.hero p{position:relative;font-weight:800;margin:0 0 20px}
.mainbtn{position:relative;border:0;border-radius:22px;padding:16px 30px;background:linear-gradient(110deg,#ff4e98,#ff9467,#9671ed);color:white;font-size:20px;font-weight:1000;box-shadow:0 10px 22px #d64d8c55;min-width:240px}
.subrow{position:relative;display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:13px}
.smallnote{position:relative;font-size:12px;font-weight:750;margin-top:18px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 2px 16px}
.heading{font-size:22px;font-weight:1000}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{border:0;border-radius:20px;padding:10px;background:white;color:var(--ink);font-weight:900;text-align:center;box-shadow:0 7px 20px #674d6818;min-width:0}
.thumb{height:130px;border-radius:15px;background:linear-gradient(140deg,#fff4f8,#eefaff);display:grid;place-items:center;overflow:hidden;margin-bottom:8px}
.thumb svg{width:100%;height:100%}.sub{font-size:12px;color:#8b7b91;font-weight:700}
.stagewrap{background:white;border-radius:22px;padding:8px;box-shadow:0 8px 25px #57435c1c}
.stage{width:100%;aspect-ratio:1;position:relative;touch-action:none;overflow:hidden;border-radius:14px;background:white}
.stage svg,.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.stage svg{z-index:2}.stage canvas{z-index:3}
.paintable{fill:white;stroke:#292532;stroke-width:7;stroke-linejoin:round;stroke-linecap:round;cursor:pointer}
.paintable:active{opacity:.9}
.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:9px;margin:14px 0}
.swatch{aspect-ratio:1;border-radius:50%;border:3px solid white;box-shadow:0 2px 7px #0002}.swatch.selected{outline:3px solid #45394d}
.tools{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.note{text-align:center;font-size:12px;color:#766b7d;line-height:1.6}
input[type=file]{display:none}.hidden{display:none!important}
#photoHint{padding:12px;background:#fff2f8;border-radius:14px;margin:10px 0;font-size:13px}
@keyframes bob{50%{transform:translateY(-10px) rotate(2deg)}}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero{min-height:610px}.thumb{height:155px}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">🌈 <b>ぬりえ</b>スマイル＋</div><button class="pill" onclick="home()">⌂ ホーム</button></header>
<section id="home" class="screen active">
<div class="hero">
<div class="mascot"><svg viewBox="0 0 220 220" aria-label="にっこりした鳥のマスコット">
<path d="M28 174 Q20 120 50 82 Q82 38 124 54 Q174 55 190 112 Q206 170 163 190 Q100 220 48 190Z" fill="#fff" stroke="#40364e" stroke-width="5"/>
<path d="M72 64 Q58 25 82 17 Q105 12 108 57" fill="#fff" stroke="#40364e" stroke-width="5"/>
<path d="M132 58 Q145 20 168 34 Q180 47 155 76" fill="#fff" stroke="#40364e" stroke-width="5"/>
<path d="M96 102 Q110 88 124 102 Q110 119 96 102" fill="#ffbd55" stroke="#40364e" stroke-width="4"/>
<circle cx="82" cy="112" r="7" fill="#40364e"/><circle cx="145" cy="112" r="7" fill="#40364e"/>
<path d="M100 137 Q115 151 130 137" fill="none" stroke="#40364e" stroke-width="4" stroke-linecap="round"/>
<path d="M40 145 Q14 137 18 159 Q30 176 51 165 M170 157 Q198 144 202 164 Q195 184 169 176" fill="#fff" stroke="#40364e" stroke-width="5"/>
<path d="M88 190 L80 207 M135 190 L143 207" stroke="#ffbd55" stroke-width="7" stroke-linecap="round"/>
<circle cx="63" cy="130" r="9" fill="#ffb5ca"/><circle cx="162" cy="130" r="9" fill="#ffb5ca"/>
</svg></div>
<h1>ぬりえスマイル</h1><p>すきな色で、じぶんだけの作品をつくろう！</p>
<button class="mainbtn" onclick="showCategories()">🎨 ぬりえをはじめる</button>
<div class="subrow"><button class="btn" onclick="document.getElementById('photoInput').click()">📷 写真からぬりえ</button><button class="btn" onclick="about()">✨ あそびかた</button><button class="btn" id="soundToggle" onclick="toggleSound()">♫ 音 ON</button></div>
<div class="smallnote">広告なし ・ 懸賞なし ・ オフラインでも遊べる</div>
</div></section>
<section id="cats" class="screen"><div class="sectionhead"><button class="btn" onclick="home()">← 戻る</button><div class="heading">カテゴリー</div><span class="sub">全15種類</span></div><div id="catgrid" class="grid"></div></section>
<section id="pics" class="screen"><div class="sectionhead"><button class="btn" onclick="showCategories()">← 戻る</button><div id="catname" class="heading"></div><span class="sub">20種類</span></div><div id="picgrid" class="grid"></div></section>
<section id="edit" class="screen">
<div class="sectionhead"><button class="btn" onclick="showPictures()">← 絵にもどる</button><div id="pictureTitle" class="heading">ぬりえ</div><button class="btn" onclick="clearPaint()">↻ リセット</button></div>
<div class="stagewrap"><div class="stage" id="stage"><svg id="art" viewBox="0 0 600 600" role="img"></svg><canvas id="photoCanvas" width="600" height="600" class="hidden"></canvas></div></div>
<div class="palette" id="palette"></div>
<div class="tools"><button class="btn" onclick="undo()">↶ もどす</button><button class="btn" onclick="document.getElementById('photoInput2').click()">📷 写真を選ぶ</button><button class="btn" onclick="saveImage()">⬇ 画像を保存</button><input id="photoInput2" type="file" accept="image/*"></div>
<p class="note">絵の中をタップ、または指でなぞると色がぬれるよ。写真ぬりえは指でなぞってね。</p>
<div id="photoHint" class="hidden">写真を線画に変換しました。太めの線で囲み、指でなぞって色をつけてね。</div>
</section>
<section id="about" class="screen"><div class="sectionhead"><button class="btn" onclick="home()">← 戻る</button><div class="heading">あそびかた</div></div><div class="hero" style="min-height:0"><div style="font-size:60px">🖍️</div><h2>かんたん3ステップ</h2><p>① カテゴリーを選ぶ<br>② 好きな絵を選ぶ<br>③ 色を選んで、絵をタップ！</p><p>写真から作るときは、写真を選んで線画に変換。指でなぞって色をぬれるよ。</p><button class="mainbtn" onclick="showCategories()">はじめる</button></div></section>
<input id="photoInput" type="file" accept="image/*">
</div>
<script>
const $=id=>document.getElementById(id);
let catIndex=0,picIndex=0,selectedColor='#ff5a9e',undoStack=[],soundOn=true,photoMode=false,painting=false,lastPoint=null;
const categories=[
['どうぶつ','いぬ','ねこ','うさぎ','くま','パンダ','きつね','ぞう','きりん','ライオン','とら','コアラ','ひつじ','うま','ぶた','りす','ハリネズミ','しか','ペンギン','ひよこ','レッサーパンダ'],
['海のいきもの','イルカ','くじら','かめ','たこ','さかな','クラゲ','アザラシ','ラッコ','エイ','タツノオトシゴ','サメ','カニ','エビ','ヒトデ','貝がら','チンアナゴ','マンボウ','シャチ','熱帯魚','イルカの親子'],
['とり','ことり','ふくろう','インコ','すずめ','はくちょう','フラミンゴ','ペンギン','ひよこ','にわとり','おしどり','つばめ','かもめ','きつつき','くじゃく','あひる','オウム','文鳥','カナリア','つる','ことりの家'],
['のりもの','くるま','バス','でんしゃ','しんかんせん','ひこうき','ヘリコプター','ふね','ロケット','しょうぼうしゃ','パトカー','きゅうきゅうしゃ','タクシー','トラック','じてんしゃ','バイク','トラクター','ヨット','潜水艦','気球','ケーブルカー'],
['たべもの','りんご','いちご','バナナ','ぶどう','すいか','みかん','もも','さくらんぼ','メロン','パイナップル','おにぎり','パン','カレー','オムライス','ピザ','ラーメン','おすし','サンドイッチ','ホットケーキ','とうもろこし'],
['花・しょくぶつ','ひまわり','チューリップ','バラ','さくら','たんぽぽ','あじさい','コスモス','ゆり','すずらん','クローバー','きのこ','サボテン','観葉植物','あさがお','すみれ','梅の花','もみじ','竹','どんぐり','花束'],
['うちゅう','おつきさま','たいよう','ほし','地球','土星','ロケット','宇宙飛行士','UFO','流れ星','月面探査車','宇宙ステーション','火星','天王星','銀河','星座','彗星','宇宙人','宇宙犬','宇宙船','惑星たち'],
['きょうりゅう','ティラノサウルス','トリケラトプス','ステゴサウルス','ブラキオサウルス','プテラノドン','アンキロサウルス','パラサウロロフス','ヴェロキラプトル','スピノサウルス','イグアノドン','ディプロドクス','パキケファロサウルス','始祖鳥','恐竜の卵','赤ちゃん恐竜','恐竜の足あと','火山と恐竜','恐竜の親子','海の恐竜','恐竜の楽園'],
['ゆめのせかい','ユニコーン','ドラゴン','おしろ','まほうのつえ','まほう使い','妖精','人魚','ペガサス','空飛ぶ島','虹の橋','星の馬車','月のうさぎ','森の小人','宝箱','ふしぎなランプ','大きな木','雲のおうち','魔法の本','夢の気球','星の王さま'],
['かわいいなかま','おしゃれねこ','くまのきょうだい','うさぎのおでかけ','ひよこのお昼寝','パンダのピクニック','きつねの郵便屋','かえるの王子','ハムスター','こあらの親子','ねこのケーキ屋','うさぎの音楽会','くまの風船','ことりの歌','わんこの散歩','ペンギンの行進','りすのどんぐり','ふくろう先生','たぬき','カワウソ','なかよしトリオ'],
['こんちゅう','ちょうちょ','てんとうむし','みつばち','かぶとむし','くわがた','とんぼ','せみ','バッタ','カマキリ','ホタル','だんごむし','アリ','カタツムリ','クモ','ミノムシ','ハチの巣','ちょうの花畑','昆虫のおうち','幼虫','虫めがね'],
['きせつ・イベント','サンタクロース','ゆきだるま','クリスマスツリー','かぼちゃ','おばけ','こいのぼり','ひな人形','花火','かどまつ','お月見','桜まつり','ハロウィンのお城','プレゼント','雪の結晶','てるてる坊主','七夕かざり','母の日の花','バレンタイン','紅葉','夏祭り'],
['おしごと','おいしゃさん','しょうぼうし','けいさつかん','パイロット','パンやさん','お花屋さん','先生','料理人','大工さん','美容師','郵便屋さん','農家さん','宇宙飛行士','獣医さん','駅員さん','カメラマン','消防車と隊員','研究者','音楽家','スポーツ選手'],
['スポーツ','サッカー','やきゅう','バスケットボール','テニス','バレーボール','水泳','スケートボード','バドミントン','卓球','ラグビー','ゴルフ','体操','スキー','スノーボード','ボクシング','マラソン','柔道','ダンス','乗馬','ボウリング'],
['おかし','プリン','キャンディ','クッキー','マカロン','カップケーキ','ドーナツ','ショートケーキ','アイスクリーム','チョコレート','たい焼き','わたあめ','パフェ','ホットケーキ','ビスケット','ロールケーキ','シュークリーム','ゼリー','グミ','ワッフル','お菓子の家']
];
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0)}
function home(){showScreen('home')}
function about(){showScreen('about')}
function showCategories(){showScreen('cats');$('catgrid').innerHTML=categories.map((c,i)=>`<button class="card" onclick="chooseCat(${i})"><div class="thumb">${drawSVG(c[1],i,0)}</div>${c[0]}<div class="sub">20種類のぬりえ</div></button>`).join('')}
function chooseCat(i){catIndex=i;$('catname').textContent=categories[i][0];showPictures()}
function showPictures(){showScreen('pics');$('picgrid').innerHTML=categories[catIndex].slice(1).map((name,i)=>`<button class="card" onclick="openPicture(${i})"><div class="thumb">${drawSVG(name,catIndex,i)}</div>${name}</button>`).join('')}
function openPicture(i){picIndex=i;photoMode=false;$('pictureTitle').textContent=categories[catIndex][i+1];$('photoHint').classList.add('hidden');$('photoCanvas').classList.add('hidden');$('art').classList.remove('hidden');$('art').innerHTML=drawSVG(categories[catIndex][i+1],catIndex,i,true);showScreen('edit');undoStack=[];beep(660)}
function shape(tag,attrs=''){return `<${tag} class="paintable" ${attrs}/>`}
function drawSVG(label,ci,ix,full=false){
let a=[],n=ix%5,shift=(ix%3)*12;
const path=(d)=>a.push(shape('path',`d="${d}"`));
const circle=(cx,cy,r)=>a.push(shape('circle',`cx="${cx}" cy="${cy}" r="${r}"`));
const ellipse=(cx,cy,rx,ry)=>a.push(shape('ellipse',`cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"`));
const rect=(x,y,w,h,rx=20)=>a.push(shape('rect',`x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"`));
const line=(x1,y1,x2,y2)=>a.push(`<path d="M${x1} ${y1}L${x2} ${y2}" fill="none" stroke="#292532" stroke-width="7" stroke-linecap="round"/>`);
if(ci===0||ci===8){ // friendly character faces
circle(300,315,155);circle(190,205,48);circle(410,205,48);
if(n===1){ellipse(240,130,32,95);ellipse(360,130,32,95)}
if(n===2){path('M170 230 L185 135 L255 205 L345 205 L415 135 L430 230')}
if(n===3){path('M185 220 Q140 270 165 345 Q125 380 165 420');path('M415 220 Q460 270 435 345 Q475 380 435 420')}
circle(250,300,13);circle(350,300,13);path('M265 365 Q300 395 335 365');
ellipse(300,455,100,40);
}else if(ci===1){ // sea creatures
ellipse(300,320,170,105);path('M430 320 L520 250 L520 390 Z');circle(230,300,12);path('M270 365 Q320 390 360 355');
for(let k=0;k<3;k++)circle(175+k*45,180,18);
}else if(ci===2){ // birds
ellipse(300,315,125,145);circle(220,190,52);circle(380,190,52);path('M275 265 L325 265 L300 310 Z');circle(265,340,12);circle(335,340,12);path('M280 390 Q300 410 320 390');path('M250 450 L230 490 M350 450 L370 490');
}else if(ci===3){ // vehicles
rect(110,285,380,150,38);path('M180 285 L230 205 L370 205 L430 285 Z');circle(205,445,42);circle(395,445,42);rect(245,225,110,55,10);line(300,225,300,280);
}else if(ci===4||ci===13){ // food and sweets
if(n%2===0){path('M150 360 Q160 190 300 170 Q440 190 450 360 Q420 455 300 460 Q180 455 150 360 Z');}
else{path('M150 390 L450 390 L410 465 L190 465 Z');ellipse(300,390,150,70);circle(250,280,35);circle(350,270,35);}
for(let k=0;k<4;k++)circle(220+k*52,340+(k%2)*35,10);
}else if(ci===5){ // plants
path('M300 475 Q285 370 300 260');ellipse(235,350,80,35);ellipse(365,310,80,35);circle(300,190,70);
for(let k=0;k<6;k++){let ang=k*Math.PI/3,cx=300+Math.cos(ang)*105,cy=190+Math.sin(ang)*105;circle(cx,cy,48)}
}else if(ci===6){ // space
circle(300,300,110);circle(300,300,45);ellipse(300,300,210,70);circle(120,140,20);circle(470,170,26);path('M440 390 L460 350 L480 390 L520 400 L480 420 L460 460 L440 420 L400 400 Z');
}else if(ci===7){ // dinosaurs
path('M130 390 Q115 280 220 250 Q310 160 400 250 Q465 300 440 390 L490 430 L420 440 L380 410 L260 430 L220 490 L180 490 L195 415 Z');
circle(375,270,13);path('M170 300 L110 245 L155 350');for(let k=0;k<3;k++)path(`M${260+k*42} 210 l20 -55 l20 55`);
}else if(ci===9){ // bugs
ellipse(300,320,70,130);circle(300,190,65);circle(280,180,8);circle(320,180,8);ellipse(205,290,85,55);ellipse(395,290,85,55);
for(let k=0;k<3;k++){line(240,340+k*30,150,390+k*30);line(360,340+k*30,450,390+k*30)}
}else if(ci===10){ // events
path('M150 430 L150 250 L300 130 L450 250 L450 430 Z');rect(245,320,110,110,8);circle(230,270,25);circle(370,270,25);path('M300 130 L300 70');
}else if(ci===11){ // people / professions
circle(300,180,85);path('M220 270 Q300 220 380 270 L440 470 L160 470 Z');circle(270,175,10);circle(330,175,10);path('M275 220 Q300 240 325 220');rect(250,300,100,80,12);
}else if(ci===12){ // sports
circle(300,300,150);for(let k=0;k<5;k++){let ang=k*Math.PI*2/5;line(300,300,300+140*Math.cos(ang),300+140*Math.sin(ang))}circle(300,300,45);
}
if(!a.length){circle(300,300,150);path('M220 300 Q300 200 380 300 Q300 400 220 300')}
return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" aria-label="${label}">${a.join('')}</svg>`;
}
const colors=['#ff5a9e','#ff7373','#ff9f43','#ffd93d','#9bdc54','#35c98b','#54c7ec','#4d8bf5','#9272e8','#c17bd1','#a87955','#55515c','#ffffff','#ffb8cf','#b9e6ff','#c8b5ff'];
$('palette').innerHTML=colors.map((c,i)=>`<button class="swatch ${i===0?'selected':''}" style="background:${c}" aria-label="${c}" onclick="setColor('${c}',this)"></button>`).join('');
function setColor(c,el){selectedColor=c;document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');beep(520)}
function beep(freq=600){if(!soundOn)return;try{let ac=beep.ac||(beep.ac=new(window.AudioContext||window.webkitAudioContext)());let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freq;g.gain.value=.045;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.12);o.stop(ac.currentTime+.13)}catch(e){}}
function toggleSound(){soundOn=!soundOn;$('soundToggle').textContent=soundOn?'♫ 音 ON':'♫ 音 OFF';if(soundOn)beep(740)}
function saveUndo(){if(photoMode){let c=$('photoCanvas'),x=c.getContext('2d');undoStack.push(x.getImageData(0,0,600,600));if(undoStack.length>20)undoStack.shift()}else{undoStack.push($('art').innerHTML);if(undoStack.length>30)undoStack.shift()}}
function undo(){if(!undoStack.length)return;if(photoMode){$('photoCanvas').getContext('2d').putImageData(undoStack.pop(),0,0)}else{$('art').innerHTML=undoStack.pop()}beep(420)}
function clearPaint(){if(photoMode){$('photoCanvas').getContext('2d').clearRect(0,0,600,600)}else $('art').querySelectorAll('.paintable').forEach(x=>x.setAttribute('fill','white'));undoStack=[]}
$('art').addEventListener('pointerdown',e=>{let t=e.target.closest('.paintable');if(!t)return;e.preventDefault();saveUndo();t.setAttribute('fill',selectedColor);beep(620)});
$('art').addEventListener('pointermove',e=>{if(e.buttons===0)return;let t=e.target.closest('.paintable');if(t&&t.getAttribute('fill')!==selectedColor)t.setAttribute('fill',selectedColor)});
const canvas=$('photoCanvas'),cx=canvas.getContext('2d');
function canvasPoint(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*600/r.width,y:(e.clientY-r.top)*600/r.height}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();saveUndo();painting=true;lastPoint=canvasPoint(e);cx.beginPath();cx.moveTo(lastPoint.x,lastPoint.y);cx.strokeStyle=selectedColor;cx.lineWidth=30;cx.lineCap='round';cx.lineJoin='round';cx.lineTo(lastPoint.x+.1,lastPoint.y+.1);cx.stroke();canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!painting)return;e.preventDefault();let p=canvasPoint(e);cx.beginPath();cx.moveTo(lastPoint.x,lastPoint.y);cx.lineTo(p.x,p.y);cx.strokeStyle=selectedColor;cx.lineWidth=30;cx.lineCap='round';cx.lineJoin='round';cx.stroke();lastPoint=p});
canvas.addEventListener('pointerup',()=>painting=false);canvas.addEventListener('pointercancel',()=>painting=false);
function imageToLine(file){if(!file)return;let url=URL.createObjectURL(file),im=new Image();im.onload=()=>{let temp=document.createElement('canvas');temp.width=temp.height=600;let t=temp.getContext('2d');t.fillStyle='white';t.fillRect(0,0,600,600);let s=Math.min(540/im.width,540/im.height),w=im.width*s,h=im.height*s;t.drawImage(im,(600-w)/2,(600-h)/2,w,h);let src=t.getImageData(0,0,600,600),gray=new Uint8Array(360000);for(let i=0;i<360000;i++){let k=i*4;gray[i]=.299*src.data[k]+.587*src.data[k+1]+.114*src.data[k+2]}let out=t.createImageData(600,600);for(let y=1;y<599;y++)for(let x=1;x<599;x++){let k=y*600+x,edge=Math.abs(gray[k-1]-gray[k+1])+Math.abs(gray[k-600]-gray[k+600])+Math.abs(gray[k-601]-gray[k+601]);let v=edge>48?25:255;let q=k*4;out.data[q]=out.data[q+1]=out.data[q+2]=v;out.data[q+3]=255}t.putImageData(out,0,0);$('art').innerHTML=`<image href="${temp.toDataURL('image/png')}" width="600" height="600"/>`;photoMode=true;$('art').classList.remove('hidden');canvas.classList.remove('hidden');cx.clearRect(0,0,600,600);$('photoHint').classList.remove('hidden');$('pictureTitle').textContent='写真ぬりえ';undoStack=[];showScreen('edit');URL.revokeObjectURL(url)};im.onerror=()=>alert('この写真を読み込めませんでした。別の写真を選んでください。');im.src=url}
$('photoInput').addEventListener('change',e=>{imageToLine(e.target.files[0]);e.target.value=''});
$('photoInput2').addEventListener('change',e=>{imageToLine(e.target.files[0]);e.target.value=''});
function showPhotoStart(){ $('photoInput').click() }
function saveImage(){let svg=$('art').cloneNode(true);if(photoMode){let img=svg.querySelector('image');if(img){let c=document.createElement('canvas');c.width=c.height=600;let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,600,600);let src=img.getAttribute('href');let im=new Image();im.onload=()=>{ctx.drawImage(im,0,0,600,600);ctx.drawImage(canvas,0,0);downloadCanvas(c)};im.src=src;return}}let xml=new XMLSerializer().serializeToString(svg),blob=new Blob([xml],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=c.height=600;c.getContext('2d').drawImage(im,0,0);URL.revokeObjectURL(url);downloadCanvas(c)};im.src=url}
function downloadCanvas(c){let a=document.createElement('a');a.download='nurie-smile.png';a.href=c.toDataURL('image/png');a.click()}
</script>
</body></html>
