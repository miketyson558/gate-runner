<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ff75b5"><title>ぬりえスマイル</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;background:linear-gradient(135deg,#fff0f8,#f3efff 50%,#e9fbff);color:#352b49}button{font:inherit;border:0;cursor:pointer}#app{min-height:100vh;overflow:hidden}.screen{display:none;min-height:100vh;padding:18px 16px 28px}.screen.active{display:block}.home{background:radial-gradient(circle at 15% 15%,#fff 0 8%,transparent 9%),linear-gradient(135deg,#ff77b7,#9c7be9 50%,#53cce9);color:white;position:relative}.home:before,.home:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.16);animation:float 5s ease-in-out infinite}.home:before{width:180px;height:180px;right:-60px;top:100px}.home:after{width:120px;height:120px;left:-45px;bottom:120px;animation-delay:1.5s}@keyframes float{50%{transform:translateY(-18px) rotate(8deg)}}.top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}.logo{font-weight:900;font-size:25px;text-shadow:0 3px 10px #a23b78}.sound{background:rgba(255,255,255,.22);color:white;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:10px 13px}.hero{position:relative;z-index:2;text-align:center;padding:36px 8px 14px}.hero h1{font-size:42px;margin:0 0 8px;letter-spacing:.04em}.hero p{margin:0 0 22px;font-weight:700}.start{padding:16px 34px;border-radius:999px;background:linear-gradient(90deg,#ff4d98,#ff8b5c,#ffd34c);color:white;font-size:20px;font-weight:900;box-shadow:0 12px 28px rgba(89,35,103,.28)}.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}.badge{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:7px 11px;font-size:13px;font-weight:800}.mascots{height:230px;position:relative;z-index:2;margin:10px auto 0;max-width:520px}.mascot{position:absolute;font-size:74px;filter:drop-shadow(0 8px 8px rgba(80,20,80,.18));animation:bob 2.7s ease-in-out infinite}.m1{left:3%;top:55px}.m2{left:31%;top:5px;animation-delay:.4s}.m3{right:28%;top:70px;animation-delay:.8s}.m4{right:2%;top:22px;animation-delay:1.2s}@keyframes bob{50%{transform:translateY(-16px) rotate(-4deg)}}.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.back{background:#fff;color:#6d4c91;border-radius:12px;padding:9px 13px;box-shadow:0 5px 15px #cabbd8}.title{font-size:24px;font-weight:900}.category-grid,.design-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.cat{background:white;border-radius:20px;padding:17px 12px;text-align:center;box-shadow:0 8px 20px rgba(85,52,108,.12);min-height:120px}.cat .ico{font-size:48px}.cat b{display:block;margin-top:7px}.cat small{color:#8c8198}.design{background:#fff;border-radius:18px;padding:8px;box-shadow:0 7px 18px rgba(85,52,108,.11)}.thumb{width:100%;aspect-ratio:1;border-radius:13px;background:#fff9fb;display:block}.design b{display:block;padding:8px 4px 5px;font-size:14px}.editor{background:#f5f2f8}.work{max-width:720px;margin:auto}.canvasbox{background:white;border-radius:22px;padding:8px;box-shadow:0 10px 30px rgba(75,54,92,.15);touch-action:none}.canvasbox canvas{display:block;width:100%;height:auto;border-radius:15px;background:white;touch-action:none}.tools{display:flex;gap:8px;overflow-x:auto;padding:13px 0}.tool{flex:0 0 auto;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 4px 12px #d7cddd}.tool.active{outline:3px solid #ff76b7}.colors{display:flex;gap:8px;flex-wrap:wrap;background:white;border-radius:18px;padding:12px}.sw{width:38px;height:38px;border-radius:50%;border:3px solid white;box-shadow:0 1px 5px #aaa}.sw.sel{outline:3px solid #4d3d61}.hint{text-align:center;color:#75687f;font-size:13px;margin:10px 0}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#30243c;color:#fff;padding:11px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:99}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(min-width:650px){.category-grid{grid-template-columns:repeat(3,1fr)}.design-grid{grid-template-columns:repeat(4,1fr)}.screen{padding-left:5%;padding-right:5%}}
</style></head><body><main id="app"><section id="home" class="screen home active"><div class="top"><div class="logo">🌈 ぬりえスマイル</div><button id="musicBtn" class="sound">🎵 BGM ON</button></div><div class="hero"><h1>ぬって、あそんで、にっこり！</h1><p>広告なし・懸賞なしのオリジナルぬりえアプリ</p><button id="startBtn" class="start">🎨 ぬりえをはじめる</button><div class="badges"><span class="badge">🎵 BGM</span><span class="badge">🔔 効果音</span><span class="badge">👆 タップ＆ドラッグ</span><span class="badge">📱 iPhone / Android</span></div></div><div class="mascots"><div class="mascot m1">🐰</div><div class="mascot m2">🐥</div><div class="mascot m3">🐱</div><div class="mascot m4">🐼</div></div></section>
<section id="cats" class="screen"><div class="bar"><button class="back" onclick="go('home')">← ホーム</button><div class="title">カテゴリー</div><div></div></div><div id="catGrid" class="category-grid"></div></section>
<section id="designs" class="screen"><div class="bar"><button class="back" onclick="go('cats')">← 戻る</button><div id="designTitle" class="title">ぬりえ</div><div></div></div><div id="designGrid" class="design-grid"></div></section>
<section id="editor" class="screen editor"><div class="work"><div class="bar"><button class="back" onclick="go('designs')">← 作品一覧</button><div class="title">ぬりえ中</div><button class="back" onclick="savePNG()">保存</button></div><div class="canvasbox"><canvas id="cv" width="900" height="900"></canvas></div><div class="tools"><button class="tool active" id="brushBtn" onclick="setTool('brush')">🖌️ ぬる</button><button class="tool" id="fillBtn" onclick="setTool('fill')">🪣 つぶす</button><button class="tool" onclick="setTool('erase')">🧽 消す</button><button class="tool" onclick="undo()">↩️ 戻す</button><button class="tool" onclick="clearColor()">🗑️ 色を消す</button></div><div id="colors" class="colors"></div><p class="hint">タップで塗る・指を動かして連続で塗る。色を選んで好きなところを塗ってみよう！</p></div></section></main><div id="toast" class="toast"></div>
<script>
'use strict';
const cats=[['どうぶつ','🐾','animals'],['ゆめ・まほう','✨','fantasy'],['たべもの','🍰','food'],['しぜん','🌼','nature'],['のりもの','🚗','vehicles'],['かわいい','💖','cute']];
const names={animals:['うさぎ','ねこ','いぬ','くま','きつね','ひよこ','ペンギン','パンダ','ライオン','ぞう','キリン','コアラ','ハリネズミ','リス','カメ','イルカ','くじら','ふくろう','さる','とら'],fantasy:['おほしさま','おつきさま','ユニコーン','ドラゴン','おしろ','まほうの杖','妖精','虹の国','星の森','月のうさぎ','魔法猫','雲のお城','流れ星','宝箱','人魚','天使','ペガサス','妖精の家','夢の気球','星の王子'],food:['ケーキ','プリン','ドーナツ','アイス','パンケーキ','クッキー','りんご','いちご','すいか','さくらんぼ','おにぎり','おすし','ラーメン','ピザ','ハンバーガー','パフェ','マカロン','たい焼き','ホットケーキ','フルーツ皿'],nature:['花畑','ひまわり','チューリップ','桜','虹','山','海','森','きのこ','葉っぱ','太陽','月と星','雲','雨','雪だるま','蝶々','てんとう虫','木','四つ葉','ガーデン'],vehicles:['くるま','バス','でんしゃ','新幹線','ひこうき','ロケット','ヘリコプター','船','ヨット','自転車','バイク','トラック','消防車','パトカー','救急車','気球','宇宙船','潜水艦','トラクター','観覧車'],cute:['くまちゃん','うさちゃん','ねこちゃん','ひよこちゃん','パンダちゃん','おばけちゃん','お星さまちゃん','ハートちゃん','お花ちゃん','虹ちゃん','キャンディちゃん','リボンちゃん','ペンギンちゃん','コアラちゃん','キノコちゃん','ドーナツちゃん','お月さまちゃん','雲ちゃん','雪だるまちゃん','にこにこちゃん']};
const colors=['#ff5b7f','#ff8a4c','#ffd447','#72d66f','#4ecdc4','#55a7ff','#8f7cff','#d56cff','#ff72b6','#8b6b4a','#5c6570','#ffffff'];
let currentCat=null,currentIndex=0,tool='brush',color=colors[0],audio=null,music=true,history=[];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='cats')renderCats();if(id==='designs')renderDesigns();if(id==='home')startMusic()}
function renderCats(){catGrid.innerHTML=cats.map((c,i)=>`<button class="cat" onclick="openCat(${i})"><div class="ico">${c[1]}</div><b>${c[0]}</b><small>20種類</small></button>`).join('')}
function openCat(i){currentCat=i;designTitle.textContent=cats[i][0];go('designs')}
function renderDesigns(){const arr=names[cats[currentCat][2]];designGrid.innerHTML=arr.map((n,i)=>{let c=document.createElement('canvas');c.width=180;c.height=180;c.className='thumb';drawArt(c.getContext('2d'),currentCat,i,180);let div=document.createElement('button');div.className='design';div.innerHTML=`<canvas class="thumb" width="180" height="180"></canvas><b>${i+1}. ${n}</b>`;div.onclick=()=>openArt(currentCat,i);div.querySelector('canvas').getContext('2d').drawImage(c,0,0);return div}).join('')}
function openArt(cat,idx){currentCat=cat;currentIndex=idx;history=[];drawArt(ctx,cat,idx,900);go('editor');sfx('start')}
function line(c,x1,y1,x2,y2,w=10){c.lineWidth=w;c.lineCap='round';c.lineJoin='round';c.strokeStyle='#342d3d';c.stroke();}
function poly(c,pts,fill=false){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);pts.slice(1).forEach(p=>c.lineTo(p[0],p[1]));c.closePath();c.fillStyle='#fff';c.fill();c.strokeStyle='#342d3d';c.lineWidth=10;c.stroke()}
function circle(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fillStyle='#fff';c.fill();c.strokeStyle='#342d3d';c.lineWidth=10;c.stroke()}
function drawArt(c,cat,v,S){c.clearRect(0,0,S,S);c.fillStyle='#fff';c.fillRect(0,0,S,S);c.save();let q=S/900;c.scale(q,q);c.lineWidth=10;c.strokeStyle='#342d3d';c.fillStyle='#fff';const variant=v;
// consistent original line-art families with varied details
if(cat===0||cat===5){circle(c,450,460,250);circle(c,360,400,28);circle(c,540,400,28);c.beginPath();c.arc(450,470,85,0.15,Math.PI-0.15);c.stroke();circle(c,300,260,95);circle(c,600,260,95);if(variant%3===0){circle(c,450,650,90)}else{poly(c,[[400,600],[500,600],[540,760],[360,760]])}for(let k=0;k<3;k++)circle(c,250+k*200,720,35);if(variant%4===0){circle(c,450,470,10)} }
else if(cat===1){circle(c,450,450,230);poly(c,[[270,310],[450,140],[630,310]]);circle(c,390,430,22);circle(c,510,430,22);c.beginPath();c.arc(450,475,70,0,Math.PI);c.stroke();for(let k=0;k<5;k++){let a=k*Math.PI*2/5;line(c,450+Math.cos(a)*300,450+Math.sin(a)*300,450+Math.cos(a)*360,450+Math.sin(a)*360,9)}circle(c,450,450,90)}
else if(cat===2){circle(c,450,470,230);poly(c,[[250,500],[650,500],[610,700],[290,700]]);for(let k=0;k<4;k++)circle(c,330+k*80,430,35);circle(c,450,250,65);}
else if(cat===3){circle(c,450,430,130);for(let k=0;k<8;k++){let a=k*Math.PI/4;circle(c,450+Math.cos(a)*180,430+Math.sin(a)*180,70)}line(c,450,560,450,800,14);poly(c,[[450,680],[320,800],[450,760],[580,800]])}
else {if(variant%2===0){poly(c,[[170,520],[700,520],[650,680],[220,680]]);circle(c,270,690,55);circle(c,610,690,55);poly(c,[[260,520],[330,370],[520,370],[610,520]]);circle(c,390,440,22);circle(c,510,440,22)}else{poly(c,[[200,560],[680,560],[760,640],[150,640]]);circle(c,300,670,48);circle(c,600,670,48);line(c,380,560,420,420,12);line(c,420,420,520,560,12);circle(c,420,420,35)}}
// decorative partition lines create multiple colorable regions
for(let k=0;k<4;k++){let x=180+k*180;line(c,x,170,x+70,280,7)}c.restore()}
function renderColors(){colors.forEach((x,i)=>{let b=document.createElement('button');b.className='sw'+(i===0?' sel':'');b.style.background=x;b.onclick=()=>{color=x;document.querySelectorAll('.sw').forEach(y=>y.classList.remove('sel'));b.classList.add('sel');setTool('brush')};document.getElementById('colors').appendChild(b)})}renderColors();
function pos(e){let r=cv.getBoundingClientRect();return{x:Math.floor((e.clientX-r.left)*cv.width/r.width),y:Math.floor((e.clientY-r.top)*cv.height/r.height)}}
let down=false;cv.addEventListener('pointerdown',e=>{e.preventDefault();down=true;cv.setPointerCapture(e.pointerId);history.push(ctx.getImageData(0,0,cv.width,cv.height));paint(pos(e))});cv.addEventListener('pointermove',e=>{if(down&&tool==='brush')paint(pos(e))});cv.addEventListener('pointerup',()=>down=false);cv.addEventListener('pointercancel',()=>down=false);
function paint(p){if(tool==='fill'){bucket(p.x,p.y);sfx('fill');return}ctx.save();ctx.globalCompositeOperation=tool==='erase'?'destination-out':'source-over';ctx.fillStyle=color;ctx.beginPath();ctx.arc(p.x,p.y,tool==='erase'?30:24,0,Math.PI*2);ctx.fill();ctx.restore();sfx('tap')}
function bucket(x,y){const im=ctx.getImageData(0,0,cv.width,cv.height),d=im.data,w=cv.width,h=cv.height,i=(y*w+x)*4,target=[d[i],d[i+1],d[i+2],d[i+3]];if(target[3]===0)return;const rgb=hex(color),tol=34,seen=new Uint8Array(w*h),st=[[x,y]];const match=(p)=>Math.abs(d[p]-target[0])+Math.abs(d[p+1]-target[1])+Math.abs(d[p+2]-target[2])<tol*3&&Math.abs(d[p+3]-target[3])<tol*3;while(st.length){const [cx,cy]=st.pop();if(cx<0||cy<0||cx>=w||cy>=h)continue;const n=cy*w+cx;if(seen[n])continue;const p=n*4;if(!match(p))continue;seen[n]=1;d[p]=rgb[0];d[p+1]=rgb[1];d[p+2]=rgb[2];d[p+3]=255;st.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1])}ctx.putImageData(im,0,0)}
function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function setTool(t){tool=t;document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));if(t==='brush')brushBtn.classList.add('active');if(t==='fill')fillBtn.classList.add('active');sfx('touch')}
function undo(){let a=history.pop();if(a)ctx.putImageData(a,0,0);sfx('undo')}
function clearColor(){drawArt(ctx,currentCat,currentIndex,900);history=[];sfx('erase')}
function savePNG(){let a=document.createElement('a');a.download='ぬりえスマイル.png';a.href=cv.toDataURL('image/png');a.click();sfx('ok');toast('画像を保存しました！')}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function ac(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();if(music)startMusic()}
let musicTimer=null;function startMusic(){if(!music)return;ac0();if(musicTimer)return;let seq=[261.6,329.6,392,329.6,293.7,349.2,440,349.2],i=0;musicTimer=setInterval(()=>{if(!music)return;const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=seq[i++%seq.length];g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.035,audio.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.45);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.48)},520)}function ac0(){if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}
function sfx(kind){try{ac0();const o=audio.createOscillator(),g=audio.createGain();const f={tap:520,fill:660,touch:420,erase:250,undo:330,start:740,ok:880}[kind]||500;o.frequency.value=f;o.type=kind==='erase'?'sawtooth':'sine';g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.08,audio.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.12);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.13)}catch(e){}}
musicBtn.onclick=()=>{music=!music;musicBtn.textContent=music?'🎵 BGM ON':'🔇 BGM OFF';if(music)startMusic();else{clearInterval(musicTimer);musicTimer=null}ac0()};startBtn.onclick=()=>{ac0();sfx('start');go('cats')};document.addEventListener('pointerdown',()=>ac0(),{once:true});
</script></body></html>
