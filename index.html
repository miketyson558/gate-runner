<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#fff8fc;color:#303044}body{overflow-x:hidden}.app{max-width:760px;margin:auto;min-height:100vh;padding:14px 14px 30px}.top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:5}.logo{font-weight:900;font-size:21px;letter-spacing:.02em}.logo b{color:#ff5c9a}.homebtn{border:0;background:#fff;border-radius:14px;padding:9px 12px;font-weight:800;box-shadow:0 5px 16px #7a4c7717}.screen{display:none}.screen.active{display:block}.hero{position:relative;min-height:590px;margin-top:10px;border-radius:34px;overflow:hidden;background:linear-gradient(145deg,#ffd7ea 0%,#ffe9c7 45%,#dff7ff 100%);box-shadow:0 18px 45px #a94d7b22;padding:32px 18px;text-align:center}.blob{position:absolute;border-radius:50%;filter:blur(1px);opacity:.7;animation:float 5s ease-in-out infinite}.b1{width:130px;height:130px;background:#fff;left:-35px;top:75px}.b2{width:100px;height:100px;background:#fff6a8;right:-20px;top:180px;animation-delay:-2s}.b3{width:85px;height:85px;background:#bdefff;left:20px;bottom:60px;animation-delay:-3s}.spark{position:absolute;font-size:24px;animation:twinkle 2s ease-in-out infinite}.s1{left:16%;top:18%}.s2{right:16%;top:10%;animation-delay:.7s}.s3{right:12%;bottom:22%;animation-delay:1.1s}.mascot{position:relative;margin:20px auto 6px;width:210px;height:190px;animation:bob 3s ease-in-out infinite}.cloud{position:absolute;left:0;right:0;bottom:18px;height:70px;background:#fff;border-radius:50px;box-shadow:0 10px 20px #a96b8920}.animal{position:absolute;left:50%;top:5px;transform:translateX(-50%);font-size:130px;line-height:1;filter:drop-shadow(0 9px 8px #6c496322)}.heart{position:absolute;right:12px;top:18px;font-size:35px;animation:heart 1.5s ease-in-out infinite}.hero h1{position:relative;margin:2px 0 8px;font-size:39px;line-height:1.05;color:#3a3150;text-shadow:0 3px 0 #fff}.hero p{position:relative;margin:0 auto 18px;font-weight:800;color:#5d5670}.mainbtn{position:relative;border:0;border-radius:22px;padding:16px 32px;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(135deg,#ff5a9e,#ff8a65);box-shadow:0 10px 20px #e75a8a42;animation:pulse 2.2s ease-in-out infinite;min-width:230px}.mainbtn:active{transform:scale(.97)}.subrow{position:relative;display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:12px}.subbtn{border:0;border-radius:16px;padding:11px 14px;background:#ffffffdc;font-weight:800;box-shadow:0 6px 14px #8b5b7217}.hint{position:relative;font-size:12px;margin-top:16px;color:#6f6678}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 14px}.back{border:0;border-radius:14px;background:#fff;padding:10px 13px;font-weight:800;box-shadow:0 5px 14px #7a4c7714}.title{font-weight:900;font-size:22px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{border:0;border-radius:22px;background:#fff;padding:10px;box-shadow:0 8px 22px #7a4c7714;font-weight:900;color:#373044;transition:transform .15s}.card:active{transform:scale(.97)}.pic{height:125px;border-radius:17px;background:linear-gradient(135deg,#fff1f7,#eefaff);display:grid;place-items:center;margin-bottom:9px}.pic svg{width:100%;height:100%}.stage{position:relative;width:min(92vw,620px);margin:0 auto;aspect-ratio:1;border-radius:22px;background:#fff;overflow:hidden;box-shadow:0 10px 28px #6d52631f}.stage canvas,.stage svg{position:absolute;inset:0;width:100%;height:100%}.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:12px 0}.sw{aspect-ratio:1;border:3px solid #fff;border-radius:50%;box-shadow:0 2px 6px #0002}.sw.sel{outline:3px solid #333}.tools{text-align:center}.tools button{margin:3px}.note{text-align:center;font-size:13px;color:#6e6674}.hidden{display:none!important}input[type=file]{display:none}@keyframes float{50%{transform:translateY(-14px) rotate(5deg)}}@keyframes bob{50%{transform:translateY(-9px)}}@keyframes twinkle{50%{transform:scale(1.35) rotate(12deg);opacity:.45}}@keyframes pulse{50%{box-shadow:0 14px 28px #e75a8a55}}@keyframes heart{50%{transform:scale(1.2)}}

/* v4 visual polish */
.hero{background:radial-gradient(circle at 15% 12%,#fff9 0 5%,transparent 5.5%),radial-gradient(circle at 85% 25%,#fff8 0 7%,transparent 7.5%),linear-gradient(135deg,#ffb7d5 0%,#ffc88e 22%,#fff19a 42%,#a9f0df 64%,#9fd6ff 82%,#d9b8ff 100%);background-size:100% 100%;}
.hero:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,#fff2 0 2px,transparent 2px 22px);pointer-events:none;}
.pic svg{filter:grayscale(1) contrast(1.12)}
.friend{position:absolute;z-index:2;display:grid;place-items:center;width:62px;height:62px;border-radius:22px;background:#ffffffc9;box-shadow:0 8px 20px #62456b25;font-size:38px;animation:friendFloat 3.4s ease-in-out infinite;}
.friend.f1{left:5%;top:23%;transform:rotate(-9deg)}.friend.f2{right:5%;top:30%;animation-delay:-.8s;transform:rotate(8deg)}.friend.f3{left:8%;bottom:20%;animation-delay:-1.4s;transform:rotate(7deg)}.friend.f4{right:7%;bottom:18%;animation-delay:-2s;transform:rotate(-8deg)}.friend.f5{left:28%;top:8%;width:48px;height:48px;font-size:29px;animation-delay:-.5s}.friend.f6{right:27%;bottom:7%;width:50px;height:50px;font-size:30px;animation-delay:-1.8s}
@keyframes friendFloat{0%,100%{translate:0 0;rotate:-5deg}50%{translate:0 -18px;rotate:7deg}}
.hero{border:3px solid #ffffffa8;box-shadow:0 20px 55px #9b55b933,inset 0 0 0 2px #ffffff55}
.mainbtn{background:linear-gradient(110deg,#ff438d,#ff8a42,#8e65f5);background-size:180% 100%;animation:pulse 2.2s ease-in-out infinite,buttonShine 5s linear infinite}
@keyframes buttonShine{to{background-position:180% 0}}
.mascot{width:250px;height:220px;animation:bob 2.8s ease-in-out infinite;filter:drop-shadow(0 18px 16px #68486a20)}
.animal{font-size:150px;animation:mascotHop 3.6s ease-in-out infinite;transform-origin:50% 90%}
.mascot:before,.mascot:after{content:'';position:absolute;border-radius:50%;background:#fff8;filter:blur(2px);z-index:0}.mascot:before{width:48px;height:20px;left:25px;top:95px;animation:cloudMove 3s infinite}.mascot:after{width:58px;height:22px;right:15px;top:125px;animation:cloudMove 3.5s infinite reverse}
.hero h1{letter-spacing:.04em}
@keyframes mascotHop{0%,100%{transform:translateY(0) rotate(-2deg) scale(1)}50%{transform:translateY(-14px) rotate(2deg) scale(1.04)}}
@keyframes cloudMove{50%{transform:translateX(16px)}}
.card .pic{position:relative;overflow:hidden}.card .pic:after{content:'✦';position:absolute;right:8px;top:5px;font-size:18px;opacity:.35;animation:twinkle 2s infinite}
.photoBadge{display:inline-block;margin-top:8px;padding:7px 11px;border-radius:999px;background:#ffffffcc;font-size:12px;font-weight:900}

<body><div class="app"><div class="top"><div class="logo">🌈 <b>ぬりえ</b>スマイル</div><button class="homebtn" onclick="goHome()">⌂ ホーム</button></div>
<section id="home" class="screen active"><div class="hero"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><span class="spark s1">✦</span><span class="spark s2">✧</span><span class="spark s3">★</span><span class="friend f1">🐰</span><span class="friend f2">🐻</span><span class="friend f3">🐥</span><span class="friend f4">🦊</span><span class="friend f5">🐼</span><span class="friend f6">🐸</span><div class="mascot"><div class="animal">🐘</div><div class="heart">💗</div><div class="cloud"></div></div><h1>ぬりえスマイル</h1><p>かわいく、楽しく、好きな色でぬろう！</p><button class="mainbtn" onclick="showCategories()">🎨 ぬりえをはじめる</button><div class="subrow"><button class="subbtn" onclick="photoInput.click()">📷 写真から作る</button><button class="subbtn" onclick="showAbout()">✨ あそびかた</button></div><div class="hint">広告なし ・ 懸賞なし ・ 壁紙機能なし</div></div></section>

<section id="pics" class="screen"><div class="sectionhead"><button class="back" onclick="showCategories()">← 戻る</button><div id="catname" class="title"></div><span></span></div><div id="picgrid" class="grid"></div></section>
<section id="edit" class="screen"><div class="sectionhead"><button class="back" onclick="showPictures()">← 戻る</button><div id="pictureTitle" class="title">ぬりえ</div><button class="back" onclick="resetPaint()">↻</button></div><div class="stage"><canvas id="paint" width="600" height="600"></canvas><svg id="line" viewBox="0 0 600 600"></svg></div><div id="palette" class="palette"></div><div class="tools"><button class="subbtn" onclick="undo()">↶ もどす</button><button class="subbtn" onclick="photoInput2.click()">📷 写真を選ぶ</button><input id="photoInput2" type="file" accept="image/*"></div><p class="note">指でなぞってぬれます。スマホでも操作しやすい大きさです。</p></section>
<section id="about" class="screen"><div class="sectionhead"><button class="back" onclick="goHome()">← 戻る</button><div class="title">あそびかた</div><span></span></div><div class="hero" style="min-height:0;padding:28px 20px"><div style="font-size:70px">🖍️✨</div><h2>かんたん3ステップ</h2><p>① カテゴリーを選ぶ<br>② 好きな絵を選ぶ<br>③ 色を選んで指でぬる</p><button class="mainbtn" onclick="showCategories()">🎨 はじめる</button></div></section>

<script>
const $=id=>document.getElementById(id);let currentCat=0,currentPic=0,color='#ff5a9e',history=[],drawing=false,last=null;
const DATA=[{name:'動物',items:[['ゾウ',elephant],['キリン',giraffe],['クマ',bear],['ウサギ',rabbit],['ネコ',catSvg],['イヌ',dog]]},{name:'海の生き物',items:[['イルカ',dolphin],['クジラ',whale],['カメ',turtle],['タコ',octopus],['ペンギン',penguin],['さかな',fish]]},{name:'鳥',items:[['フクロウ',owl],['ペンギン',penguin],['小鳥',bird],['ワシ',eagle]]},{name:'乗り物',items:[['車',car],['ロケット',rocket],['飛行機',plane],['船',ship],['電車',train],['消防車',firetruck]]},{name:'食べ物',items:[['りんご',apple],['ケーキ',cake],['アイス',ice],['おにぎり',rice],['ドーナツ',donut],['パン',bread]]},{name:'花・植物',items:[['ひまわり',flower],['チューリップ',tulip],['バラ',rose],['四つ葉',clover],['サボテン',cactus],['きのこ',mushroom]]},{name:'宇宙',items:[['月',moon],['太陽',sun],['星',star],['地球',earth],['宇宙船',rocket]]},{name:'恐竜',items:[['ティラノサウルス',dino],['トリケラトプス',triceratops],['ステゴサウルス',stego],['プテラノドン',ptero]]},{name:'ファンタジー',items:[['ドラゴン',dragon],['ユニコーン',unicorn],['お城',castle],['魔法の杖',wand]]},{name:'キャラクター',items:[['ネコ',catSvg],['イヌ',dog],['クマ',bear],['ウサギ',rabbit],['キツネ',fox],['パンダ',panda],['カエル',frog],['ヒヨコ',chick]]},
{name:'昆虫',items:[['チョウ',butterfly],['テントウムシ',ladybug],['ミツバチ',bee],['カブトムシ',beetle],['トンボ',dragonfly]]},
{name:'季節・イベント',items:[['サンタ',santa],['雪だるま',snowman],['かぼちゃ',pumpkin],['こいのぼり',carpflag],['花火',fireworks]]},
{name:'おしごと',items:[['お医者さん',doctor],['消防士',firefighter],['パイロット',pilot],['パン屋さん',baker],['警察官',police]]},
{name:'スポーツ',items:[['サッカーボール',soccer],['野球ボール',baseball],['バスケットボール',basketball],['スケートボード',skateboard],['水泳',swimmer]]},
{name:'お菓子',items:[['プリン',pudding],['キャンディ',candy],['クッキー',cookie],['マカロン',macaron],['カップケーキ',cupcake]]},
{name:'海辺・水族館',items:[['アザラシ',seal],['ラッコ',otter],['クラゲ',jellyfish],['エイ',ray],['タツノオトシゴ',seahorse]]}];
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0)}function goHome(){show('home')}function showAbout(){show('about')}function showCategories(){show('cats');$('catgrid').innerHTML=DATA.map((d,i)=>`<button class="card" onclick="pickCategory(${i})"><div class="pic">${d.items[0][1]()}</div>${d.name}</button>`).join('')}function pickCategory(i){currentCat=i;$('catname').textContent=DATA[i].name;show('pics');$('picgrid').innerHTML=DATA[i].items.map((p,j)=>`<button class="card" onclick="openPicture(${j})"><div class="pic">${p[1]()}</div>${p[0]}</button>`).join('')}function showPictures(){pickCategory(currentCat)}function openPicture(j){currentPic=j;$('pictureTitle').textContent=DATA[currentCat].items[j][0];$('line').innerHTML=DATA[currentCat].items[j][1]();resetPaint();show('edit')}
const colors=['#ff5a9e','#ff6b6b','#ff9f43','#ffd93d','#7ed957','#35c98b','#54c7ec','#4d8bf5','#8e6bd8','#b565c5','#6b4f3a','#333','#fff'];$('palette').innerHTML=colors.map(c=>`<button class="sw" style="background:${c}" onclick="setColor('${c}',this)"></button>`).join('');function setColor(c,e){color=c;document.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel'));e.classList.add('sel')};setTimeout(()=>document.querySelector('.sw')?.classList.add('sel'),0);
const cv=$('paint'),ctx=cv.getContext('2d');ctx.lineCap='round';ctx.lineJoin='round';function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}function start(e){e.preventDefault();history.push(ctx.getImageData(0,0,cv.width,cv.height));drawing=true;last=pos(e);stroke(last,last);if(cv.setPointerCapture)cv.setPointerCapture(e.pointerId)}function move(e){if(!drawing)return;const p=pos(e);stroke(last,p);last=p}function end(){drawing=false}function stroke(a,b){ctx.strokeStyle=color;ctx.lineWidth=28;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}cv.addEventListener('pointerdown',start,{passive:false});cv.addEventListener('pointermove',move,{passive:false});cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);function undo(){if(history.length)ctx.putImageData(history.pop(),0,0)}function resetPaint(){ctx.clearRect(0,0,cv.width,cv.height);history=[]}
const photoInput=$('photoInput'),photoInput2=$('photoInput2');photoInput.addEventListener('change',e=>photoToLine(e.target));photoInput2.addEventListener('change',e=>photoToLine(e.target));function photoToLine(input){const f=input.files?.[0];if(!f)return;const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{const S=600,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,S,S);const sc=Math.min(540/im.width,540/im.height),w=im.width*sc,h=im.height*sc;x.drawImage(im,(S-w)/2,(S-h)/2,w,h);const d=x.getImageData(0,0,S,S),g=new Uint8Array(S*S);for(let y=0;y<S;y++)for(let xx=0;xx<S;xx++){const i=(y*S+xx)*4;g[y*S+xx]=Math.round(.299*d.data[i]+.587*d.data[i+1]+.114*d.data[i+2]);}const out=x.createImageData(S,S);for(let y=1;y<S-1;y++)for(let xx=1;xx<S-1;xx++){const k=y*S+xx,v=g[k],gx=Math.abs(g[k-1]-g[k+1]),gy=Math.abs(g[k-S]-g[k+S]),edge=gx+gy;let line=edge>42?0:255;if(v<55&&edge>18)line=35;out.data[k*4]=out.data[k*4+1]=out.data[k*4+2]=line;out.data[k*4+3]=255;}x.putImageData(out,0,0);const tmp=document.createElement('canvas');tmp.width=tmp.height=S;const tx=tmp.getContext('2d');tx.fillStyle='#fff';tx.fillRect(0,0,S,S);tx.drawImage(c,0,0);tx.globalAlpha=.25;tx.filter='blur(1px)';tx.drawImage(c,0,0);tx.globalAlpha=1;tx.filter='none';$('line').innerHTML='<image href="'+tmp.toDataURL('image/png')+'" width="600" height="600" preserveAspectRatio="xMidYMid meet"/>';resetPaint();$('pictureTitle').textContent='사진ぬりえ';show('edit');URL.revokeObjectURL(url)};im.src=url;input.value=''}
function svg(s){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">${s}</svg>`}function base(){return '<rect x="70" y="70" width="460" height="460" rx="40" fill="#fff" stroke="#333" stroke-width="10"/>'}function face(){return '<circle cx="240" cy="300" r="18" fill="#333"/><circle cx="360" cy="300" r="18" fill="#333"/><path d="M270 365 Q300 390 330 365" fill="none" stroke="#333" stroke-width="10" stroke-linecap="round"/>'}
function elephant(){return svg(base()+'<circle cx="300" cy="310" r="130" fill="#fff" stroke="#333" stroke-width="10"/><circle cx="180" cy="220" r="48" fill="#fff" stroke="#333" stroke-width="10"/><circle cx="420" cy="220" r="48" fill="#fff" stroke="#333" stroke-width="10"/><path d="M300 340 Q255 400 300 455 Q345 400 300 340" fill="#fff" stroke="#333" stroke-width="10"/>'+face())}function giraffe(){return svg(base()+'<path d="M230 450 V260 Q230 160 300 130 Q370 160 370 260 V450" fill="#fff" stroke="#333" stroke-width="10"/><circle cx="300" cy="220" r="105" fill="#fff" stroke="#333" stroke-width="10"/>'+face()+'<circle cx="250" cy="170" r="22" fill="#333"/><circle cx="350" cy="280" r="20" fill="#333"/>')}function bear(){return svg(base()+'<circle cx="300" cy="300" r="145" fill="#fff" stroke="#333" stroke-width="10"/><circle cx="190" cy="195" r="55" fill="#fff" stroke="#333" stroke-width="10"/><circle cx="410" cy="195" r="55" fill="#fff" stroke="#333" stroke-width="10"/>'+face())}function rabbit(){return svg(base()+'<ellipse cx="250" cy="160" rx="45" ry="110" fill="#fff" stroke="#333" stroke-width="10"/><ellipse cx="350" cy="160" rx="45" ry="110" fill="#fff" stroke="#333" stroke-width="10"/><circle cx="300" cy="315" r="130" fill="#fff" stroke="#333" stroke-width="10"/>'+face())}function catSvg(){return svg(base()+'<path d="M185 240 L190 150 L255 205 Q300 180 345 205 L410 150 L415 240" fill="#fff" stroke="#333" stroke-width="10"/><circle cx="300" cy="315" r="125" fill="#fff" stroke="#333" stroke-width="10"/>'+face())}function dog(){return bear()}function car(){return svg(base()+'<path d="M150 360 L205 260 H395 L450 360 V420 H150Z" fill="#fff" stroke="#333" stroke-width="10"/><circle cx="210" cy="420" r="38" fill="#fff" stroke="#333" stroke-width="10"/><circle cx="390" cy="420" r="38" fill="#fff" stroke="#333" stroke-width="10"/><path d="M230 260 L260 205 H340 L370 260" fill="#fff" stroke="#333" stroke-width="10"/>')}function rocket(){return svg(base()+'<path d="M300 120 Q430 210 380 390 L300 470 L220 390 Q170 210 300 120Z" fill="#fff" stroke="#333" stroke-width="10"/><circle cx="300" cy="275" r="45" fill="#fff" stroke="#333" stroke-width="10"/>')}function plane(){return svg(base()+'<path d="M100 315 L270 285 V160 Q300 120 330 160 V285 L500 315 L330 350 V440 H270 V350Z" fill="#fff" stroke="#333" stroke-width="10"/>')}function ship(){return svg(base()+'<path d="M120 380 H480 L420 450 H180Z" fill="#fff" stroke="#333" stroke-width="10"/><path d="M300 380 V160 H400" fill="none" stroke="#333" stroke-width="10"/><path d="M305 170 L450 250 H305Z" fill="#fff" stroke="#333" stroke-width="10"/>')}function apple(){return svg(base()+'<path d="M300 190 Q370 110 430 180 Q480 280 400 410 Q300 490 200 410 Q120 280 170 180 Q230 110 300 190Z" fill="#fff" stroke="#333" stroke-width="10"/><path d="M300 190 Q300 130 350 100" fill="none" stroke="#333" stroke-width="10"/>')}function cake(){return svg(base()+'<path d="M160 300 H440 V430 H160Z" fill="#fff" stroke="#333" stroke-width="10"/><path d="M160 300 Q300 220 440 300" fill="#fff" stroke="#333" stroke-width="10"/><path d="M300 220 V150" stroke="#333" stroke-width="10"/><circle cx="300" cy="135" r="18" fill="#fff" stroke="#333" stroke-width="8"/>')}function ice(){return svg(base()+'<path d="M200 250 H400 L300 470Z" fill="#fff" stroke="#333" stroke-width="10"/><path d="M190 250 Q300 150 410 250" fill="#fff" stroke="#333" stroke-width="10"/>')}function rice(){return svg(base()+'<path d="M180 360 Q300 120 420 360 Q380 450 220 450Z" fill="#fff" stroke="#333" stroke-width="10"/>')}function flower(){return svg(base()+'<circle cx="300" cy="310" r="45" fill="#fff" stroke="#333" stroke-width="10"/><g fill="#fff" stroke="#333" stroke-width="10"><circle cx="300" cy="190" r="65"/><circle cx="410" cy="250" r="65"/><circle cx="410" cy="370" r="65"/><circle cx="300" cy="430" r="65"/><circle cx="190" cy="370" r="65"/><circle cx="190" cy="250" r="65"/></g>')}function tulip(){return svg(base()+'<path d="M240 220 Q300 30
