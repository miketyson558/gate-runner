<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRINCESS COLORING STUDIO</title>
<style>
:root{--bg:#0e1220;--panel:#161c2e;--panel2:#1d2540;--line:#2c3654;--text:#eef2ff;--muted:#9aa6c7;--accent:#ff7ab0;--accent2:#7cc4ff;--good:#5ce0a5}
*{box-sizing:border-box}body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;background:radial-gradient(1200px 700px at 80% -10%,#28345c,transparent),var(--bg);color:var(--text);min-height:100vh}
header{padding:18px 22px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);background:rgba(14,18,32,.85);position:sticky;top:0;z-index:20;backdrop-filter:blur(10px)}
.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:900;color:#101528}
h1{font-size:19px;margin:0;letter-spacing:.5px}h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:12px;margin-top:2px}
.layout{display:grid;grid-template-columns:310px 1fr;gap:16px;padding:16px;max-width:1500px;margin:0 auto}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--panel),#131a2c);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 18px 45px rgba(0,0,0,.25)}
.card h2{font-size:13px;margin:2px 0 10px;color:var(--accent2);letter-spacing:1.4px;text-transform:uppercase}
label{display:block;font-size:11px;color:var(--muted);margin:10px 0 5px}
select,input[type=range]{width:100%}
select,button{font:inherit}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 10px;font-weight:700}
button:hover{border-color:var(--accent2)}
button.primary{background:linear-gradient(135deg,var(--accent),#ff9ec6);border:0;color:#241026}
button.blue{background:linear-gradient(135deg,var(--accent2),#a8e2ff);border:0;color:#0c2136}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:8px}
.sw{aspect-ratio:1;border-radius:8px;border:2px solid transparent;cursor:pointer}
.sw.active{border-color:#fff;transform:scale(1.08)}
.canvas-wrap{position:relative;border-radius:18px;overflow:hidden;background:#fff;min-height:620px;display:grid;place-items:center;border:1px solid var(--line)}
canvas{max-width:100%;display:block;touch-action:none}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.pill{font-size:11px;color:var(--muted);background:#101627;border:1px solid var(--line);padding:6px 10px;border-radius:999px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#182138;border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.25s;z-index:50}
#toast.show{opacity:1}
.hidden{display:none!important}
.preview{width:100%;border-radius:10px;border:1px solid var(--line);background:#fff}
.small{font-size:11px;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<header>
<div class="logo">✦</div>
<div><h1>PRINCESS <span>COLORING</span> STUDIO</h1><div class="sub">ディズニー風リアルタッチ・塗り絵メーカー</div></div>
</header>
<div class="layout">
<aside>
<div class="card">
<h2>キャラクター</h2>
<label>キャラ</label>
<select id="char"><option value="princess">王女・ロングドレス</option><option value="fairy">妖精・羽と花</option><option value="knight">騎士・剣とマント</option><option value="mermaid">人魚・海と泡</option><option value="witch">魔女・魔法の本</option><option value="animal">動物の友達</option></select>
<label>構図</label>
<select id="pose"><option value="portrait">バストアップ</option><option value="full">全身・正面</option><option value="side">横顔・プロフィール</option><option value="action">動きのあるポーズ</option><option value="scene">背景込みの情景</option></select>
<label>服装・デザイン</label>
<select id="style"><option value="royal">ロイヤル・装飾多め</option><option value="cute">キュート・ふんわり</option><option value="adventure">冒険・実用的</option><option value="night">夜・星と月</option><option value="garden">庭園・花飾り</option></select>
<label>線の濃さ <span id="lineVal">2.6</span></label>
<input id="line" type="range" min="1.4" max="4.5" step="0.1" value="2.6">
<button class="primary" id="gen" style="width:100%;margin-top:12px">新しい塗り絵を作る</button>
<button class="blue" id="shuffle" style="width:100%;margin-top:8px">ランダム生成</button>
</div>
<div class="card">
<h2>写真から塗り絵</h2>
<input type="file" id="photo" accept="image/*" class="hidden">
<button class="blue" id="pick" style="width:100%">写真を選ぶ</button>
<img id="prev" class="preview hidden" alt="">
<label>輪郭の強さ <span id="edgeVal">55</span></label>
<input id="edge" type="range" min="15" max="95" value="55">
<label>ディテール <span id="detailVal">55</span></label>
<input id="detail" type="range" min="10" max="100" value="55">
<label>線の太さ <span id="thickVal">1.4</span></label>
<input id="thick" type="range" min="0.8" max="3.5" step="0.1" value="1.4">
<label>白飛ばし <span id="cleanVal">35</span></label>
<input id="clean" type="range" min="0" max="80" value="35">
<button class="primary" id="convert" style="width:100%;margin-top:10px">鮮明な塗り絵に変換</button>
<p class="small">顔・輪郭・細部を保ちながら、塗りやすい黒線と白い塗り面を作ります。変換後にブラシで修正もできます。</p>
</div>
<div class="card">
<h2>お絵かき</h2>
<div class="row"><button data-tool="brush" class="active">ブラシ</button><button data-tool="eraser">消しゴム</button><button data-tool="fill">塗りつぶし</button></div>
<label>太さ <span id="sizeVal">8</span></label><input id="size" type="range" min="2" max="50" value="8">
<div class="palette" id="palette"></div>
<div class="row" style="margin-top:10px"><button id="undo">戻す</button><button id="clear">全消し</button><button id="save">保存</button></div>
</div>
</aside>
<main>
<div class="canvas-wrap"><canvas id="cv" width="1000" height="1250"></canvas></div>
<div class="toolbar"><span class="pill" id="info">キャラを選んで「新しい塗り絵を作る」</span><span class="pill">ブラシ / 消しゴム / 塗りつぶし</span></div>
</main>
</div>
<div id="toast"></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
const state={tool:'brush',color:'#ff5f8f',size:8,drawing:false,last:null,history:[]};
const colors=['#ff5f8f','#ff9f43','#ffd166','#7bd389','#4cc9f0','#7c6cf0','#c77dff','#f4a4c0','#8d6e63','#495057','#212529','#ffffff'];
const pal=document.getElementById('palette');
colors.forEach(c=>{const b=document.createElement('button');b.className='sw';b.style.background=c;b.onclick=()=>{state.color=c;[...pal.children].forEach(x=>x.classList.remove('active'));b.classList.add('active')};if(c==='#ff5f8f')b.classList.add('active');pal.appendChild(b)});
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200)}
function snapshot(){if(state.history.length>18)state.history.shift();state.history.push(cv.toDataURL())}
function restore(){const d=state.history.pop();if(!d)return;const i=new Image();i.onload=()=>{ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(i,0,0)};i.src=d}
function base(){ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height)}
base();
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function drawCharacter(){
 const c=document.getElementById('char').value,p=document.getElementById('pose').value,s=document.getElementById('style').value;
 const lw=+document.getElementById('line').value;document.getElementById('lineVal').textContent=lw;
 base();ctx.strokeStyle='#151922';ctx.fillStyle='#151922';ctx.lineWidth=lw;ctx.lineJoin='round';ctx.lineCap='round';
 const W=cv.width,H=cv.height,cx=W/2;
 const faceY=p==='portrait'?H*.30:H*.24,faceR=p==='portrait'?150:120;
 // hair silhouette
 ctx.beginPath();
 if(c==='princess'||c==='fairy'){ctx.ellipse(cx,faceY-faceR*.55,faceR*1.35,faceR*1.5,0,0,Math.PI*2)}
 else if(c==='mermaid'){ctx.ellipse(cx,faceY-faceR*.35,faceR*1.25,faceR*1.35,0,0,Math.PI*2)}
 else if(c==='witch'){ctx.moveTo(cx-faceR*1.7,faceY-faceR*.2);ctx.lineTo(cx,faceY-faceR*2.4);ctx.lineTo(cx+faceR*1.7,faceY-faceR*.2);ctx.closePath()}
 else if(c==='knight'){ctx.arc(cx,faceY-faceR*.25,faceR*1.25,Math.PI,0);ctx.lineTo(cx+faceR*1.25,faceY+faceR*.3);ctx.lineTo(cx-faceR*1.25,faceY+faceR*.3);ctx.closePath()}
 else{ctx.ellipse(cx,faceY-faceR*.45,faceR*1.45,faceR*1.25,0,0,Math.PI*2)}
 ctx.stroke();
 // face
 ctx.beginPath();ctx.ellipse(cx,faceY,faceR*.82,faceR,0,0,Math.PI*2);ctx.stroke();
 // eyes, nose, mouth
 const ey=faceY-faceR*.08,ex=faceR*.34;
 [[-1],[1]].forEach(([d])=>{ctx.beginPath();ctx.ellipse(cx+d*ex,ey,faceR*.13,faceR*.17,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(cx+d*ex,ey+faceR*.03,faceR*.055,0,Math.PI*2);ctx.fill()});
 ctx.beginPath();ctx.moveTo(cx-faceR*.08,faceY+faceR*.18);ctx.quadraticCurveTo(cx,faceY+faceR*.24,cx+faceR*.08,faceY+faceR*.18);ctx.stroke();
 ctx.beginPath();ctx.moveTo(cx-faceR*.16,faceY+faceR*.42);ctx.quadraticCurveTo(cx,faceY+faceR*.55,cx+faceR*.16,faceY+faceR*.42);ctx.stroke();
 // body / costume
 const bodyY=faceY+faceR*1.05,bodyH=p==='portrait'?H*.42:H*.55,bodyW=faceR*(p==='portrait'?1.5:1.25);
 ctx.beginPath();
 if(c==='mermaid'){ctx.moveTo(cx-bodyW*.45,bodyY);ctx.quadraticCurveTo(cx-bodyW*.2,bodyY+bodyH*.55,cx-bodyW*.12,bodyY+bodyH);ctx.lineTo(cx+bodyW*.12,bodyY+bodyH);ctx.quadraticCurveTo(cx+bodyW*.2,bodyY+bodyH*.55,cx+bodyW*.45,bodyY)}
 else{ctx.moveTo(cx-bodyW*.5,bodyY);ctx.quadraticCurveTo(cx-bodyW*.62,bodyY+bodyH*.55,cx-bodyW*.28,bodyY+bodyH);ctx.lineTo(cx+bodyW*.28,bodyY+bodyH);ctx.quadraticCurveTo(cx+bodyW*.62,bodyY+bodyH*.55,cx+bodyW*.5,bodyY)}
 ctx.closePath();ctx.stroke();
 // arms
 if(p!=='portrait'){ctx.beginPath();ctx.moveTo(cx-bodyW*.48,bodyY+bodyH*.12);ctx.quadraticCurveTo(cx-bodyW*.85,bodyY+bodyH*.3,cx-bodyW*.6,bodyY+bodyH*.5);ctx.stroke();ctx.beginPath();ctx.moveTo(cx+bodyW*.48,bodyY+bodyH*.12);ctx.quadraticCurveTo(cx+bodyW*.85,bodyY+bodyH*.3,cx+bodyW*.6,bodyY+bodyH*.5);ctx.stroke()}
 // decorations by style
 ctx.save();
 if(s==='royal'){for(let i=0;i<9;i++){const x=cx-bodyW*.45+i*bodyW*.11;ctx.beginPath();ctx.arc(x,bodyY+bodyH*.18,7,0,Math.PI*2);ctx.stroke()}}
 if(s==='cute'){for(let i=0;i<7;i++){const x=cx-bodyW*.4+i*bodyW*.13,y=bodyY+bodyH*(.2+i*.05);ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.stroke()}}
 if(s==='adventure'){ctx.beginPath();ctx.moveTo(cx-bodyW*.7,bodyY+bodyH*.28);ctx.lineTo(cx+bodyW*.7,bodyY+bodyH*.28);ctx.stroke()}
 if(s==='night'){for(let i=0;i<26;i++){const x=Math.random()*W,y=Math.random()*H*.35,r=Math.random()*3+1;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke()}}
 if(s==='garden'){for(let i=0;i<16;i++){const x=Math.random()*W,y=H*.78+Math.random()*H*.16;ctx.beginPath();ctx.arc(x,y,Math.random()*16+8,0,Math.PI*2);ctx.stroke()}}
 ctx.restore();
 // accessories
 if(c==='fairy'){[[cx-faceR*2.1,faceY-faceR*.8],[cx+faceR*2.1,faceY-faceR*.8]].forEach(([x,y])=>{ctx.beginPath();ctx.ellipse(x,y,faceR*.75,faceR*.42,-.5,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.ellipse(x,y,faceR*.45,faceR*.28,-.5,0,Math.PI*2);ctx.stroke()})}
 if(c==='knight'){ctx.beginPath();ctx.moveTo(cx-faceR*.5,bodyY+bodyH*.35);ctx.lineTo(cx+faceR*.7,bodyY+bodyH*.18);ctx.stroke()}
 if(c==='mermaid'){for(let i=0;i<18;i++){const x=Math.random()*W,y=Math.random()*H;ctx.beginPath();ctx.arc(x,y,Math.random()*22+6,0,Math.PI*2);ctx.stroke()}}
 if(c==='witch'){ctx.beginPath();ctx.moveTo(cx-faceR*1.8,faceY-faceR*1.7);ctx.quadraticCurveTo(cx,faceY-faceR*2.8,cx+faceR*1.8,faceY-faceR*1.7);ctx.stroke()}
 if(c==='animal'){ctx.beginPath();ctx.arc(cx-faceR*1.6,faceY-faceR*.8,faceR*.35,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(cx+faceR*1.6,faceY-faceR*.8,faceR*.35,0,Math.PI*2);ctx.stroke()}
 document.getElementById('info').textContent=`生成完了：${c} / ${p} / ${s}`;
 toast('新しい塗り絵を生成しました');
}
document.getElementById('gen').onclick=()=>{snapshot();drawCharacter()};
document.getElementById('shuffle').onclick=()=>{['char','pose','style'].forEach(id=>{const el=document.getElementById(id);el.selectedIndex=Math.floor(Math.random()*el.options.length)});snapshot();drawCharacter()};
// photo conversion: luminance + local contrast + edge detection + cleanup
function toLineArt(img){
 const maxW=1000,scale=Math.min(1,maxW/img.width),w=Math.round(img.width*scale),h=Math.round(img.height*scale);
 const off=document.createElement('canvas');off.width=w;off.height=h;const o=off.getContext('2d');
 o.fillStyle='#fff';o.fillRect(0,0,w,h);o.drawImage(img,0,0,w,h);
 const src=o.getImageData(0,0,w,h),d=src.data,gray=new Float32Array(w*h);
 for(let i=0,p=0;i<d.length;i+=4,p++){gray[p]=.299*d[i]+.587*d[i+1]+.114*d[i+2]}
 const detail=+document.getElementById('detail').value/100,edge=+document.getElementById('edge').value/100,clean=+document.getElementById('clean').value/100;
 const radius=Math.max(1,Math.round(3+(1-detail)*7)),box=radius*2+1;
 const blur=new Float32Array(w*h);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){let s=0,n=0;for(let dy=-radius;dy<=radius;dy++){const yy=y+dy;if(yy<0||yy>=h)continue;for(let dx=-radius;dx<=radius;dx++){const xx=x+dx;if(xx<0||xx>=w)continue;s+=gray[yy*w+xx];n++}}blur[y*w+x]=s/n}
 // Sobel on local contrast
 const mag=new Float32Array(w*h);let mx=0;
 for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
  const i=y*w+x,gx=-gray[i-w-1]-2*gray[i-1]-gray[i+w-1]+gray[i-w+1]+2*gray[i+1]+gray[i+w+1];
  const gy=-gray[i-w-1]-2*gray[i-w]-gray[i-w+1]+gray[i+w-1]+2*gray[i+w]+gray[i+w+1];
  const local=gray[i]-blur[i];const v=Math.hypot(gx,gy)*.7+Math.abs(local)*2.2;mag[i]=v;mx=Math.max(mx,v);
 }
 const threshold=mx*(.10+edge*.30);
 const out=o.createImageData(w,h);
 for(let i=0,p=0;i<d.length;i+=4,p++){
  let dark=mag[p]>threshold;
  // preserve dark photo regions lightly, but keep coloring areas open
  if(!dark&&gray[p]<70&&clean<55)dark=true;
  if(dark&&clean>0){const t=70+clean*2.0;if(gray[p]>t&&mag[p]<threshold*1.25)dark=false}
  const v=dark?18:255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;
 }
 o.putImageData(out,0,0);
 // thin/thicken lines
 const final=document.createElement('canvas');final.width=w;final.height=h;const f=final.getContext('2d');
 f.fillStyle='#fff';f.fillRect(0,0,w,h);f.drawImage(off,0,0);
 if(+document.getElementById('thick').value>1){f.globalCompositeOperation='source-over';f.filter=`blur(${(+document.getElementById('thick').value-1)*.7}px)`;f.drawImage(final,0,0);f.filter='none'}
 // fit onto main canvas
 base();const fit=Math.min(cv.width/w,cv.height/h),dw=w*fit,dh=h*fit;
 ctx.drawImage(final,(cv.width-dw)/2,(cv.height-dh)/2,dw,dh);
 document.getElementById('info').textContent='写真を鮮明な塗り絵に変換しました';
 toast('変換完了：線をなぞって塗りやすく調整できます');
}
document.getElementById('pick').onclick=()=>document.getElementById('photo').click();
document.getElementById('photo').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{document.getElementById('prev').src=img.src;document.getElementById('prev').classList.remove('hidden');snapshot();toLineArt(img)};img.src=URL.createObjectURL(f)};
['edge','detail','thick','clean'].forEach(id=>document.getElementById(id).oninput=e=>document.getElementById(id+'Val').textContent=e.target.value);
document.getElementById('convert').onclick=()=>{const p=document.getElementById('prev');if(p.classList.contains('hidden')){toast('先に写真を選んでください');return}snapshot();const img=new Image();img.onload=()=>toLineArt(img);img.src=p.src};
// painting
function pos(e){const r=cv.getBoundingClientRect();const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;const y=(e.touches?e.touches[0].clientY:e.clientY)-r.top;return{x:x*cv.width/r.width,y:y*cv.height/r.height}}
function start(e){e.preventDefault();snapshot();state.drawing=true;state.last=pos(e);if(state.tool==='fill'){flood(state.last.x|0,state.last.y|0,state.color);state.drawing=false}}
function move(e){if(!state.drawing)return;e.preventDefault();const p=pos(e);ctx.globalCompositeOperation=state.tool==='eraser'?'destination-out':'source-over';ctx.strokeStyle=state.tool==='eraser'?'rgba(0,0,0,1)':state.color;ctx.lineWidth=state.size;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(state.last.x,state.last.y);ctx.lineTo(p.x,p.y);ctx.stroke();state.last=p}
function end(){state.drawing=false;ctx.globalCompositeOperation='source-over'}
cv.addEventListener('pointerdown',start);cv.addEventListener('pointermove',move);addEventListener('pointerup',end);cv.addEventListener('touchstart',start,{passive:false});cv.addEventListener('touchmove',move,{passive:false});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{state.tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
document.getElementById('size').oninput=e=>{state.size=+e.target.value;document.getElementById('sizeVal').textContent=e.target.value};
document.getElementById('undo').onclick=restore;
document.getElementById('clear').onclick=()=>{snapshot();base();toast('キャンバスを初期化しました')};
document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.download='coloring-page.png';a.href=cv.toDataURL();a.click();toast('PNGを保存しました')};
function flood(x,y,hex){
 const img=ctx.getImageData(0,0,cv.width,cv.height),d=img.data,W=cv.width,H=cv.height;
 const idx=(y*W+x)*4,target=[d[idx],d[idx+1],d[idx+2],d[idx+3]];
 const fill=[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16),255];
 if(target.every((v,i)=>v===fill[i]))return;
 const match=(i)=>Math.abs(d[i]-target[0])<32&&Math.abs(d[i+1]-target[1])<32&&Math.abs(d[i+2]-target[2])<32&&Math.abs(d[i+3]-target[3])<32;
 const stack=[[x,y]];
 while(stack.length){const[cx,cy]=stack.pop();if(cx<0||cy<0||cx>=W||cy>=H)continue;const i=(cy*W+cx)*4;if(!match(i))continue;d[i]=fill[0];d[i+1]=fill[1];d[i+2]=fill[2];d[i+3]=255;stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1])}
 ctx.putImageData(img,0,0);
}
drawCharacter();
</script>
</body>
</html>
