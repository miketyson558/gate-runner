<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>カラフルぬりえワールド | Coloring World</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HOME -->
  <div id="home" class="screen active">
    <div class="home-bg"></div>
    <div class="floating-chars" id="floatingChars"></div>
    <div class="home-header">
      <h1>カラフルぬりえワールド</h1>
      <p>オリジナル線画600種類で楽しくぬりえしよう！</p>
    </div>
    <div class="home-actions">
      <button class="btn btn-primary" id="btnStart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        ぬりえをはじめる
      </button>
      <button class="btn btn-secondary" id="btnPhoto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
        写真から線画をつくる
      </button>
      <button class="btn btn-ghost" id="btnSettingsHome">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        設定・BGM
      </button>
    </div>
  </div>

  <!-- CATEGORY -->
  <div id="category" class="screen">
    <div class="top-bar">
      <button class="icon-btn" id="btnBackHome" aria-label="戻る">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <h2>カテゴリーを選ぶ（全20種）</h2>
      <button class="icon-btn" id="btnSettingsCat" aria-label="設定">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
    <div class="cat-grid" id="catGrid"></div>
  </div>

  <!-- GALLERY -->
  <div id="gallery" class="screen">
    <div class="top-bar">
      <button class="icon-btn" id="btnBackCat" aria-label="戻る">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <h2 id="galleryTitle">ギャラリー</h2>
      <div style="width:44px"></div>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>

  <!-- COLORING -->
  <div id="coloring" class="screen">
    <div class="top-bar">
      <button class="icon-btn" id="btnBackGallery" aria-label="戻る">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <h2 id="coloringTitle">ぬりえ</h2>
      <button class="icon-btn" id="btnUndo" aria-label="元に戻す" title="元に戻す">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 7v6h6M3 13a9 9 0 101.5-5.5"/></svg>
      </button>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="mainCanvas"></canvas>
      <div class="loader" id="loader"><div class="spinner"></div><span>処理中...</span></div>
    </div>
    <div class="toolbar">
      <div class="status-bar">
        <span id="toolLabel">クレヨン</span>
        <span id="sizeLabel">太さ: 12</span>
      </div>
      <div class="tool-row" id="toolRow"></div>
      <div class="tool-row" id="colorRow"></div>
      <div class="tool-row">
        <label style="font-size:0.8rem;white-space:nowrap">太さ</label>
        <input type="range" min="2" max="40" value="12" class="size-slider" id="sizeSlider">
        <button class="tool-btn" id="btnClear" title="全消去" style="width:auto;padding:0 12px">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
        </button>
        <button class="tool-btn" id="btnSave" title="保存" style="width:auto;padding:0 12px">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h3>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        設定
      </h3>
      <div class="setting-row">
        <label>BGM</label>
        <input type="checkbox" id="bgmToggle" checked>
      </div>
      <div class="setting-row">
        <label>BGM音量</label>
        <input type="range" min="0" max="100" value="40" id="bgmVolume" style="width:140px">
      </div>
      <div class="setting-row">
        <label>効果音</label>
        <input type="checkbox" id="sfxToggle" checked>
      </div>
      <div class="setting-row">
        <label>効果音量</label>
        <input type="range" min="0" max="100" value="50" id="sfxVolume" style="width:140px">
      </div>
      <p style="margin:12px 0 8px;font-size:0.9rem;opacity:0.85">BGMを選ぶ</p>
      <div class="bgm-list" id="bgmList"></div>
      <button class="btn btn-primary" style="margin-top:20px;width:100%" id="btnCloseSettings">閉じる</button>
    </div>
  </div>

  <!-- PHOTO MODAL -->
  <div class="modal-overlay" id="photoModal">
    <div class="modal">
      <h3>写真から線画をつくる</h3>
      <p style="font-size:0.9rem;opacity:0.85;margin-bottom:12px">カメラで撮るかアルバムから選んで、ぬりえ用の線画に変換します。</p>
      <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">
      <button class="btn btn-secondary" style="width:100%;margin-bottom:10px" id="btnPickPhoto">写真を選ぶ / 撮る</button>
      <img id="photoPreview" class="photo-preview" style="display:none" alt="preview">
      <div id="photoControls" style="display:none">
        <div class="setting-row">
          <label>線の太さ・感度</label>
          <input type="range" min="10" max="80" value="35" id="edgeThreshold">
        </div>
        <div class="setting-row">
          <label>反転（白線）</label>
          <input type="checkbox" id="invertLine">
        </div>
        <button class="btn btn-accent" style="width:100%;margin-top:12px" id="btnConvertPhoto">線画に変換してぬる</button>
      </div>
      <button class="btn btn-ghost" style="width:100%;margin-top:12px" id="btnClosePhoto">キャンセル</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="data/svg-generator.js"></script>
  <script src="data/categories.js"></script>
  <script src="app.js"></script>
</body>
</html>
